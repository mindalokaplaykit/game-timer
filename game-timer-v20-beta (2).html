espeichert","Saved configurations can be loaded and reused later.":"Gespeicherte Konfigurationen können später geladen und wiederverwendet werden.","Scales the title, phase, secondary timer, and progress without changing the Main Timer size.":"Skaliert Titel, Phase, Sekundärtimer und Fortschritt, ohne die Größe des Haupttimers zu ändern.","Screen Awake":"Bildschirm aktiv halten","Search presets…":"Presets suchen…","Seconds":"Sekunden","Section":"Abschnitt","Sections":"Abschnitte","See elapsed/remaining time, current section, rounds, laps, and make quick timing adjustments.":"Verstrichene/verbleibende Zeit, aktuellen Abschnitt, Runden und Laps sehen sowie schnelle Zeitanpassungen vornehmen.","See what has happened, what is happening now, and what remains. Adjust time or rounds without leaving Live.":"Sehen Sie, was passiert ist, was gerade läuft und was noch kommt. Passen Sie Zeit oder Runden an, ohne Live zu verlassen.","Sequence":"Sequence","Session":"Session","Session History":"Session-Verlauf","Session Map":"Session-Karte","Session Status":"Session-Status","Session Title":"Session-Titel","Session status":"Session-Status","Sessions":"Sessions","Set identity, start behavior, participant display, sizes, typography, theme, sound, and Curtain behavior.":"Identität, Startverhalten, Teilnehmeranzeige, Größen, Typografie, Thema, Ton und Curtain-Verhalten einstellen.","Set up the session and participant display":"Session und Teilnehmeranzeige einrichten","Settings":"Einstellungen","Several different phases in order.":"Mehrere unterschiedliche Phasen nacheinander.","Several timed rounds or attempts.":"Mehrere zeitgesteuerte Runden oder Versuche.","Shortcuts":"Tastenkürzel","Show Main Timer":"Haupttimer anzeigen","Show a countdown before the timer starts.":"Vor dem Timerstart einen Countdown anzeigen.","Show a large message such as MOVE!, STOP!, or a rule change.":"Eine große Nachricht wie WECHSEL!, STOPP! oder eine Regeländerung anzeigen.","Show message":"Nachricht anzeigen","Show or hide participant information and adjust the live display while the session is running.":"Teilnehmerinformationen ein-/ausblenden und die Live-Anzeige während der Session anpassen.","Show timer":"Timer anzeigen","Simple":"Simple","Simple Timer":"Einfacher Timer","Soft":"Soft","Sound":"Ton","Space Pause/Resume · N Next · B Previous · M Message · C Curtain/Return · F Fullscreen.":"Leertaste Pause/Fortsetzen · N Weiter · B Zurück · M Nachricht · C Curtain/Zurück · F Vollbild.","Standard presentation mode":"Standard-Präsentationsmodus","Start":"Start","Starts at 00:00 and keeps running until you press Finish or Next.":"Startet bei 00:00 und läuft weiter, bis Sie Beenden oder Weiter drücken.","Starts at 00:00 and records elapsed time until you finish.":"Startet bei 00:00 und zeichnet die verstrichene Zeit auf, bis Sie beenden.","Starts from a set duration and counts down to 00:00.":"Startet mit einer festgelegten Dauer und zählt bis 00:00 herunter.","Starts immediately with no 3–2–1.":"Startet sofort ohne 3–2–1.","Starts the session using the selected Immediate or 3–2–1–GO behavior.":"Startet die Session mit dem ausgewählten Verhalten Sofort oder 3–2–1–GO.","Stop":"Stopp","Stop at 00:00 and wait for the facilitator.":"Bei 00:00 stoppen und auf den Moderator warten.","Stopwatch":"Stoppuhr","Subtitle":"Untertitel","Subtitle (optional)":"Untertitel (optional)","Supported":"Unterstützt","THEME":"THEMA","TIME ADJUSTMENT":"ZEITANPASSUNG","TIME FLOW":"ZEITABLAUF","TIME'S UP":"ZEIT ABGELAUFEN","TIMER":"TIMER","TIMER SIZE":"TIMERGRÖSSE","TITLE SIZE":"TITELGRÖSSE","TOTAL SESSION TIME":"GESAMTE SESSION-ZEIT","Temporarily replace the participant display with one selected item, such as Current Timer or Round, while time keeps running.":"Die Teilnehmeranzeige vorübergehend durch ein ausgewähltes Element wie Aktueller Timer oder Runde ersetzen, während die Zeit weiterläuft.","Test Finish":"Endton testen","Test Start":"Startton testen","The Live Preview inside Settings updates immediately. Full Preview opens the participant display at full size.":"Die Live-Vorschau in Einstellungen aktualisiert sich sofort. Volle Vorschau öffnet die Teilnehmeranzeige in voller Größe.","The Main Timer and other display elements can be scaled independently. 100% Main Timer means Full Fit.":"Haupttimer und andere Anzeigeelemente können unabhängig skaliert werden. 100% Haupttimer entspricht Full Fit.","The PWA can keep critical timing functions running after it has loaded.":"Die PWA kann kritische Timing-Funktionen nach dem Laden weiter ausführen.","The PWA is designed to keep critical timing features local after it has been loaded and cached. For the best offline behavior, run it from HTTPS or localhost.":"Die PWA ist so ausgelegt, dass kritische Timing-Funktionen nach dem Laden und Cachen lokal weiterlaufen. Für bestes Offline-Verhalten über HTTPS oder localhost starten.","The app theme changes Home, Builder, and setup panels. Participant display themes remain session-specific.":"Das App-Thema ändert Startseite, Builder und Einrichtungs-Panels. Themen der Teilnehmeranzeige bleiben sessionspezifisch.","The loop continues until the facilitator finishes the session.":"Der Loop läuft weiter, bis der Moderator die Session beendet.","The loop stops when the main duration ends.":"Der Loop endet, wenn die Hauptdauer abläuft.","The saved draft will be replaced with a new session.":"Der gespeicherte Entwurf wird durch eine neue Session ersetzt.","The session can run without cues. Add one if you need a reminder, message, sound, or display change.":"Die Session kann ohne Cues laufen. Fügen Sie einen hinzu, wenn Sie eine Erinnerung, Nachricht, einen Ton oder eine Anzeigeänderung brauchen.","The timer freezes. You can Resume or Stop. Stop always asks for confirmation before saving the result to the summary.":"Der Timer friert ein. Sie können Fortsetzen oder Stopp wählen. Stopp fragt immer nach Bestätigung, bevor das Ergebnis in der Zusammenfassung gespeichert wird.","The timer starts as soon as START is pressed. No 3–2–1.":"Der Timer startet, sobald START gedrückt wird. Kein 3–2–1.","The timer will stop and the session results will be saved on the summary page.":"Der Timer stoppt und die Session-Ergebnisse werden auf der Zusammenfassungsseite gespeichert.","Theme":"Thema","This preset will be removed from this browser.":"Dieses Preset wird aus diesem Browser entfernt.","This preview updates immediately as you change the settings.":"Diese Vorschau aktualisiert sich sofort, wenn Sie Einstellungen ändern.","Time":"Zeit","Time Adjustment":"Zeitanpassung","Timeline":"Timeline","Timer Size":"Timergröße","Timer Spacing":"Timer-Abstand","Timer Type":"Timer-Typ","Title":"Titel","Title & Phase Size":"Titel- & Phasengröße","Title (optional)":"Titel (optional)","Total Rounds":"Gesamtrunden","Total rounds cannot be lower than the current round.":"Die Gesamtzahl der Runden darf nicht kleiner als die aktuelle Runde sein.","Transition":"Übergang","Try another search or category.":"Versuchen Sie eine andere Suche oder Kategorie.","Two alternating intervals, such as Work/Rest.":"Zwei abwechselnde Intervalle, z. B. Arbeit/Pause.","USED":"VERWENDET","Until dismissed":"Bis geschlossen","Untitled Session":"Unbenannte Session","Use":"Verwenden","Use ":"Verwenden ","Use Quick Timer for a simple timing need, or Create Session for structured facilitation.":"Nutzen Sie Quick Timer für einen einfachen Timing-Bedarf oder Create Session für strukturierte Moderation.","Use Quick Timer for one timer. Use Simple for one structured section, Loop for one repeating interval, Alternating for two timed states that switch back and forth, Rounds for repeated attempts, Sequence for multiple phases, and Timeline for a main timer with timed cues.":"Nutzen Sie Quick Timer für einen Timer. Nutzen Sie Simple für einen strukturierten Abschnitt, Loop für wiederholte Intervalle, Rounds für wiederholte Versuche, Sequence für mehrere Phasen und Timeline für einen Haupttimer mit zeitgesteuerten Cues.","Use Simple for one timer, Loop for repeating intervals, Rounds for repeated attempts, Sequence for multiple phases, and Timeline for a main timer with timed cues.":"Nutzen Sie Simple für einen Timer, Loop für wiederholte Intervalle, Rounds für wiederholte Versuche, Sequence für mehrere Phasen und Timeline für einen Haupttimer mit zeitgesteuerten Cues.","Use a structured session when you need Loops, Rounds, Sequences, Timelines, cues, display rules, or multiple sections.":"Nutzen Sie eine strukturierte Session, wenn Sie Loops, Rounds, Sequences, Timelines, Cues, Anzeigeregeln oder mehrere Abschnitte benötigen.","Use fullscreen for a clean participant display. The browser requires a user click to enter fullscreen.":"Nutzen Sie Vollbild für eine saubere Teilnehmeranzeige. Der Browser benötigt einen Benutzerklick, um Vollbild zu öffnen.","Use the arrows or mouse wheel":"Verwenden Sie die Pfeile oder das Mausrad","Wait":"Warten","What does LAP do?":"Was macht LAP?","What does your activity look like?":"Wie sieht Ihre Aktivität aus?","What happens if I refresh or the browser closes unexpectedly?":"Was passiert, wenn ich aktualisiere oder der Browser unerwartet geschlossen wird?","What happens when I press Pause?":"Was passiert, wenn ich Pause drücke?","What is Curtain?":"Was ist Curtain?","What is Maximum Legibility?":"Was ist Maximale Lesbarkeit?","What is Session History?":"Was ist Session History?","What is a CUE?":"Was ist ein CUE?","What is a Preset?":"Was ist ein Preset?","What is the difference between Main Timer and Current Timer?":"Was ist der Unterschied zwischen Haupttimer und aktuellem Timer?","What is the difference between Quick Timer and Create Session?":"Was ist der Unterschied zwischen Quick Timer und Create Session?","What should Curtain show?":"Was soll Curtain anzeigen?","When Time Ends":"Wenn die Zeit endet","When should this cue run?":"Wann soll dieser Cue laufen?","When time ends, automatically move to the next section.":"Wenn die Zeit endet, automatisch zum nächsten Abschnitt wechseln.","When?":"Wann?","Which mode should I choose?":"Welchen Modus soll ich wählen?","Why does fullscreen not start automatically?":"Warum startet Vollbild nicht automatisch?","Yes, when the active block is Rounds. Session Status provides Round Adjustment controls and updates the total automatically.":"Ja, wenn der aktive Block Rounds ist. Session Status bietet Rundenanpassungen und aktualisiert die Gesamtzahl automatisch.","Yes. Edit the Loop and set Loop Limit to No time limit (∞). The interval keeps repeating until you finish the session.":"Ja. Bearbeiten Sie den Loop und setzen Sie Loop-Limit auf Kein Zeitlimit (∞). Das Intervall wiederholt sich, bis Sie die Session beenden.","Yes. In Settings → Accessibility & Projector, change Preview Aspect Ratio to 4:3.":"Ja. Ändern Sie unter Einstellungen → Barrierefreiheit & Projektor das Vorschau-Seitenverhältnis auf 4:3.","Yes. Open DISPLAY and change Theme, Font, Timer Size, Display Scale, Title & Phase Size, or Timer Spacing while the session keeps running.":"Ja. Öffnen Sie ANZEIGE und ändern Sie Thema, Schrift, Timergröße, Anzeigeskalierung, Titel- & Phasengröße oder Timer-Abstand, während die Session weiterläuft.","Yes. Open Other Controls → Save as Preset. You will be asked to name and categorize it before it is saved.":"Ja. Öffnen Sie Weitere Steuerungen → Als Preset speichern. Vor dem Speichern werden Sie nach Name und Kategorie gefragt.","Yes. Open Preset Library and Export a preset as JSON, then Import that file on another device.":"Ja. Öffnen Sie die Preset-Bibliothek und exportieren Sie ein Preset als JSON. Importieren Sie die Datei anschließend auf einem anderen Gerät.","Yes. Open Session Status to use quick adjustments or enter an exact amount to add or subtract. The clock remains timestamp-based and continues accurately.":"Ja. Öffnen Sie Session Status für schnelle Anpassungen oder geben Sie einen exakten Betrag zum Hinzufügen oder Abziehen ein. Die Uhr bleibt timestamp-basiert und läuft genau weiter.","Your previous session did not finish":"Ihre vorherige Session wurde nicht beendet","single section":"ein Abschnitt","when you only need a Countdown, Count Up, or Stopwatch and want to start immediately.":"wenn Sie nur einen Countdown, Count Up oder eine Stoppuhr brauchen und sofort starten möchten.","▶ Test Finish":"▶ Endton testen","▶ Test Start":"▶ Startton testen","★ Favorites":"★ Favoriten","Data & Offline":"Daten & Offline","Drafts, presets, history, recovery data, and saved voice cues stay on this device. After the PWA has loaded, critical timing can keep working offline.":"Entwürfe, Presets, Verlauf und Wiederherstellungsdaten bleiben auf diesem Gerät. Nach dem Laden der PWA können wichtige Timing-Funktionen offline weiterlaufen."},"zh":{" when you only need a Countdown, Count Up, or Stopwatch and want to start immediately.":" 当您只需要倒计时、正计时或秒表，并希望立即开始时。","+ SAVE CURRENT":"+ 保存当前设置","1. Identity":"1. 基本信息","10 seconds":"10 秒","10-minute challenge / open-ended elapsed time":"10 分钟挑战 / 开放式计时","16:9 widescreen":"16:9 宽屏","2 seconds":"2 秒","2. Start":"2. 开始方式","3. Display":"3. 显示","4. Size & Typography":"4. 尺寸与排版","4:3 projector":"4:3 投影","5 rounds × 2 minutes":"5 轮 × 2 分钟","5 seconds":"5 秒","5. Theme":"5. 主题","6. Sound":"6. 声音","7. Curtain":"7. Curtain","8. Accessibility & Projector":"8. 可读性与投影","? HELP":"? 帮助","? Help":"? 帮助","A Preset is a reusable session configuration. It stores the structure and settings, not the current runtime position.":"Preset 是可重复使用的 Session 配置。它保存结构和设置，不保存当前运行位置。","A cue is a prepared reminder or action. Timed cues run automatically. Manual cues wait until you press CUE during Live.":"Cue 是预先准备的提醒或操作。定时 Cue 会自动执行；手动 Cue 会等待您在 Live 中按下 CUE。","A cue is a reminder or action during the session. Timed cues run automatically. Prepared cues run when you press CUE.":"Cue 是 Session 期间的提醒或操作。定时 Cue 会自动执行；预设 Cue 会在您按下 CUE 时执行。","A lightweight record of completed sessions on this browser. No cloud account is required.":"此浏览器中的轻量级已完成 Session 记录，无需云端账号。","A local log of completed sessions including actual duration, laps, cues, round changes, and time adjustments.":"本地保存已完成 Session 的记录，包括实际时长、Lap、Cue、轮次变化和时间调整。","A repeating interval, including open-ended loops.":"重复执行的时间间隔，也支持无限循环。","A repeating interval, with an optional overall time limit.":"重复执行的时间间隔，可选总体时间限制。","A repeating interval, with or without an overall time limit.":"重复执行的时间间隔，可有或没有总体时间限制。","A session must have at least one section.":"一个 Session 至少需要一个环节。","A short countdown appears before the timer starts.":"计时器开始前显示简短倒计时。","A timed cue runs automatically at a selected time. A prepared CUE runs only when you press CUE during the live session.":"定时 Cue 会在指定时间自动执行；预设 CUE 仅在 Live Session 中按下 CUE 时执行。","A/B Loop":"A/B 循环","ABOUT":"关于","ADD CUE":"添加 CUE","ADD SECTION":"添加环节","APP SETTINGS":"应用设置","APPLY":"应用","Accessibility":"可读性","Action":"操作","Actual":"实际","Add or subtract":"增加或减少","Adjustments / Cues":"调整 / Cue","After 00:00, continue counting as overtime (+00:01, +00:02, and so on).":"到达 00:00 后继续以 Overtime 方式计时（+00:01、+00:02……）。","All":"全部","All categories":"全部分类","Already working on a session?":"已经在编辑一个 Session？","Always visible":"始终显示","App Theme":"应用主题","App settings":"应用设置","At minute 5 change leader; at minute 10 change the rule":"第 5 分钟更换 Leader；第 10 分钟修改规则","Automatic — after elapsed time":"自动 — 按已用时间","Automatic — at remaining time":"自动 — 按剩余时间","BEFORE YOU START":"开始之前","BUILT-IN":"内置","Back":"返回","Browse built-in and saved presets, mark favorites, duplicate, categorize, import, and export reusable session setups.":"浏览内置和已保存的 Preset，可收藏、复制、分类、导入和导出以重复使用。","Browser dependent":"取决于浏览器","Browsers require fullscreen to be triggered by a user action. Press the Fullscreen button or F.":"浏览器要求由用户操作触发全屏。请按全屏按钮或 F。","Built-in":"内置","CANCEL":"取消","CHOOSE HOW TIME RUNS":"选择计时方式","CLEAR HISTORY":"清除历史记录","CLOSE ×":"关闭 ×","COMMON QUESTIONS":"常见问题","CONTINUE DRAFT":"继续草稿","COUNT UP":"正计时","COUNTDOWN":" s. Participant display themes remain session-specific.":"アプリテーマは Home、Builder、設定パネルに適用されます。参加者表示のテーマは Session ごとに独立しています。","The loop continues until the facilitator finishes the session.":"ファシリテーターが Session を終了するまで Loop は続きます。","The loop stops when the main duration ends.":"Main の時間が終わると Loop も停止します。","The saved draft will be replaced with a new session.":"保存済みの下書きは新しい Session に置き換えられます。","The session can run without cues. Add one if you need a reminder, message, sound, or display change.":"Session は Cue なしでも実行できます。リマインダー、メッセージ、サウンド、表示変更が必要なら追加してください。","The timer freezes. You can Resume or Stop. Stop always asks for confirmation before saving the result to the summary.":"タイマーは停止します。Resume または Stop を選べます。Stop は結果をサマリーに保存する前に必ず確認します。","The timer starts as soon as START is pressed. No 3–2–1.":"START を押すとタイマーがすぐ開始します。3–2–1 はありません。","The timer will stop and the session results will be saved on the summary page.":"タイマーを停止し、Session の結果をサマリーページに保存します。","Theme":"テーマ","This preset will be removed from this browser.":"この Preset はこのブラウザーから削除されます。","This preview updates immediately as you change the settings.":"設定を変更すると、このプレビューはすぐ更新されます。","Time":"時間","Time Adjustment":"時間調整","Timeline":"Timeline","Timer Size":"タイマーサイズ","Timer Spacing":"タイマー間隔","Timer Type":"タイマータイプ","Title":"タイトル","Title & Phase Size":"タイトル & フェーズサイズ","Title (optional)":"タイトル（任意）","Total Rounds":"総ラウンド数","Total rounds cannot be lower than the current round.":"総ラウンド数は現在のラウンドより少なくできません。","Transition":"トランジション","Try another search or category.":"別の検索語またはカテゴリーを試してください。","Two alternating intervals, such as Work/Rest.":"Work/Rest のような 2 つの交互インターバル。","USED":"使用済み","Until dismissed":"閉じるまで","Untitled Session":"無題の Session","Use":"使用","Use ":"使用 ","Use Quick Timer for a simple timing need, or Create Session for structured facilitation.":"単純な計時には Quick Timer、構造化されたファシリテーションには Create Session を使います。","Use Quick Timer for one timer. Use Simple for one structured section, Loop for one repeating interval, Alternating for two timed states that switch back and forth, Rounds for repeated attempts, Sequence for multiple phases, and Timeline for a main timer with timed cues.":"1 つのタイマーなら Quick Timer。1 つの構造化セクションは Simple、繰り返し間隔は Loop、繰り返し試行は Rounds、複数フェーズは Sequence、タイム Cue 付き Main Timer は Timeline を使います。","Use Simple for one timer, Loop for repeating intervals, Rounds for repeated attempts, Sequence for multiple phases, and Timeline for a main timer with timed cues.":"1 つのタイマーは Simple、繰り返し間隔は Loop、繰り返し試行は Rounds、複数フェーズは Sequence、タイム Cue 付き Main Timer は Timeline を使います。","Use a structured session when you need Loops, Rounds, Sequences, Timelines, cues, display rules, or multiple sections.":"Loop、Rounds、Sequence、Timeline、Cue、表示ルール、複数セクションが必要な場合は構造化 Session を使います。","Use fullscreen for a clean participant display. The browser requires a user click to enter fullscreen.":"参加者に見せる画面をすっきりさせるには Fullscreen を使います。ブラウザーでは全画面表示にユーザークリックが必要です。","Use the arrows or mouse wheel":"矢印またはマウスホイールを使用","Wait":"待機","What does LAP do?":"LAP は何をしますか？","What does your activity look like?":"アクティビティはどのような形ですか？","What happens if I refresh or the browser closes unexpectedly?":"ページを再読み込みしたりブラウザーが予期せず閉じた場合はどうなりますか？","What happens when I press Pause?":"Pause を押すとどうなりますか？","What is Curtain?":"Curtain とは何ですか？","What is Maximum Legibility?":"Maximum Legibility とは何ですか？","What is Session History?":"Session History とは何ですか？","What is a CUE?":"CUE とは何ですか？","What is a Preset?":"Preset とは何ですか？","What is the difference between Main Timer and Current Timer?":"Main Timer と Current Timer の違いは何ですか？","What is the difference between Quick Timer and Create Session?":"Quick Timer と Create Session の違いは何ですか？","What should Curtain show?":"Curtain には何を表示しますか？","When Time Ends":"時間終了時","When should this cue run?":"この Cue はいつ実行しますか？","When time ends, automatically move to the next section.":"時間が終了したら自動的に次のセクションへ進みます。","When?":"いつ？","Which mode should I choose?":"どのモードを選べばよいですか？","Why does fullscreen not start automatically?":"Fullscreen が自動で開始しないのはなぜですか？","Yes, when the active block is Rounds. Session Status provides Round Adjustment controls and updates the total automatically.":"はい。アクティブなブロックが Rounds の場合、Session Status で Round Adjustment を使え、合計数も自動更新されます。","Yes. Edit the Loop and set Loop Limit to No time limit (∞). The interval keeps repeating until you finish the session.":"はい。Loop を編集し、Loop Limit を No time limit (∞) に設定してください。Session を終了するまでインターバルが繰り返されます。","Yes. In Settings → Accessibility & Projector, change Preview Aspect Ratio to 4:3.":"はい。Settings → Accessibility & Projector で Preview Aspect Ratio を 4:3 に変更してください。","Yes. Open DISPLAY and change Theme, Font, Timer Size, Display Scale, Title & Phase Size, or Timer Spacing while the session keeps running.":"はい。DISPLAY を開き、Session を動かしたまま Theme、Font、Timer Size、Display Scale、Title & Phase Size、Timer Spacing を変更できます。","Yes. Open Other Controls → Save as Preset. You will be asked to name and categorize it before it is saved.":"はい。Other Controls → Save as Preset を開きます。保存前に名前とカテゴリーを入力します。","Yes. Open Preset Library and Export a preset as JSON, then Import that file on another device.":"はい。Preset Library で Preset を JSON として Export し、別の端末でそのファイルを Import します。","Yes. Open Session Status to use quick adjustments or enter an exact amount to add or subtract. The clock remains timestamp-based and continues accurately.":"はい。Session Status を開いてクイック調整するか、追加／減算する正確な時間を入力します。時計はタイムスタンプ方式のまま正確に動き続けます。","Your previous session did not finish":"前回の Session は完了していません","single section":"1 セクション","when you only need a Countdown, Count Up, or Stopwatch and want to start immediately.":"カウントダウン、カウントアップ、またはストップウォッチだけをすぐに使いたい場合。","▶ Test Finish":"▶ 終了音をテスト","▶ Test Start":"▶ 開始音をテスト","★ Favorites":"★ お気に入り","Data & Offline":"データとオフライン","Drafts, presets, history, recovery data, and saved voice cues stay on this device. After the PWA has loaded, critical timing can keep working offline.":"下書き、Preset、履歴、復元データはこの端末に保存されます。PWA の読み込み後は、重要なタイミング機能をオフラインでも継続できます。"},"ko":{" when you only need a Countdown, Count Up, or Stopwatch and want to start immediately.":" 카운트다운, 카운트업 또는 스톱워치만 필요하고 바로 시작하고 싶을 때.","+ SAVE CURRENT":"+ 현재 설정 저장","1. Identity":"1. 기본 정보","10 seconds":"10초","10-minute challenge / open-ended elapsed time":"10분 챌린지 / 제한 없는 경과 시간","16:9 widescreen":"16:9 와이드스크린","2 seconds":"2초","2. Start":"2. 시작","3. Display":"3. 디스플레이","4. Size & Typography":"4. 크기 및 타이포그래피","4:3 projector":"4:3 프로젝터","5 rounds × 2 minutes":"5라운드 × 2분","5 seconds":"5초","5. Theme":"5. 테마","6. Sound":"6. 사운드","7. Curtain":"7. Curtain","8. Accessibility & Projector":"8. 가독성 및 프로젝터","? HELP":"? 도움말","? Help":"? 도움말","A Preset is a reusable session configuration. It stores the structure and settings, not the current runtime position.":"Preset은 재사용 가능한 Session 구성입니다. 구조와 설정을 저장하며 현재 실행 위치는 저장하지 않습니다.","A cue is a prepared reminder or action. Timed cues run automatically. Manual cues wait until you press CUE during Live.":"Cue는 미리 준비한 알림이나 동작입니다. 시간 기반 Cue는 자동으로 실행되고, 수동 Cue는 Live 중 CUE를 누를 때까지 대기합니다.","A cue is a reminder or action during the session. Timed cues run automatically. Prepared cues run when you press CUE.":"Cue는 Session 중 사용하는 알림이나 동작입니다. 시간 기반 Cue는 자동으로 실행되며, 준비된 Cue는 CUE를 눌렀을 때 실행됩니다.","A lightweight record of completed sessions on this browser. No cloud account is required.":"이 브라우저에 저장되는 완료된 Session의 가벼운 기록입니다. 클라우드 계정이 필요하지 않습니다.","A local log of completed sessions including actual duration, laps, cues, round changes, and time adjustments.":"완료된 Session의 로컬 기록으로 실제 소요 시간, Lap, Cue, 라운드 변경 및 시간 조정을 포함합니다.","A repeating interval, including open-ended loops.":"반복 간격이며 시간 제한 없는 Loop도 지원합니다.","A repeating interval, with an optional overall time limit.":"반복 간격이며 전체 시간 제한은 선택 사항입니다.","A repeating interval, with or without an overall time limit.":"반복 간격이며 전체 시간 제한을 둘 수도, 두지 않을 수도 있습니다.","A session must have at least one section.":"Session에는 최소 하나의 섹션이 필요합니다.","A short countdown appears before the timer starts.":"타이머가 시작되기 전에 짧은 카운트다운을 표시합니다.","A timed cue runs automatically at a selected time. A prepared CUE runs only when you press CUE during the live session.":"시간 기반 Cue는 선택한 시점에 자동 실행됩니다. 준비된 CUE는 Live Session 중 CUE를 눌렀을 때만 실행됩니다.","A/B Loop":"A/B Loop","ABOUT":"정보","ADD CUE":"CUE 추가","ADD SECTION":"섹션 추가","APP SETTINGS":"앱 설정","APPLY":"적용","Accessibility":"접근성","Action":"동작","Actual":"실제","Add or subtract":"추가 또는 차감","Adjustments / Cues":"조정 / Cue","After 00:00, continue counting as overtime (+00:01, +00:02, and so on).":"00:00 이후에도 Overtime으로 계속 카운트합니다(+00:01, +00:02 등).","All":"전체","All categories":"모든 카테고리","Already working on a session?":"이미 작업 중인 Session이 있나요?","Always visible":"항상 표시","App Theme":"앱 테마","App settings":"앱 설정","At minute 5 change leader; at minute 10 change the rule":"5분에 리더 변경, 10분에 규칙 변경","Automatic — after elapsed time":"자동 — 경과 시간 기준","Automatic — at remaining time":"자동 — 남은 시간 기준","BEFORE YOU START":"시작 전","BUILT-IN":"기본 제공","Back":"뒤로","Browse built-in and saved presets, mark favorites, duplicate, categorize, import, and export reusable session setups.":"기본 제공 및 저장된 Preset을 탐색하고 즐겨찾기, 복제, 분류, 가져오기, 내보내기를 할 수 있습니다.","Browser dependent":"브라우저에 따라 다름","Browsers require fullscreen to be triggered by a user action. Press the Fullscreen button or F.":"브라우저에서는 사용자의 동작으로 전체 화면을 시작해야 합니다. Fullscreen 버튼 또는 F를 누르세요.","Built-in":"기본 제공","CANCEL":"취소","CHOOSE HOW TIME RUNS":"시간 진행 방식 선택","CLEAR HISTORY":"기록 지우기","CLOSE ×":"닫기 ×","COMMON QUESTIONS":"자주 묻는 질문","CONTINUE DRAFT":"초안 계속","COUNT UP":"카운트업","COUNTDOWN":"카운트다운","CREATE SESSION":"SESSION 만들기","CUE":"CUE","CUE — when I press CUE":"CUE — CUE를 눌렀을 때","CUES & MESSAGES":"CUE 및 메시지","CURRENT":"현재","CURTAIN":"CURTAIN","Can I add or remove rounds while Live?":"Live 중 라운드를 추가하거나 줄일 수 있나요?","Can I change the theme during Live?":"Live 중 테마를 변경할 수 있나요?","Can I change time while the timer is running?":"타이머 실행 중 시간을 조정할 수 있나요?","Can I move presets to another device?":"Preset을 다른 기기로 옮길 수 있나요?","Can I preview a 4:3 projector?":"4:3 프로젝터를 미리 볼 수 있나요?","Can I run a Loop without an overall time limit?":"전체 시간 제한 없이 Loop를 실행할 수 있나요?","Can I save a Preset while Live?":"Live 중 Preset을 저장할 수 있나요?","Can I use the app without internet?":"인터넷 없이 앱을 사용할 수 있나요?","Category":"카테고리","Change theme, visibility, typography, and display sizes while the session is running.":"Session이 실행되는 동안 테마, 표시 여부, 타이포그래피 및 디스플레이 크기를 조정합니다.","Checks the weaker of body text and timer contrast against the selected theme background.":"선택한 테마 배경에 대해 본문 텍스트와 타이머 중 더 낮은 대비를 확인합니다.","Choose 4–6 actions for the left side of the Live control bar. Previous / Pause / Next, More, and Help remain available separately.":"Live 컨트롤 바 왼쪽에 표시할 동작 4–6개를 선택합니다. Previous / Pause / Next, More, Help는 별도로 유지됩니다.","Choose Loop → Edit → Loop Limit → No time limit (∞). The loop runs until you finish the session.":"Loop → Edit → Loop Limit → No time limit (∞)을 선택하세요. Session을 종료할 때까지 Loop가 계속됩니다.","Choose a timing pattern":"타이밍 패턴 선택","Choose at least 4 Live controls.":"Live 컨트롤을 최소 4개 선택하세요.","Choose the closest pattern. You can still adjust everything afterwards.":"가장 가까운 패턴을 선택하세요. 이후에도 모든 설정을 조정할 수 있습니다.","Choose the language used by the interface, Help, Q&A, dialogs, validation messages, and built-in presets. Your own titles, messages, and preset names are never auto-translated.":"인터페이스, Help, Q&A, 대화상자, 검증 메시지 및 기본 Preset에 사용할 언어를 선택합니다. 사용자가 직접 입력한 제목, 메시지, Preset 이름은 자동 번역되지 않습니다.","Choose up to 6 Live controls.":"Live 컨트롤은 최대 6개까지 선택할 수 있습니다.","Close":"닫기","Close panel":"패널 닫기","Collapse navigation":"탐색 접기","Combined duration of all sections":"모든 섹션의 총 시간","Completed sessions are stored locally with actual duration, laps, cues, and adjustments.":"완료된 Session은 실제 시간, Lap, Cue 및 조정 내용과 함께 로컬에 저장됩니다.","Confirm display, sound, accessibility, and screen-awake support.":"디스플레이, 사운드, 접근성 및 화면 켜짐 유지 지원을 확인합니다.","Contains an open-ended section":"시간 제한 없는 섹션 포함","Continue":"계속","Contrast passes":"대비 적합","Contrast warning":"대비 경고","Controls the title and phase/round label size.":"제목과 단계/라운드 라벨의 크기를 조절합니다.","Could not import this preset file.":"이 Preset 파일을 가져올 수 없습니다.","Count Up":"카운트업","Countdown":"카운트다운","Counts down from a time limit to 00:00.":"설정한 시간에서 00:00까지 카운트다운합니다.","Create Session":"Session 만들기","Cue triggered":"Cue 실행됨","Cues":"Cue","Current":"현재","Current Round":"현재 라운드","Current Timer":"현재 타이머","Current section repeated":"현재 섹션을 반복했습니다","Curtain":"Curtain","Curtain does not pause the timer.":"Curtain은 타이머를 일시정지하지 않습니다.","Curtain is a temporary participant display mode. In Settings → Curtain, choose one item to show enlarged: Current Timer, Main Timer, or Round/Phase. Press C during Live to switch into Curtain and press C again to return.":"Curtain은 임시 참가자 디스플레이 모드입니다. Settings → Curtain에서 크게 표시할 항목 하나를 선택하세요: Current Timer, Main Timer, Round/Phase. Live 중 C를 눌러 Curtain으로 전환하고 다시 C를 누르면 돌아옵니다.","Curtain replaces the normal participant display with the single item selected in Settings → Curtain. It can enlarge the Current Timer, Main Timer, or Round/Phase. The timer keeps running. Press C or the Return icon to switch back.":"Curtain은 정상 참가자 화면을 Settings → Curtain에서 선택한 한 가지 항목으로 대체합니다. Current Timer, Main Timer 또는 Round/Phase를 크게 표시할 수 있습니다. 타이머는 계속 실행됩니다. C 또는 Return 아이콘으로 돌아갑니다.","Curtain temporarily replaces the normal participant display with one selected item, enlarged to presentation size. Press C or the Curtain/Return icon to switch back.":"Curtain은 정상 참가자 화면을 선택한 하나의 항목으로 일시적으로 대체하고 프레젠테이션 크기로 표시합니다. C 또는 Curtain/Return 아이콘으로 돌아갑니다.","Custom":"사용자 지정","Custom duration":"사용자 지정 시간","DELETE":"삭제","DISCARD":"버리기","DISPLAY":"디스플레이","DISPLAY & SOUND":"디스플레이 및 사운드","DISPLAY OPTIONS":"디스플레이 옵션","DONE":"완료","DUPLICATE":"복제","Dark":"다크","Defines how the activity runs. Simple = one countdown/count-up; Loop = a repeating interval; Rounds = multiple rounds; Sequence = several sections in order.":"활동이 어떻게 진행되는지 정의합니다. Simple = 하나의 카운트다운/카운트업, Loop = 반복 간격, Rounds = 여러 라운드, Sequence = 여러 섹션을 순서대로 실행.","Delete":"삭제","Delete preset?":"Preset을 삭제할까요? ESSION STATUS":"SESSION 상태","SETTINGS":"설정","SHOW":"표시","SOUND":"사운드","START":"시작","START BEHAVIOR":"시작 방식","STATUS":"상태","STOP":"중지","STOPWATCH":"스톱워치","Same duration":"같은 시간","Save as Preset":"Preset으로 저장","Save, favorite, duplicate, import, export, and reuse session configurations.":"Session 구성을 저장, 즐겨찾기, 복제, 가져오기, 내보내기 및 재사용합니다.","Saved":"저장됨","Saved configurations can be loaded and reused later.":"저장된 구성은 나중에 불러와 재사용할 수 있습니다.","Scales the title, phase, secondary timer, and progress without changing the Main Timer size.":"Main Timer 크기는 유지하면서 제목, 단계, 보조 타이머 및 진행 표시를 확대/축소합니다.","Screen Awake":"화면 켜짐 유지","Search presets…":"Preset 검색…","Seconds":"초","Section":"섹션","Sections":"섹션","See elapsed/remaining time, current section, rounds, laps, and make quick timing adjustments.":"경과/남은 시간, 현재 섹션, 라운드, Lap을 확인하고 빠르게 시간을 조정합니다.","See what has happened, what is happening now, and what remains. Adjust time or rounds without leaving Live.":"무엇이 지나갔고, 지금 무엇이 진행 중이며, 무엇이 남았는지 확인하세요. Live를 벗어나지 않고 시간이나 라운드를 조정할 수 있습니다.","Sequence":"Sequence","Session":"Session","Session History":"Session 기록","Session Map":"Session Map","Session Status":"Session 상태","Session Title":"Session 제목","Session status":"Session 상태","Sessions":"Sessions","Set identity, start behavior, participant display, sizes, typography, theme, sound, and Curtain behavior.":"기본 정보, 시작 방식, 참가자 표시, 크기, 타이포그래피, 테마, 사운드 및 Curtain 동작을 설정합니다.","Set up the session and participant display":"Session과 참가자 디스플레이 설정","Settings":"설정","Several different phases in order.":"여러 다른 단계를 순서대로 실행합니다.","Several timed rounds or attempts.":"여러 개의 시간 기반 라운드 또는 시도.","Shortcuts":"단축키","Show Main Timer":"Main Timer 표시","Show a countdown before the timer starts.":"타이머가 시작되기 전에 카운트다운을 표시합니다.","Show a large message such as MOVE!, STOP!, or a rule change.":"MOVE!, STOP! 또는 규칙 변경 같은 큰 메시지를 표시합니다.","Show message":"메시지 표시","Show or hide participant information and adjust the live display while the session is running.":"Session 실행 중 참가자 정보를 표시/숨김하고 Live 디스플레이를 조정합니다.","Show timer":"타이머 표시","Simple":"Simple","Simple Timer":"Simple Timer","Soft":"소프트","Sound":"사운드","Space Pause/Resume · N Next · B Previous · M Message · C Curtain/Return · F Fullscreen.":"Space 일시정지/재개 · N 다음 · B 이전 · M 메시지 · C Curtain/복귀 · F 전체 화면.","Standard presentation mode":"표준 프레젠테이션 모드","Start":"시작","Starts at 00:00 and keeps running until you press Finish or Next.":"00:00에서 시작하여 Finish 또는 Next를 누를 때까지 계속 진행합니다.","Starts at 00:00 and records elapsed time until you finish.":"00:00에서 시작하여 종료할 때까지 경과 시간을 기록합니다.","Starts from a set duration and counts down to 00:00.":"설정한 시간에서 시작해 00:00까지 카운트다운합니다.","Starts immediately with no 3–2–1.":"3–2–1 없이 즉시 시작합니다.","Starts the session using the selected Immediate or 3–2–1–GO behavior.":"선택한 Immediate 또는 3–2–1–GO 방식으로 Session을 시작합니다.","Stop":"중지","Stop at 00:00 and wait for the facilitator.":"00:00에서 멈추고 진행자를 기다립니다.","Stopwatch":"스톱워치","Subtitle":"부제목","Subtitle (optional)":"부제목(선택)","Supported":"지원됨","THEME":"테마","TIME ADJUSTMENT":"시간 조정","TIME FLOW":"시간 흐름","TIME'S UP":"시간 종료","TIMER":"타이머","TIMER SIZE":"타이머 크기","TITLE SIZE":"제목 크기","TOTAL SESSION TIME":"SESSION 총 시간","Temporarily replace the participant display with one selected item, such as Current Timer or Round, while time keeps running.":"시간은 계속 흐르는 동안 참가자 디스플레이를 Current Timer 또는 Round 같은 선택한 한 항목으로 임시 대체합니다.","Test Finish":"종료 사운드 테스트","Test Start":"시작 사운드 테스트","The Live Preview inside Settings updates immediately. Full Preview opens the participant display at full size.":"Settings 안의 Live Preview는 설정 변경 즉시 업데이트됩니다. Full Preview는 참가자 화면을 전체 크기로 엽니다.","The Main Timer and other display elements can be scaled independently. 100% Main Timer means Full Fit.":"Main Timer와 다른 디스플레이 요소는 서로 독립적으로 조절할 수 있습니다. Main Timer 100%는 Full Fit입니다.","The PWA can keep critical timing functions running after it has loaded.":"PWA는 로드된 후에도 핵심 타이밍 기능을 계속 실행할 수 있습니다.","The PWA is designed to keep critical timing features local after it has been loaded and cached. For the best offline behavior, run it from HTTPS or localhost.":"PWA는 로드 및 캐시된 후 핵심 타이밍 기능을 로컬에서 유지하도록 설계되었습니다. 최상의 오프라인 동작을 위해 HTTPS 또는 localhost에서 실행하세요.","The app theme changes Home, Builder, and setup panels. Participant display themes remain session-specific.":"앱 테마는 Home, Builder 및 설정 패널에 적용됩니다. 참가자 디스플레이 테마는 Session별로 유지됩니다.","The loop continues until the facilitator finishes the session.":"진행자가 Session을 종료할 때까지 Loop가 계속됩니다.","The loop stops when the main duration ends.":"Main 시간이 끝나면 Loop도 멈춥니다.","The saved draft will be replaced with a new session.":"저장된 초안이 새 Session으로 교체됩니다.","The session can run without cues. Add one if you need a reminder, message, sound, or display change.":"Session은 Cue 없이도 실행할 수 있습니다. 알림, 메시지, 사운드 또는 디스플레이 변경이 필요하면 Cue를 추가하세요.","The timer freezes. You can Resume or Stop. Stop always asks for confirmation before saving the result to the summary.":"타이머가 멈춥니다. Resume 또는 Stop을 선택할 수 있습니다. Stop은 결과를 요약에 저장하기 전에 항상 확인을 요청합니다.","The timer starts as soon as START is pressed. No 3–2–1.":"START를 누르는 즉시 타이머가 시작됩니다. 3–2–1은 표시되지 않습니다.","The timer will stop and the session results will be saved on the summary page.":"타이머가 멈추고 Session 결과가 요약 페이지에 저장됩니다.","Theme":"테마","This preset will be removed from this browser.":"이 Preset은 이 브라우저에서 삭제됩니다.","This preview updates immediately as you change the settings.":"설정을 변경하면 이 미리보기가 즉시 업데이트됩니다.","Time":"시간","Time Adjustment":"시간 조정","Timeline":"Timeline","Timer Size":"타이머 크기","Timer Spacing":"타이머 간격","Timer Type":"타이머 유형","Title":"제목","Title & Phase Size":"제목 및 단계 크기","Title (optional)":"제목(선택)","Total Rounds":"총 라운드","Total rounds cannot be lower than the current round.":"총 라운드 수는 현재 라운드보다 적을 수 없습니다.","Transition":"전환","Try another search or category.":"다른 검색어나 카테고리를 시도해 보세요.","Two alternating intervals, such as Work/Rest.":"Work/Rest처럼 번갈아 실행되는 두 간격.","USED":"사용됨","Until dismissed":"닫을 때까지","Untitled Session":"제목 없는 Session","Use":"사용","Use ":"사용 ","Use Quick Timer for a simple timing need, or Create Session for structured facilitation.":"간단한 타이밍에는 Quick Timer를, 구조화된 진행에는 Create Session을 사용하세요.","Use Quick Timer for one timer. Use Simple for one structured section, Loop for one repeating interval, Alternating for two timed states that switch back and forth, Rounds for repeated attempts, Sequence for multiple phases, and Timeline for a main timer with timed cues.":"하나의 타이머는 Quick Timer. 하나의 구조화된 섹션은 Simple, 반복 간격은 Loop, 반복 시도는 Rounds, 여러 단계는 Sequence, 시간 Cue가 있는 Main Timer는 Timeline을 사용하세요.","Use Simple for one timer, Loop for repeating intervals, Rounds for repeated attempts, Sequence for multiple phases, and Timeline for a main timer with timed cues.":"하나의 타이머는 Simple, 반복 간격은 Loop, 반복 시도는 Rounds, 여러 단계는 Sequence, 시간 Cue가 있는 Main Timer는 Timeline을 사용하세요.","Use a structured session when you need Loops, Rounds, Sequences, Timelines, cues, display rules, or multiple sections.":"Loop, Rounds, Sequence, Timeline, Cue, 디스플레이 규칙 또는 여러 섹션이 필요하면 구조화된 Session을 사용하세요.","Use fullscreen for a clean participant display. The browser requires a user click to enter fullscreen.":"깔끔한 참가자 화면을 위해 Fullscreen을 사용하세요. 브라우저에서는 전체 화면 진입에 사용자의 클릭이 필요합니다.","Use the arrows or mouse wheel":"화살표 또는 마우스 휠 사용","Wait":"대기","What does LAP do?":"LAP은 무엇을 하나요?","What does your activity look like?":"활동은 어떤 형태인가요?","What happens if I refresh or the browser closes unexpectedly?":"페이지를 새로고침하거나 브라우저가 예기치 않게 종료되면 어떻게 되나요?","What happens when I press Pause?":"Pause를 누르면 어떻게 되나요?","What is Curtain?":"Curtain이란 무엇인가요?","What is Maximum Legibility?":"Maximum Legibility란 무엇인가요?","What is Session History?":"Session History란 무엇인가요?","What is a CUE?":"CUE란 무엇인가요?","What is a Preset?":"Preset이란 무엇인가요?","What is the difference between Main Timer and Current Timer?":"Main Timer와 Current Timer의 차이는 무엇인가요?","What is the difference between Quick Timer and Create Session?":"Quick Timer와 Create Session의 차이는 무엇인가요?","What should Curtain show?":"Curtain에는 무엇을 표시하나요?","When Time Ends":"시간 종료 시","When should this cue run?":"이 Cue는 언제 실행하나요?","When time ends, automatically move to the next section.":"시간이 끝나면 자동으로 다음 섹션으로 이동합니다.","When?":"언제?","Which mode should I choose?":"어떤 모드를 선택해야 하나요?","Why does fullscreen not start automatically?":"Fullscreen이 자동으로 시작되지 않는 이유는 무엇인가요?","Yes, when the active block is Rounds. Session Status provides Round Adjustment controls and updates the total automatically.":"네. 활성 블록이 Rounds일 때 Session Status의 Round Adjustment 컨트롤을 사용할 수 있으며 총 라운드도 자동 업데이트됩니다.","Yes. Edit the Loop and set Loop Limit to No time limit (∞). The interval keeps repeating until you finish the session.":"네. Loop를 편집하고 Loop Limit를 No time limit (∞)으로 설정하세요. Session을 종료할 때까지 간격이 계속 반복됩니다.","Yes. In Settings → Accessibility & Projector, change Preview Aspect Ratio to 4:3.":"네. Settings → Accessibility & Projector에서 Preview Aspect Ratio를 4:3으로 변경하세요.","Yes. Open DISPLAY and change Theme, Font, Timer Size, Display Scale, Title & Phase Size, or Timer Spacing while the session keeps running.":"네. DISPLAY를 열고 Session이 계속 실행되는 동안 Theme, Font, Timer Size, Display Scale, Title & Phase Size 또는 Timer Spacing을 변경할 수 있습니다.","Yes. Open Other Controls → Save as Preset. You will be asked to name and categorize it before it is saved.":"네. Other Controls → Save as Preset을 엽니다. 저장 전에 이름과 카테고리를 입력하게 됩니다.","Yes. Open Preset Library and Export a preset as JSON, then Import that file on another device.":"네. Preset Library에서 Preset을 JSON으로 Export한 뒤 다른 기기에서 해당 파일을 Import하세요.","Yes. Open Session Status to use quick adjustments or enter an exact amount to add or subtract. The clock remains timestamp-based and continues accurately.":"네. Session Status에서 빠른 조정을 사용하거나 추가/차감할 정확한 시간을 입력하세요. 시계는 타임스탬프 기반으로 정확하게 계속 실행됩니다.","Your previous session did not finish":"이전 Session이 완료되지 않았습니다","single section":"단일 섹션","when you only need a Countdown, Count Up, or Stopwatch and want to start immediately.":"카운트다운, 카운트업 또는 스톱워치만 필요하고 바로 시작하고 싶을 때.","▶ Test Finish":"▶ 종료 사운드 테스트","▶ Test Start":"▶ 시작 사운드 테스트","★ Favorites":"★ 즐겨찾기","Data & Offline":"데이터 및 오프라인","Drafts, presets, history, recovery data, and saved voice cues stay on this device. After the PWA has loaded, critical timing can keep working offline.":"초안, Preset, 기록 및 복구 데이터는 이 기기에 저장됩니다. PWA가 로드된 후에는 핵심 타이밍 기능을 오프라인에서도 계속 사용할 수 있습니다."}};

function secToText(sec,showHours=true){
  sec=Math.max(0,Math.floor(sec||0));
  const h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60;
  return (h||showHours)
    ? `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`
    : `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
const shortTime = sec => sec>=3600 ? secToText(sec,true) : secToText(sec,false);
const parseDuration = (h,m,s) => Math.max(0,(+h||0)*3600+(+m||0)*60+(+s||0));
const durationLabel = sec => sec==null ? '∞' : shortTime(sec);

function toast(msg){
  const root=$('#toast-root'); if(!root)return;
  const el=document.createElement('div'); el.className='toast'; el.textContent=msg; root.appendChild(el);
  setTimeout(()=>el.remove(),2200);
}

  start:{source:'BUILTIN',voiceId:null,fileId:null},interval:{source:'BUILTIN',voiceId:null,fileId:null},warning:{source:'BUILTIN',voiceId:null,fileId:null},finish:{source:'BUILTIN',voiceId:null,fileId:null},cue:{source:'BUILTIN',voiceId:null,fileId:null}
};}

function stopActiveSound(){
  try{if(state.activeVoiceAudio){state.activeVoiceAudio.pause();state.activeVoiceAudio.currentTime=0;state.activeVoiceAudio=null;}}catch{}
  try{if(state.activeOscillator){state.activeOscillator.stop();state.activeOscillator.disconnect();state.activeOscillator=null;}}catch{}
}
function builtinTone(kind='cue'){
  try{
    stopActiveSound();
    const ac=state.audio||(state.audio=new (window.AudioContext||window.webkitAudioContext)());if(ac.state==='suspended')ac.resume().catch(()=>{});
    const o=ac.createOscillator(),g=ac.createGain();state.activeOscillator=o;
    const map={start:660,interval:760,warning:520,message:700,cue:700,finish:390};
    o.frequency.value=map[kind]||650;g.gain.value=.0001;o.connect(g);g.connect(ac.destination);
    const t=ac.currentTime;g.gain.exponentialRampToValueAtTime(.12,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+.28);
    o.onended=()=>{if(state.activeOscillator===o)state.activeOscillator=null;};o.start(t);o.stop(t+.3);
  }catch{}
}
function soundSlotAssetId(slot={}){return slot.source==='FILE'?slot.fileId:slot.voiceId;}
async function playConfiguredSound(kind='cue',sessionOverride=null){
  const sess=sessionOverride||state.rt?.session||state.session;
  const snd=normalizeSoundSettings(sess?.sound||{});if(snd.enabled===false)return;
  const slot=snd.slots[kind]||snd.slots.cue||{source:'BUILTIN'};
  if(slot.source==='NONE')return;
  if(!['VOICE','FILE'].includes(slot.source))return builtinTone(kind);
  const assetId=soundSlotAssetId(slot);if(!assetId)return builtinTone(kind);
  try{
    stopActiveSound();
    let rec=state.voiceCache?.get?.(assetId);if(!rec){rec=await audioDBGet(assetId);if(rec)state.voiceCache.set(assetId,rec);}
    if(!rec?.blob)return builtinTone(kind);
    let url=state.voiceUrls.get(assetId);if(!url){url=URL.createObjectURL(rec.blob);state.voiceUrls.set(assetId,url);}
    const a=new Audio(url);state.activeVoiceAudio=a;a.volume=1;a.onended=()=>{if(state.activeVoiceAudio===a)state.activeVoiceAudio=null;};
    await a.play();
  }catch(e){console.warn('Custom sound playback failed',e);builtinTone(kind);}
}








function inferMode(s){
  if(s.blocks.length>1)return 'SEQUENCE';
  const t=s.blocks[0]?.type;
  if(t==='AB_LOOP')return 'ALTERNATING';
  if(t==='LOOP'||t==='ROUNDS')return t;
  return s.events?.length?'TIMELINE':'SIMPLE';
}

function timerFitStyle(text,display=null,preview=false){const d=display||state.rt?.session?.display||state.session?.display||defaultDisplay();const scale=clamp(+d.timerScale||100,10,200)/100;const tracking=clamp(+d.timerTracking||2,0,24);const chars=Math.max(1,String(text||'').length);if(preview){const rem=clamp((2.1+(scale*4.7)),2.5,13.6);return `font-size:${rem.toFixed(2)}rem !important;letter-spacing:${tracking}px`; }const vw=clamp(96/(chars*.56),16,60)*scale;const vh=52*scale;return `font-size:min(${vw.toFixed(2)}vw,${vh.toFixed(2)}vh);letter-spacing:${tracking}px`;}

// v19 Smart Alarms. Alarms follow wall-clock time and remain independent of timer flow.
const ALARM_STORAGE_KEY='gt_v19_alarms';
const ALARM_PREFS_KEY='gt_v19_alarm_prefs';
function defaultAlarmPrefs(){return {volume:70,soundType:'BUILTIN',soundId:'CLEAR',behavior:'UNTIL_STOPPED',repeatSeconds:4,repeatDuration:30,snoozeMinutes:5,safetySeconds:300,vibrate:false,pauseTimer:false};}
function alarmPrefs(){return {...defaultAlarmPrefs(),...(load(ALARM_PREFS_KEY,{})||{})};}
function saveAlarmPrefs(value){save(ALARM_PREFS_KEY,{...defaultAlarmPrefs(),...value});}
function normalizeAlarm(raw={}){
  const pref=alarmPrefs(),targetAt=Number.isFinite(+raw.targetAt)?+raw.targetAt:now()+600000;
  const triggerType=['AT','AFTER','SECTION','ROUND','LOOP_INTERVAL','AB_CYCLE'].includes(raw.triggerType)?raw.triggerType:'AT';
  return {id:safeIdentifier(raw.id),label:String(raw.label||tr('Alarm')).slice(0,120),triggerType,targetAt,blockId:String(raw.blockId||''),targetOrdinal:Math.max(1,Math.floor(+raw.targetOrdinal||1)),enabled:raw.enabled!==false,status:['SCHEDULED','RINGING','SNOOZED','NEEDS_ATTENTION','DONE'].includes(raw.status)?raw.status:'SCHEDULED',soundType:['BUILTIN','ASSET','NONE'].includes(raw.soundType)?raw.soundType:pref.soundType,soundId:String(raw.soundId||pref.soundId),volume:clamp(Number.isFinite(+raw.volume)?+raw.volume:pref.volume,0,100),behavior:['ONCE','FOR_DURATION','UNTIL_STOPPED'].includes(raw.behavior)?raw.behavior:pref.behavior,repeatSeconds:clamp(+raw.repeatSeconds||pref.repeatSeconds,1,60),repeatDuration:clamp(+raw.repeatDuration||pref.repeatDuration,5,300),snoozeMinutes:clamp(+raw.snoozeMinutes||pref.snoozeMinutes,1,60),safetySeconds:clamp(+raw.safetySeconds||pref.safetySeconds,30,900),vibrate:raw.vibrate===true,pauseTimer:raw.pauseTimer===true,createdAt:+raw.createdAt||now(),ringStartedAt:Number.isFinite(+raw.ringStartedAt)?+raw.ringStartedAt:null,lastCycleAt:+raw.lastCycleAt||0};
}
function loadAlarms(){const list=load(ALARM_STORAGE_KEY,[]);return (Array.isArray(list)?list:[]).map(normalizeAlarm).filter(a=>a.status!=='DONE'||now()-a.targetAt<86400000);}
function persistAlarms(){save(ALARM_STORAGE_KEY,(state.alarms||[]).map(a=>({...a})));syncBackgroundClock();}
function activeAlarms(){return (state.alarms||[]).filter(a=>a.enabled&&['SCHEDULED','SNOOZED','RINGING'].includes(a.status));}
function managedAlarms(){return (state.alarms||[]).filter(a=>a.status!=='DONE');}
function ringingAlarms(){return activeAlarms().filter(a=>a.status==='RINGING');}
function nextAlarm(){return activeAlarms().filter(a=>a.status!=='RINGING').sort((a,b)=>a.targetAt-b.targetAt)[0]||ringingAlarms()[0]||null;}
function alarmTime(value){return new Date(value).toLocaleTimeString(localeTag(),{hour:'2-digit',minute:'2-digit'});}
function alarmCountdown(a){const sec=Math.max(0,Math.ceil((a.targetAt-now())/1000));return sec>=3600?shortTime(sec):secToText(sec,false);}
function alarmBlock(alarm,s=state.rt?.session||state.session){return s?.blocks?.find(b=>b.id===alarm.blockId)||null;}
function alarmWhenLabel(alarm){const b=alarmBlock(alarm);if(alarm.status==='NEEDS_ATTENTION')return tr('Needs attention');if(alarm.triggerType==='AT')return `${tr('At')} ${alarmTime(alarm.targetAt)}`;if(alarm.triggerType==='AFTER'||alarm.status==='SNOOZED')return `${tr('in')} ${alarmCountdown(alarm)}`;if(alarm.triggerType==='SECTION')return `${tr('After section')} · ${b?esc(b.name):tr('Missing section')}`;if(alarm.triggerType==='ROUND')return `${tr('After round')} ${alarm.targetOrdinal} · ${b?esc(b.name):tr('Missing section')}`;if(alarm.triggerType==='LOOP_INTERVAL')return `${tr('After interval')} ${alarm.targetOrdinal} · ${b?esc(b.name):tr('Missing section')}`;return `${tr('After cycle')} ${alarm.targetOrdinal} · ${b?esc(b.name):tr('Missing section')}`;}
function validateFlowAlarms(){for(const a of managedAlarms()){if(!['SECTION','ROUND','LOOP_INTERVAL','AB_CYCLE'].includes(a.triggerType))continue;const b=alarmBlock(a,state.rt?.session||state.session),valid=b&&(a.triggerType==='SECTION'||a.triggerType==='ROUND'&&b.type==='ROUNDS'||a.triggerType==='LOOP_INTERVAL'&&b.type==='LOOP'||a.triggerType==='AB_CYCLE'&&b.type==='AB_LOOP');if(!valid)a.status='NEEDS_ATTENTION';else if(a.status==='NEEDS_ATTENTION')a.status='SCHEDULED';}}
function alarmStatusSummary(){validateFlowAlarms();const list=activeAlarms(),next=nextAlarm();if(!list.length)return managedAlarms().some(a=>a.status==='NEEDS_ATTENTION')?tr('Needs attention'):tr('No alarm set');return next?.status==='RINGING'?`${next.label} · ${tr('Ringing')}`:`${next.label} · ${alarmWhenLabel(next)}`;}
function logAlarmEvent(type,alarm){if(state.rt?.history)state.rt.history.push({type:'ALARM_'+type,label:alarm.label,at:now()});}
function initAlarmSystem(){state.alarms=loadAlarms();state.alarmFormMode='LIST';state.alarmEditingId=null;state.alarmAudioBusy=false;state.alarmTestActive=false;if(!state.alarmInterval)state.alarmInterval=setInterval(processAlarms,250);processAlarms();}
function alarmMasterAudible(){if(state.screen==='live'&&state.rt)return runtimeSoundMasterEnabled(state.rt);return normalizeSoundSettings(state.session?.sound||{}).enabled!==false;}
function stopAlarmAudio(){
  try{state.activeAlarmAudio?.pause();if(state.activeAlarmAudio)state.activeAlarmAudio.currentTime=0;}catch{}state.activeAlarmAudio=null;
  for(const n of state.activeAlarmNodes||[]){try{n.stop?.();n.disconnect?.();}catch{}}state.activeAlarmNodes=[];state.alarmAudioBusy=false;
  if(state.alarmCycleTimer){clearTimeout(state.alarmCycleTimer);state.alarmCycleTimer=null;}
}
function pauseAlarmForPriority(){if(ringingAlarms().length){stopAlarmAudio();state.alarmResumeAfter=now()+500;}}
function builtinAlarmPattern(id='CLEAR',volume=70){
  const ac=ensureAudioReady();if(!ac)return Promise.resolve(false);stopAlarmAudio();state.alarmAudioBusy=true;const start=ac.currentTime+.02,gain=Math.max(.0001,volume/100*.16),patterns={GENTLE:[[523,0,.32],[659,.42,.32],[784,.84,.55]],BREAK:[[660,0,.45],[660,.62,.45],[520,1.24,.65]],CLEAR:[[880,0,.22],[660,.34,.22],[880,.68,.55]],DIGITAL:[[920,0,.16],[920,.25,.16],[760,.5,.16],[920,.75,.42]],URGENT:[[760,0,.34],[520,.4,.34],[760,.8,.34],[520,1.2,.55]],LONG:[[440,0,1.8]]},pattern=patterns[id]||patterns.CLEAR,nodes=[];
  for(const [freq,offset,duration] of pattern){const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=freq;o.type=id==='DIGITAL'?'square':'sine';g.gain.value=.0001;o.connect(g);g.connect(ac.destination);g.gain.exponentialRampToValueAtTime(gain,start+offset+.02);g.gain.exponentialRampToValueAtTime(.0001,start+offset+duration);o.start(start+offset);o.stop(start+offset+duration+.03);nodes.push(o,g);}
  state.activeAlarmNodes=nodes;const length=Math.max(...pattern.map(x=>x[1]+x[2]))*1000+100;return new Promise(resolve=>{state.alarmCycleTimer=setTimeout(()=>{state.alarmAudioBusy=false;state.activeAlarmNodes=[];state.alarmCycleTimer=null;resolve(true);},length);});
}
async function playAlarmAsset(id,volume=70){
  try{stopAlarmAudio();let rec=state.voiceCache?.get?.(id);if(!rec){rec=await audioDBGet(id);if(rec)state.voiceCache.set(id,rec);}if(!rec?.blob)return builtinAlarmPattern('CLEAR',volume);let url=state.voiceUrls.get(id);if(!url){url=URL.createObjectURL(rec.blob);state.voiceUrls.set(id,url);}const a=new Audio(url);a.volume=clamp(volume,0,100)/100;state.activeAlarmAudio=a;state.alarmAudioBusy=true;return await new Promise(resolve=>{const done=ok=>{if(state.activeAlarmAudio===a)state.activeAlarmAudio=null;state.alarmAudioBusy=false;resolve(ok);};a.onended=()=>done(true);a.onerror=()=>done(false);a.play().catch(()=>done(false));});}catch{return builtinAlarmPattern('CLEAR',volume);}
}
function playAlarmCycle(alarm,test=false){if(alarm.soundType==='NONE'||alarm.volume<=0)return Promise.resolve(false);if(!test&&!alarmMasterAudible())return Promise.resolve(false);return alarm.soundType==='ASSET'?playAlarmAsset(alarm.soundId,alarm.volume):builtinAlarmPattern(alarm.soundId,alarm.volume);}
function testAlarmSound(alarm){if(state.alarmTestActive){stopAlarmAudio();state.alarmTestActive=false;updateAlarmTestButton();return;}if(runtimeSoundBusy()){toast(tr('Another sound is playing. Try again shortly.'));return;}state.alarmTestActive=true;updateAlarmTestButton();playAlarmCycle(alarm,true).finally(()=>{state.alarmTestActive=false;updateAlarmTestButton();});setTimeout(()=>{if(state.alarmTestActive){stopAlarmAudio();state.alarmTestActive=false;updateAlarmTestButton();}},15000);}
function updateAlarmTestButton(){const b=$('#alarmTestSound');if(b)b.textContent=state.alarmTestActive?`■ ${tr('STOP TEST')}`:`▷ ${tr('TEST SOUND')}`;}
function startAlarmRinging(alarm){alarm.status='RINGING';alarm.ringStartedAt=now();alarm.lastCycleAt=0;logAlarmEvent('RING',alarm);if(alarm.pauseTimer&&state.rt?.status==='RUNNING')pause();try{if(alarm.vibrate&&navigator.vibrate)navigator.vibrate([300,150,300]);}catch{}persistAlarms();if(state.screen==='live')showControls();renderAlarmOverlay();}
function notifyAlarmFlow(triggerType,{blockId='',ordinal=1}={}){for(const alarm of activeAlarms()){if(alarm.status==='RINGING'||alarm.triggerType!==triggerType||alarm.blockId!==blockId)continue;if(triggerType!=='SECTION'&&ordinal<alarm.targetOrdinal)continue;startAlarmRinging(alarm);}return ringingAlarms().length>0;}
function finishAlarmOccurrence(alarm,reason='STOP'){alarm.status='DONE';alarm.enabled=false;logAlarmEvent(reason,alarm);persistAlarms();if(!ringingAlarms().length)stopAlarmAudio();renderAlarmOverlay();refreshAlarmSurfaces();if(state.screen==='live')showControls();}
function stopRingingAlarm(id){const alarm=(state.alarms||[]).find(a=>a.id===id);if(alarm)finishAlarmOccurrence(alarm,'STOP');}
function snoozeAlarm(id,minutes=null){const alarm=(state.alarms||[]).find(a=>a.id===id);if(!alarm)return;stopAlarmAudio();alarm.status='SNOOZED';alarm.triggerType='AFTER';alarm.blockId='';alarm.targetAt=now()+60000*(minutes||alarm.snoozeMinutes||5);alarm.ringStartedAt=null;alarm.lastCycleAt=0;logAlarmEvent('SNOOZE',alarm);persistAlarms();renderAlarmOverlay();refreshAlarmSurfaces();toast(`${alarm.label} · ${tr('Snoozed')} ${alarmTime(alarm.targetAt)}`);}
function processAlarms(){
  const current=now();validateFlowAlarms();for(const alarm of activeAlarms())if(['AT','AFTER'].includes(alarm.triggerType)&&alarm.status!=='RINGING'&&current>=alarm.targetAt)startAlarmRinging(alarm);
  const queue=ringingAlarms().sort((a,b)=>(a.ringStartedAt||a.targetAt)-(b.ringStartedAt||b.targetAt)),alarm=queue[0];updateAlarmIndicator();if(!alarm)return;
  if(current-(alarm.ringStartedAt||current)>=alarm.safetySeconds*1000){finishAlarmOccurrence(alarm,'SAFETY_TIMEOUT');return;}
  if(alarm.behavior==='ONCE'&&alarm.lastCycleAt){if(state.alarmAudioBusy)return;finishAlarmOccurrence(alarm,'AUTO_STOP');return;}
  if(alarm.behavior==='FOR_DURATION'&&current-(alarm.ringStartedAt||current)>=alarm.repeatDuration*1000){finishAlarmOccurrence(alarm,'AUTO_STOP');return;}
  if(state.alarmAudioBusy||runtimeSoundBusy()||current<(state.alarmResumeAfter||0)||!alarmMasterAudible())return;
  if(!alarm.lastCycleAt||current-alarm.lastCycleAt>=alarm.repeatSeconds*1000){alarm.lastCycleAt=current;playAlarmCycle(alarm).finally(()=>{});}
}
function updateAlarmIndicator(){const el=$('.live-alarm-indicator'),a=nextAlarm();if(!el||!a)return;const b=el.querySelector('b');if(b)b.textContent=a.status==='RINGING'?tr('Ringing'):`${alarmTime(a.targetAt)} · ${alarmCountdown(a)}`;el.classList.toggle('ringing',a.status==='RINGING');}
function renderAlarmOverlay(){
  document.querySelector('.alarm-ringing-backdrop')?.remove();const queue=ringingAlarms().sort((a,b)=>(a.ringStartedAt||0)-(b.ringStartedAt||0));if(!queue.length)return;const a=queue[0],muted=!alarmMasterAudible()||a.soundType==='NONE'||a.volume<=0;
  document.body.insertAdjacentHTML('beforeend',`<div class="alarm-ringing-backdrop"><section class="alarm-ringing ${state.screen==='live'?'alarm-ringing-live':''}" role="alertdialog" aria-modal="true"><div class="alarm-pulse" aria-hidden="true">⏰</div><div><div class="section-title">${tr('ALARM')}</div><h2 data-user-content>${esc(a.label)}</h2><div class="alarm-ring-time">${alarmTime(a.targetAt)}</div><p class="helper">${muted?tr('Alarm muted'):tr('Alarm is ringing')}${queue.length>1?` · ${queue.length-1} ${tr('waiting')}`:''}</p></div><div class="alarm-ring-actions"><button class="btn primary" data-alarm-stop="${a.id}">${tr('STOP')}</button><button class="btn" data-alarm-snooze="${a.id}">${tr('SNOOZE')} ${a.snoozeMinutes} ${tr('min')}</button></div></section></div>`);

function calcBlockPlanned(b){
  if(!b)return 0;
  if(b.type==='TIMER'&&b.config?.clockMode==='COUNTUP')return null;
  if(b.type==='LOOP'&&b.config?.limitMode==='UNLIMITED')return null;
  if(b.type==='ROUNDS'){
    const c=b.config||{}; const count=+c.roundCount||1;
    let total=c.durationMode==='CUSTOM'
      ? Array.from({length:count},(_,i)=>+c.roundDurations?.[i]||+c.defaultDuration||0).reduce((a,v)=>a+v,0)
      : (+c.defaultDuration||0)*count;
    if(c.transitionEnabled&&+c.transitionDuration>0) total += Math.max(0,count-1)*(+c.transitionDuration||0);
    return total;
  }
  if(b.type==='AB_LOOP'){
    const c=b.config||{};
    if(c.repeatMode==='UNLIMITED')return null;
    if(c.repeatMode==='CYCLES')return ((+c.aDuration||0)+(+c.bDuration||0))*(+c.cycles||1);
  }
  return +b.duration||0;
}
function totalPlanned(sess=state.session){
  let total=0;
  for(const b of sess.blocks){ const v=calcBlockPlanned(b); if(v==null)return null; total+=v; }
  return total;
}

function processAutomaticWarning(){
  const rt=state.rt;if(!rt||rt.status!=='RUNNING')return;const snd=normalizeSoundSettings(rt.session?.sound||{});if(!snd.enabled||!snd.warningEnabled)return;
  let rem=sessionRemaining();if(rem==null)rem=blockRemaining();if(rem==null)return;
  const threshold=Math.max(1,+snd.warningAt||60);
  if(rem>threshold+1){rt.warningPlayed=false;return;}
  if(rem>0&&rem<=threshold&&!rt.warningPlayed){rt.warningPlayed=true;tone('warning');rt.history.push({type:'WARNING_SOUND',remaining:rem,at:now()});persistActive();}
}











function curtainView(){
  const rt=state.rt,v=runtimeView(),b=currentBlock();
  const mode=rt?.session?.curtain?.content||'CURRENT_TIMER';
  if(mode==='ROUND_PHASE'){
    let text=v.phase||'';
    if(!text&&b?.type==='ROUNDS')text=`ROUND ${rt.roundIndex+1}${b.config?.roundCount?` / ${b.config.roundCount}`:''}`;
    if(!text)text=b?.name||'SESSION';
    return {kind:'label',text};
  }
  if(mode==='MAIN_TIMER')return {kind:'timer',text:v.main||shortTime(sessionRemaining()||elapsed())};
  const cur=currentUnitRemaining();
  return {kind:'timer',text:cur!=null?shortTime(cur):(v.secondary||v.main||shortTime(elapsed()))};
}

/* v20 Beta — Mobile Back Buffer
   Ported from the proven Victory Point 3.10.6 approach: pre-seed same-document
   history entries so repeated Android Back gestures stay inside the app first,
   especially when opened from file:// or content://. */
const GT_BACK_HISTORY_KEY='game-timer-v20-back-buffer';
const GT_BACK_BUFFER_VERSION=1;
const GT_LOCAL_MOBILE_CONTEXT=(location.protocol==='content:'||(location.protocol==='file:'&&/Android/i.test(navigator.userAgent||'')));
const GT_BACK_BUFFER_SIZE=GT_LOCAL_MOBILE_CONTEXT?40:8;
const GT_BACK_REFILL_AT=GT_LOCAL_MOBILE_CONTEXT?10:2;
let gtBackHandling=false;
let gtAllowBrowserExit=false;
let gtBackLastSlot=null;
let gtBackRefillTimer=0;
function gtBufferState(slot){return{gtNav:GT_BACK_HISTORY_KEY,v:GT_BACK_BUFFER_VERSION,slot}}
function gtIsBufferState(value){return !!(value&&value.gtNav===GT_BACK_HISTORY_KEY&&value.v===GT_BACK_BUFFER_VERSION&&Number.isInteger(value.slot)&&value.slot>=0)}
function seedGameTimerBackBuffer(){
  try{
    let current=history.state;
    let slot=gtIsBufferState(current)?current.slot:0;
    if(!gtIsBufferState(current))history.replaceState(gtBufferState(0),'');
    // Build the reserve before the first gesture. pushState does not emit popstate.
    for(let i=slot+1;i<=GT_BACK_BUFFER_SIZE;i++)history.pushState(gtBufferState(i),'');
    gtBackLastSlot=GT_BACK_BUFFER_SIZE;
    return true;
  }catch(_){return false}
}
function refillGameTimerBackBufferNow(){
  if(gtAllowBrowserExit||document.visibilityState==='hidden')return false;
  try{
    let current=history.state;
    if(!gtIsBufferState(current)){
      history.replaceState(gtBufferState(0),'');
      current=history.state;
    }
    const slot=current.slot;
    if(slot>GT_BACK_REFILL_AT){gtBackLastSlot=slot;return true}
    // Refill only when reserve is low; do not repair history after every swipe.
    for(let i=slot+1;i<=GT_BACK_BUFFER_SIZE;i++)history.pushState(gtBufferState(i),'');
    gtBackLastSlot=GT_BACK_BUFFER_SIZE;
    return true;
  }catch(_){return false}
}
function scheduleGameTimerBackRefill(delay=650){
  clearTimeout(gtBackRefillTimer);
  gtBackRefillTimer=setTimeout(()=>refillGameTimerBackBufferNow(),delay);
}
function ensureGameTimerBackBuffer(){
  const current=history.state;
  if(gtIsBufferState(current)){
    gtBackLastSlot=current.slot;
    if(current.slot<=GT_BACK_REFILL_AT)scheduleGameTimerBackRefill(80);
    return true;
  }
  return seedGameTimerBackBuffer();
}
function exitGameTimerDocument(){
  closeTransientLayers();
  gtAllowBrowserExit=true;
  clearTimeout(gtBackRefillTimer);
  try{
    const current=history.state;
    if(gtIsBufferState(current)){
      // slot 0 replaced this document's original entry, so move one step farther.
      history.go(-(current.slot+1));
    }else history.back();
    // When there is no previous browser entry, history.go() can do nothing.
    setTimeout(()=>{if(document.visibilityState==='visible')gtAllowBrowserExit=false},900);
  }catch(_){
    gtAllowBrowserExit=false;
    toast(tr('Use the browser Back button to leave Game Timer.'));
  }
}
function showExitGameTimerDialog(){

async function handleGameTimerBack(){
  // A ringing alarm is intentionally not dismissible with Back: STOP or SNOOZE is explicit.
  if(document.querySelector('.alarm-ringing-backdrop')){
    toast(tr('Stop or snooze the alarm before leaving this screen.'));
    if(state.screen==='live')showControls();
    return true;
  }
  if(document.fullscreenElement){try{await document.exitFullscreen()}catch(_){}return true}
  const modal=document.querySelector('.modal-backdrop');
  if(modal){modal.remove();return true}
  if(document.querySelector('.drawer')){closeDrawer();return true}
  if(state.preview){
    state.preview=false;state.rt=null;state.screen='builder';state.livePanel=null;render();return true;
  }
  if(state.screen==='live'){
    const rt=state.rt;
    if(rt?.activeMessage){rt.activeMessage=null;rt.messageUntil=null;persistActive();renderLive();return true}
    if(rt?.curtain?.active){rt.curtain.active=false;persistActive();renderLive();return true}
    if(state.livePanel){state.livePanel=null;renderLive();return true}
    // Do not discard or silently background an active timer. Use the existing finish confirmation.
    requestFinish();
    return true;
  }
  if(state.screen==='ready'){
    state.screen='overview';render();return true;
  }
  if(state.screen==='overview'){
    state.screen='builder';state.editingBlock=null;render();return true;
  }
  if(state.screen==='builder'){
    if(state.editingBlock){state.editingBlock=null;state.builderTab='Flow';render();return true}
    state.returningToModes=true;state.screen='modes';render();return true;
  }
  if(['quick','modes','presets','history','summary'].includes(state.screen)){
    state.livePanel=null;state.screen='home';render();return true;
  }
  if(state.screen==='home'){showExitGameTimerDialog();return true}
  // Recovery is a startup decision. Back should not silently discard it.
  if(state.screen==='recovery'){showExitGameTimerDialog();return true}
  return false;
}
function initMobileBackNavigation(){
  if(!ensureGameTimerBackBuffer())return;
  window.addEventListener('popstate',async e=>{
    if(gtAllowBrowserExit)return;
    const current=e.state;
    if(!gtIsBufferState(current)){
      // Older builds or foreign same-document state: handle once, then rebuild clean reserve.
      if(gtBackHandling)return;
      gtBackHandling=true;
      try{const handled=await handleGameTimerBack();if(!handled)showExitGameTimerDialog()}
      finally{gtBackHandling=false;setTimeout(()=>seedGameTimerBackBuffer(),120)}
      return;
    }
    const previousSlot=gtBackLastSlot,currentSlot=current.slot;
    gtBackLastSlot=currentSlot;
    // Forward traversal is bookkeeping, not another in-app Back action.
    if(previousSlot!==null&&currentSlot>previousSlot){
      if(currentSlot<=GT_BACK_REFILL_AT)scheduleGameTimerBackRefill();
      return;
    }
