.library-tabs button.active{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.preset-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.preset-card-v9{display:flex;flex-direction:column;gap:12px;min-height:210px}
.preset-card-v9 .preset-top{display:flex;gap:8px;align-items:start}
.preset-card-v9 .preset-title{font-size:1.05rem;font-weight:900}
.preset-card-v9 .preset-tag{display:inline-flex;width:max-content;padding:5px 8px;border-radius:999px;background:var(--surface2);color:var(--muted);font-size:.7rem;font-weight:800}
.preset-card-v9 .preset-meta{display:flex;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:.78rem}
.preset-card-v9 .preset-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:auto}
.star-btn{width:38px;height:38px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--muted);font-size:1.1rem}
.star-btn.active{color:#ffd75a;background:color-mix(in srgb,#ffd75a 10%,transparent)}
.builtin-badge{font-size:.65rem;font-weight:850;color:var(--accent);letter-spacing:.08em}
.import-input{display:none}
.history-list{display:grid;gap:12px}
.history-item{border:1px solid var(--line);background:var(--surface);border-radius:16px;overflow:hidden}
.history-item summary{list-style:none;cursor:pointer;padding:16px 18px;display:grid;gap:18px;align-items:center}
.history-item summary::-webkit-details-marker{display:none}
.history-title b{display:block}
.history-title small,.history-item .history-metric span{color:var(--muted)}
.history-metric{text-align:right}
.history-metric b{display:block;font-variant-numeric:tabular-nums}
.history-detail{border-top:1px solid var(--line);padding:16px 18px}
.history-events{display:grid;gap:7px;margin-top:12px}
.history-event{display:grid;grid-template-columns:80px 120px minmax(0,1fr);gap:10px;padding:8px 10px;border-radius:9px;background:var(--surface2);font-size:.8rem}
.history-event time{font-variant-numeric:tabular-nums;color:var(--muted)}
.live-favorites-config{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.favorite-option{display:flex;align-items:center;gap:9px;border:1px solid var(--line);background:var(--surface2);border-radius:11px;padding:10px}
.favorite-option input{width:18px;height:18px}
.favorite-hint{font-size:.78rem;color:var(--muted);margin-top:8px}
.controlbar .facilitation-control{min-width:44px}
.controlbar .facilitation-control.text-control{font-size:.68rem}
.projector-tools{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.legibility-badge{display:flex;align-items:center;gap:8px;padding:10px;border-radius:11px;border:1px solid var(--line);background:var(--surface2)}
.legibility-badge.good b{color:var(--success)}
.projector-preview{aspect-ratio:16/9;border:1px solid var(--line);border-radius:13px;overflow:hidden;margin-top:12px}
.projector-preview.aspect-4-3{aspect-ratio:4/3}
.max-legibility .live-title,.max-legibility .phase{font-weight:900!important;text-shadow:0 1px 0 rgba(0,0,0,.12)}
.max-legibility .main-timer,.max-legibility .secondary{font-weight:950!important}
.max-legibility .progress{height:max(8px,1.1vh)!important}
.max-legibility .timer-caption{font-weight:900!important;letter-spacing:.13em}
.live.max-legibility .live-content{gap:clamp(16px,3.5vh,46px)}
.locale-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}
.i18n-note{font-size:.78rem;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 75%,white 25%);outline-offset:3px}
@media(max-width:900px){.preset-grid{grid-template-columns:repeat(2,minmax(0,1fr))}

:root{--s1:4px;--s2:8px;--s3:12px;--s4:16px;--s6:24px;--s8:32px;--s12:48px;--r-sm:8px;--r-control:12px;--r-card:16px;--r-modal:20px;--control-border:#5a6776;--focus:#9bb9ff;--success:#7ad69d;--warning:#f3c969;--critical:#ff9696;--font-ui:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
body{font-family:var(--font-ui);line-height:1.5}
button,input,select,textarea{font-family:inherit}
button{touch-action:manipulation}
[hidden]{display:none!important}
*{min-width:0}
body.app-theme-light{--surface2:#e9edf2;--line:#c8d0da;--success:#18653d;--warning:#825900;--critical:#b3263d;--focus:#315ecb}

button:focus-visible,a:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--focus,var(--accent));outline-offset:3px}
button:disabled{cursor:default;opacity:.62}
button:disabled:hover{transform:none;box-shadow:none}
.btn{min-height:44px;padding:10px 16px;border-radius:var(--r-control);font-weight:700;border-color:var(--control-border);line-height:1.3}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{border-color:transparent}
.btn.danger{color:var(--critical);border-color:var(--critical)}
.home-actions .btn.ghost{background:var(--surface)!important;color:var(--text)!important;border:1px solid var(--control-border)!important;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--control-border) 25%,transparent)}
.home-actions .btn.ghost:hover{background:var(--surface2)!important}
.summary .btn:not(.primary){background:#20262f!important;color:#fff!important;border:1px solid #677587!important}
.summary .btn:not(.primary):hover{background:#2b3440!important;color:#fff!important}
.btn.small{min-height:40px;font-size:.85rem;padding:8px 12px}
.iconbtn,.closebtn,.panel-close{height:44px;width:44px;min-width:44px;min-height:44px;font-size:1.3rem;border-radius:var(--r-control)}
.field{gap:8px;align-content:start}
.field label,.field-label{font-size:.875rem;line-height:1.4;font-weight:650;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--control-border);border-radius:var(--r-control);padding:10px 12px;min-height:44px;font-size:1rem;line-height:1.4;background:var(--surface);color:var(--text)}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--focus,var(--accent));outline-offset:2px;border-color:var(--accent);box-shadow:none}
.field input::placeholder,.field textarea::placeholder{color:var(--muted);opacity:1}
.field textarea{resize:vertical;min-height:92px}
.field small{color:var(--muted)}
.grid2{gap:16px;align-items:start}
.inline{gap:8px}
.top-gap{margin-top:16px}
.helper,.muted{line-height:1.6}
.helper{font-size:.875rem}
.section-title,.eyebrow{font-size:.72rem;letter-spacing:.10em;font-weight:750;line-height:1.5}
.page-title{line-height:1.2;font-weight:780}
.page-head{margin-bottom:24px;gap:24px}
.page-head p{margin:12px 0 0}
.topbar{padding:8px 24px;background:color-mix(in srgb,var(--bg) 97%,transparent)}

.save-status{white-space:nowrap}
.builder-bottom{background:var(--bg);padding:12px 24px;gap:12px}
.builder-main{padding:32px 32px 112px}
.builder-page{max-width:1180px}
.builder-nav .nav-item{min-height:48px;line-height:1.4}
.builder-nav .nav-label{font-size:.8rem;text-transform:uppercase}
.builder-nav .nav-item.active{box-shadow:inset 3px 0 var(--accent)}
.settings-layout{grid-template-columns:minmax(0,1fr) minmax(280px,380px);gap:24px;align-items:stretch}
.settings-column{gap:16px;align-content:start}
.preview-column{align-self:stretch}
.preview-sticky{position:sticky;top:88px;max-height:calc(100dvh - 180px);overflow:auto;scrollbar-width:thin}
.preview-note{font-size:.85rem;line-height:1.6;margin:8px 0 16px}
.preview-state-note{color:var(--muted);font-size:.75rem;line-height:1.6;margin:12px 0 0}
.preview-curtain-control{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:8px 12px;margin:0 0 12px}

.curtain-preview-badge{position:absolute;z-index:2;top:10px;left:10px;max-width:calc(100% - 20px);padding:5px 8px;border-radius:999px;background:color-mix(in srgb,var(--accent) 18%,var(--surface));border:1px solid color-mix(in srgb,var(--accent) 52%,var(--line));color:var(--text);font-size:.62rem;font-weight:800;letter-spacing:.08em;line-height:1.35}
.builder-curtain-content{width:100%;height:100%;display:grid;place-items:center;padding:48px 20px 20px;text-align:center}

.curtain-preview-open{margin-top:16px}
.setting-card{border:1px solid var(--line);border-radius:var(--r-card);padding:0;overflow:visible;background:var(--surface)}
.setting-card summary{padding:16px 20px;min-height:56px;font-size:.95rem;font-weight:750;line-height:1.5}
.setting-summary{margin-left:auto;min-width:0;max-width:42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:.75rem;font-weight:650;text-align:right}
.setting-card summary:after{margin-left:12px}
.setting-card-body{border-top:1px solid var(--line)}
.setting-card .field+.field{margin-top:16px}
.setting-card:not([open]) summary{border:0}
.size-setting+.size-setting{margin-top:24px}
.helper-pretty,.helper,.muted{text-wrap:pretty}
.choice{min-height:48px;padding:8px 0;gap:16px}
.choice-copy{display:grid;gap:4px}
.choice-copy small{font-size:.75rem;color:var(--muted)}
.display-group-label{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:750;margin:24px 0 8px}
.display-group-label:first-child{margin-top:0}
.toggle{width:48px;min-width:48px;height:28px;min-height:28px;border:1px solid var(--control-border);background:#343b45;flex-shrink:0;overflow:visible}
.toggle::before{content:'';position:absolute;inset:-8px 0}
.toggle:after{width:20px;height:20px;left:3px;top:3px}
.toggle.on{background:var(--accent);border-color:var(--accent)}
.toggle.on:after{left:23px}
.theme-card{border:1px solid var(--control-border);border-radius:12px;min-height:48px}
.theme-card.active{outline:2px solid var(--accent);outline-offset:2px;box-shadow:none}
.theme-grid{gap:12px}
.mode-grid{gap:16px}
.mode-card{border-radius:16px;padding:24px;gap:12px;min-height:0}
.mode-name{font-size:1.2rem}
.mode-desc{font-size:1rem;line-height:1.5}
.mode-example{margin:0;line-height:1.5;font-size:.85rem}
.mode-card:hover{transform:none}
.mode-head{gap:12px}
.mode-icon{width:40px;min-width:40px}
.help-mode-list.detailed{display:grid;grid-template-columns:1fr!important;gap:12px}
.help-mode-detail{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:0;background:var(--surface2)}
.help-mode-detail>summary{list-style:none;display:grid!important;grid-template-columns:24px minmax(0,1fr) 20px;align-items:start;gap:12px;text-align:left;padding:16px;cursor:pointer}
.help-mode-detail>summary::-webkit-details-marker{display:none}
.help-mode-detail>summary:after{display:none}
.help-mode-copy{min-width:0}
.help-mode-copy b{display:block!important;font-size:1rem;line-height:1.4;margin:0 0 4px!important}
.help-mode-copy span{display:block;white-space:normal;overflow-wrap:anywhere;color:var(--muted);font-size:.9rem;line-height:1.6}
.help-mode-icon{width:24px;min-width:24px;margin:2px 0 0;color:var(--accent)}
.help-chevron{color:var(--muted)}
.help-mode-detail[open] .help-chevron{transform:rotate(180deg)}
.help-mode-body{padding:0 16px 16px 52px;font-size:.9rem;line-height:1.6}
.help-mode-body b{display:inline}
.help-item{padding:16px;border-radius:12px}
.help-item b{line-height:1.5}
.help-list{gap:12px}
.flow-pattern-shell{border:1px solid var(--line);padding:20px;border-radius:16px;margin-bottom:24px}
.flow-pattern-head{display:flex;align-items:start;gap:16px;justify-content:space-between}
.flow-pattern-head p{margin:8px 0 16px}
.flow-pattern-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.flow-pattern-card{border-radius:12px;min-height:100px;padding:12px;display:grid;gap:4px;place-items:center}
.flow-pattern-card b{font-size:.95rem}
.flow-pattern-card small{font-size:.65rem;letter-spacing:.06em}
.flow-pattern-card.active:disabled{opacity:1;border:1px solid var(--accent);outline:2px solid var(--accent);outline-offset:2px;background:color-mix(in srgb,var(--accent) 12%,var(--surface));box-shadow:none}
.flow-total{border-radius:16px;box-shadow:none;min-width:200px;flex-shrink:0}
.block{border-radius:16px}
.block-click{min-height:80px;gap:16px}
.block-list{gap:12px}
.block-menu{border-radius:12px}
.block-meta{line-height:1.5}
.add-flow{margin-top:24px}
.cue-v2-explain{gap:16px;margin-bottom:24px}
.cue-v2-explain>div{padding:16px;border-radius:12px}
.cue-v2-explain span{line-height:1.6}
.cue-list-v2{display:grid;gap:16px;margin-bottom:24px}
.cue-row-v2{flex-wrap:wrap;border:1px solid var(--line);border-radius:16px;align-items:flex-start;background:var(--surface)}
.cue-row-v2>.grow{min-width:180px}
.cue-row-actions{display:flex;gap:8px;align-items:center;justify-content:flex-end}

.cue-badge{font-size:.68rem;line-height:1.4;border-radius:8px;padding:6px 8px;max-width:160px}
.cue-disabled{opacity:.7}
.cue-actions-summary{margin-top:8px;display:flex;flex-wrap:wrap;gap:8px}
.cue-action-pill{font-size:.72rem;border:0;background:var(--surface2);padding:4px 8px;border-radius:8px}
.cue-warning{color:var(--warning);line-height:1.6;margin-top:8px}

.modal{border-radius:20px;max-height:90dvh;padding:24px}
.modal-header{display:flex;align-items:start;gap:16px;justify-content:space-between;padding:20px 24px;border-bottom:1px solid var(--line);background:var(--surface);flex-shrink:0}
.modal-header h2{font-size:1.2rem;line-height:1.4;margin:4px 0 0}
.modal-header .section-title{margin:0}
.modal-footer{display:flex;align-items:center;gap:12px;padding:16px 24px;border-top:1px solid var(--line);background:var(--surface);flex-shrink:0}
.modal.cue-modal-v15{width:min(760px,100%);padding:0;overflow:hidden;display:flex;flex-direction:column;max-height:92dvh}
.cue-form-body{overflow-y:auto;padding:24px;overscroll-behavior:contain;scrollbar-gutter:stable}
.cue-step{margin:0 0 24px;padding:0;border:0}
.cue-step h3{display:flex;gap:8px;align-items:center;font-size:.85rem;margin:0 0 16px;font-weight:750}
.cue-step h3>span{width:24px;height:24px;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);border-radius:50%;font-size:.75rem}
.cue-when-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.duration-small{grid-template-columns:minmax(48px,1fr) auto minmax(48px,1fr) auto minmax(48px,1fr);gap:4px}
.duration-small input{padding:10px 4px}
.cue-action-checks{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cue-check{display:flex;align-items:center;gap:12px;min-height:48px;padding:12px;border-radius:12px;border:1px solid var(--control-border);font-size:.9rem}
.cue-check input{width:18px;height:18px;accent-color:var(--accent);flex-shrink:0}
.cue-form-errors{color:var(--warning);font-size:.85rem;line-height:1.5}
.cue-form-errors p{margin:8px 0}
.cue-summary{font-size:.875rem;line-height:1.6;color:var(--muted);padding:12px 0 0;border-top:1px solid var(--line);margin:16px 0 0}
.overview-shell{display:grid;gap:24px;padding-bottom:40px}
.overview-hero{align-items:start;gap:24px}
.overview-card{border:1px solid var(--line);border-radius:16px;padding:24px;margin:0}
.overview-identity{position:sticky;top:88px}
.overview-total{font-size:clamp(3rem,7vw,6rem);line-height:1.1;margin:16px 0 8px}
.overview-stats{gap:24px;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:20px}
.overview-stat{border:0;border-radius:0;background:transparent;padding:0}
.overview-stat span{font-size:.72rem;line-height:1.5}
.overview-stat b{font-size:1.1rem;line-height:1.5}
.overview-checks{gap:0}
.ready-check{border:0;border-bottom:1px solid var(--line);padding:12px 0;border-radius:0;background:transparent;align-items:start;gap:12px}
.ready-check:last-child{border-bottom:0}
.check-icon{margin-top:3px;flex-shrink:0}
.ready-check .helper{margin:4px 0;font-size:.8rem}
.ready-check b{font-size:.875rem}
.check-status{font-size:.67rem;color:var(--muted);display:block}
.check-success .check-icon{color:var(--success);background:color-mix(in srgb,var(--success) 12%,transparent)}
.check-neutral .check-icon{color:var(--muted);background:var(--surface2)}
.check-warning .check-icon{color:var(--warning);background:color-mix(in srgb,var(--warning) 12%,transparent)}
.check-error .check-icon{color:var(--critical);background:color-mix(in srgb,var(--critical) 12%,transparent)}
.run-map{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;min-height:0;padding:0;overflow:visible}
.run-node{min-width:0;width:auto;max-width:none;padding:16px;border:0;border-radius:12px;display:grid;gap:4px;background:var(--surface2)}
.run-node:after,.run-map:after{display:none}
.run-map.single{max-width:560px;grid-template-columns:1fr}

.run-map.single .run-node .run-type,.run-map.single .run-node .muted{grid-column:1/-1}
.run-type{font-size:.72rem;color:var(--muted)}
.run-node .muted{font-size:.8rem}
.run-node b{overflow-wrap:anywhere}
.run-cue{border:0;border-bottom:1px solid var(--line);border-radius:0;padding:12px 0;gap:16px}
.run-cue p{margin:4px 0}
.overview-actions{display:flex;justify-content:space-between;margin:0;gap:16px}
.theme-minimal{--live-bg:#0f1217;--live-text:#f6f8fc;--live-timer:#f6f8fc;--live-muted:#a5afbf;--live-accent:#6f8fff;--live-bright:#a9b9ff;--live-on-accent:#0b1020}
.theme-dark{--live-bg:#05080d;--live-text:#f4f8fc;--live-timer:#f4f8fc;--live-muted:#a5b5c5;--live-accent:#20b8d8;--live-bright:#68e3ff;--live-on-accent:#041117}
.theme-light{--live-bg:#f5f7fb;--live-text:#171a20;--live-timer:#171a20;--live-muted:#5e6875;--live-accent:#3159c9;--live-bright:#3159c9;--live-on-accent:#fff}
.theme-high-contrast{--live-bg:#000;--live-text:#fff;--live-timer:#fff;--live-muted:#dde7eb;--live-accent:#00bfe6;--live-bright:#55e7ff;--live-on-accent:#001014}
.theme-energetic{--live-bg:#1b1033;--live-text:#fff9ea;--live-timer:#ffd43b;--live-muted:#d5c6e6;--live-accent:#ff8a1f;--live-bright:#ffd43b;--live-on-accent:#241400}
.theme-soft{--live-bg:#f6f0fa;--live-text:#30283b;--live-timer:#4f3d61;--live-muted:#695d72;--live-accent:#74538f;--live-bright:#74538f;--live-on-accent:#fff}
.participant-surface{container-type:size;display:flex;align-items:center;justify-content:center;background:var(--live-bg);color:var(--live-text);position:relative;overflow:hidden;font-family:var(--display-font,var(--font-ui))}
.participant-preview.participant-surface{width:100%;height:auto;aspect-ratio:16/9;border-radius:16px;border:1px solid var(--line);box-shadow:none;min-height:0}
.participant-preview.aspect-4-3{aspect-ratio:4/3}
.participant-core{width:94%;max-width:94%;height:auto;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transform:scale(var(--fit,1));transform-origin:center;line-height:1.1}
.participant-identity{display:flex;flex-direction:column;align-items:center;max-width:100%;width:100%}
.participant-current{display:flex;flex-direction:column;align-items:center;gap:2cqh;width:100%}

.participant-core .live-title{font-size:calc(min(5cqw,7cqh) * var(--title-scale,1) * var(--display-scale,1))!important;line-height:1.15;font-weight:800;letter-spacing:.02em;overflow-wrap:anywhere;max-width:95%;margin:0;color:var(--live-text)}
.participant-core .live-subtitle{font-size:calc(min(3cqw,4.6cqh) * var(--display-scale,1));line-height:1.3;font-weight:500;color:var(--live-muted);overflow-wrap:anywhere}
.participant-core .main-timer{font-size:min(calc(150cqw / var(--timer-chars,5) * var(--timer-scale,1)),calc(38cqh * var(--timer-scale,1)))!important;font-weight:850;line-height:1.02;letter-spacing:calc(var(--tracking,2px) * .6);font-variant-numeric:tabular-nums;white-space:nowrap;width:max-content;max-width:none;margin:0;padding:0;color:var(--live-timer)!important}
.participant-core .phase{font-size:calc(min(4.2cqw,6cqh) * var(--title-scale,1) * var(--display-scale,1))!important;line-height:1.2;font-weight:750;overflow-wrap:anywhere;max-width:95%;color:var(--live-text)}
.participant-core .secondary{font-size:calc(min(6cqw,10cqh) * var(--display-scale,1))!important;font-weight:750;line-height:1.15;font-variant-numeric:tabular-nums;color:var(--live-text)}
.participant-core .timer-caption,.participant-core .next-phase{font-size:calc(min(2.2cqw,3.6cqh) * var(--display-scale,1));line-height:1.4;color:var(--live-muted);max-width:90%}

.participant-core .progress{height:max(3px,.85cqh)!important;flex-shrink:0;margin:1cqh 0 0;border-radius:999px;background:color-mix(in srgb,var(--live-text) 20%,var(--live-bg));overflow:hidden}

.ready-label{font-size:.72rem}
.ready-controls .btn{font-size:.85rem}
.live-panel,.controlbar{--bg:#0b0d10;--surface:#14181d;--surface2:#1b2027;--line:#343c49;--control-border:#657384;--text:#f7f8fa;--muted:#abb5c4;--accent:#7aa2ff;--accent-ink:#08101f;--focus:#9bb9ff;--warning:#f3c969;--critical:#ff9696;color:var(--text);background:rgba(20,24,29,.98);color-scheme:dark;font-family:var(--font-ui)}

};

const RELEASE_CHANNEL='BETA', RELEASE_BUILD='20.0.0-beta.1', RELEASE_LABEL='v20 Beta';

const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
const deep = o => JSON.parse(JSON.stringify(o));
const esc = s => String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const save = (k,v) => { try { localStorage.setItem(k,JSON.stringify(v)); return true; } catch { return false; } };
const load = (k,d=null) => { try { const x=localStorage.getItem(k); return x?JSON.parse(x):d; } catch { return d; } };
const del = k => { try { localStorage.removeItem(k); } catch {} };

// V12 audio storage — recordings live in IndexedDB, not localStorage.
const AUDIO_DB_NAME='game_timer_audio_v1', AUDIO_STORE='sounds';
let AUDIO_DB_PROMISE=null;
function openAudioDB(){
  if(AUDIO_DB_PROMISE)return AUDIO_DB_PROMISE;
  AUDIO_DB_PROMISE=new Promise((resolve,reject)=>{
    if(!('indexedDB' in window))return reject(new Error('IndexedDB unavailable'));
    const req=indexedDB.open(AUDIO_DB_NAME,1);
    req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(AUDIO_STORE))db.createObjectStore(AUDIO_STORE,{keyPath:'id'});};
    req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error||new Error('Could not open audio library'));
  });
  return AUDIO_DB_PROMISE;
}
async function audioDBPut(record){const db=await openAudioDB();return new Promise((resolve,reject)=>{const tx=db.transaction(AUDIO_STORE,'readwrite');tx.objectStore(AUDIO_STORE).put(record);tx.oncomplete=()=>resolve(record);tx.onerror=()=>reject(tx.error);});}
async function audioDBGet(id){if(!id)return null;const db=await openAudioDB();return new Promise((resolve,reject)=>{const req=db.transaction(AUDIO_STORE).objectStore(AUDIO_STORE).get(id);req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>reject(req.error);});}
async function audioDBList(savedOnly=false){const db=await openAudioDB();return new Promise((resolve,reject)=>{const req=db.transaction(AUDIO_STORE).objectStore(AUDIO_STORE).getAll();req.onsuccess=()=>{let a=req.result||[];if(savedOnly)a=a.filter(x=>x.saved);resolve(a.sort((x,y)=>(y.createdAt||0)-(x.createdAt||0)));};req.onerror=()=>reject(req.error);});}
async function audioDBDelete(id){if(!id)return;const db=await openAudioDB();return new Promise((resolve,reject)=>{const tx=db.transaction(AUDIO_STORE,'readwrite');tx.objectStore(AUDIO_STORE).delete(id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);});}
function revokeVoiceUrl(id){const url=state.voiceUrls?.get?.(id);if(url){URL.revokeObjectURL(url);state.voiceUrls.delete(id);}}

AT LIVE","Choose 4–6 actions for the left side of the Live control bar. Previous / Pause / Next, More, and Help remain available separately.":"Pilih 4–6 aksi untuk sisi kiri control bar Live. Sebelumnya / Jeda / Berikutnya, Lainnya, dan Petunjuk tetap tersedia terpisah.","SAVE LIVE CONTROLS":"SIMPAN KONTROL LIVE","Offline":"Offline","The PWA can keep critical timing functions running after it has loaded.":"PWA dapat menjaga fungsi timer penting tetap berjalan setelah dimuat.","Local Storage":"Penyimpanan Lokal","Drafts, presets, history, and recovery data are stored in this browser/device.":"Draf, preset, riwayat, dan data pemulihan disimpan di browser/perangkat ini.","RESET DRAFT SESSION":"RESET DRAF SESI","Reset draft?":"Reset draf?","The saved draft will be replaced with a new session.":"Draf tersimpan akan diganti dengan sesi baru.","Draft reset":"Draf direset","Choose up to 6 Live controls.":"Pilih maksimal 6 kontrol Live.","Choose at least 4 Live controls.":"Pilih setidaknya 4 kontrol Live.","Live controls updated":"Kontrol Live diperbarui","Fullscreen is not available in this browser.":"Fullscreen tidak tersedia di browser ini.","Enter a time greater than 00:00.":"Masukkan waktu lebih dari 00:00.","Close panel":"Tutup panel","Use the arrows or mouse wheel":"Gunakan tombol panah atau scroll mouse","Fastest Start":"Mulai Tercepat","Create Session":"Buat Sesi","Preset Library":"Pustaka Preset","FEATURES — WHAT ELSE CAN GAME TIMER DO?":"FITUR — APA LAGI YANG BISA DILAKUKAN GAME TIMER?","Session Status":"Status Sesi","Live Display Control":"Kontrol Layar Live","Run Overview":"Ringkasan Alur","Session History":"Riwayat Sesi","Recovery":"Pemulihan","Display Options":"Opsi Tampilan","Q&A — COMMON QUESTIONS →":"TANYA JAWAB — PERTANYAAN UMUM →","Q&A — GAME TIMER":"TANYA JAWAB — GAME TIMER","COMMON QUESTIONS":"PERTANYAAN UMUM","Quick answers to the questions facilitators are most likely to ask while setting up or running a session.":"Jawaban singkat untuk pertanyaan yang paling sering muncul saat fasilitator menyiapkan atau menjalankan sesi.","GETTING STARTED":"MEMULAI","DISPLAY & SOUND":"TAMPILAN & SUARA","PRESETS & RECOVERY":"PRESET & PEMULIHAN","Which mode should I choose?":"Mode mana yang sebaiknya dipilih?","Use Quick Timer for one timer. Use Simple for one structured section, Loop for one repeating interval, Alternating for two timed states that switch back and forth, Rounds for repeated attempts, Sequence for multiple phases, and Timeline for a main timer with timed cues.":"Gunakan Timer Cepat untuk satu timer. Gunakan Sederhana untuk satu bagian terstruktur, Loop untuk interval berulang, Ronde untuk percobaan berulang, Urutan untuk beberapa fase, dan Linimasa untuk timer utama dengan cue terjadwal.","Use Simple for one timer, Loop for repeating intervals, Rounds for repeated attempts, Sequence for multiple phases, and Timeline for a main timer with timed cues.":"Gunakan Simple untuk satu timer, Loop untuk interval berulang, Rounds untuk percobaan berulang, Sequence untuk beberapa fase, dan Timeline untuk timer utama dengan cue terjadwal.","What is the difference between Quick Timer and Create Session?":"Apa perbedaan Quick Timer dan Create Session?","Quick Timer is the fastest route to Countdown, Count Up, or Stopwatch. Create Session gives you blocks, rounds, loops, cues, participant display settings, Curtain, and reusable presets.":"Quick Timer adalah jalur tercepat untuk Countdown, Count Up, atau Stopwatch. Create Session menyediakan block, ronde, loop, cue, pengaturan layar peserta, Curtain, dan preset yang dapat digunakan ulang.","Can I run a Loop without an overall time limit?":"Bisakah Loop berjalan tanpa batas waktu total?","Yes. Edit the Loop and set Loop Limit to No time limit (∞). The interval keeps repeating until you finish the session.":"Ya. Edit Loop dan atur Loop Limit menjadi Tanpa batas waktu (∞). Interval terus berulang sampai Anda menyelesaikan sesi.","What is the difference between Main Timer and Current Timer?":"Apa perbedaan Timer Utama dan Timer Saat Ini?","Main Timer represents the overall session. Current Timer represents the active section, round, interval, or transition. You can show either, both, or neither.":"Timer Utama mewakili keseluruhan sesi. Timer Saat Ini mewakili bagian, ronde, interval, atau transisi yang aktif. Anda dapat menampilkan salah satu, keduanya, atau tidak keduanya.","What is Curtain?":"Apa itu Curtain?","Curtain is a temporary participant display mode. In Settings → Curtain, choose one item to show enlarged: Current Timer, Main Timer, or Round/Phase. Press C during Live to switch into Curtain and press C again to return.":"Curtain adalah mode tampilan peserta sementara. Di Pengaturan → Curtain, pilih satu item yang akan diperbesar: Timer Saat Ini, Timer Utama, atau Ronde/Fase. Tekan C saat Live untuk masuk Curtain dan tekan C lagi untuk kembali.","What is a CUE?":"Apa itu CUE?","A cue is a prepared reminder or action. Timed cues run automatically. Manual cues wait until you press CUE during Live.":"Cue adalah pengingat atau aksi yang sudah disiapkan. Cue terjadwal berjalan otomatis. Cue manual menunggu sampai Anda menekan CUE saat Live.","Can I change time while the timer is running?":"Bisakah waktu diubah saat timer berjalan?","Yes. Open Session Status to use quick adjustments or enter an exact amount to add or subtract. The clock remains timestamp-based and continues accurately.":"Ya. Buka Status Sesi untuk memakai penyesuaian cepat atau masukkan jumlah tepat yang ingin ditambah atau dikurangi. Jam tetap berbasis timestamp dan berjalan akurat.","Can I add or remove rounds while Live?":"Bisakah saya menambah atau mengurangi ronde saat Live?","Yes, when the active block is Rounds. Session Status provides Round Adjustment controls and updates the total automatically.":"Ya, saat block aktif adalah Rounds. Status Sesi menyediakan kontrol Penyesuaian Ronde dan memperbarui total secara otomatis.","What does LAP do?":"Apa fungsi LAP?","Lap records the current elapsed time without stopping the timer. It is useful when participants or teams finish at different moments. Laps are included in the session summary.":"Lap mencatat waktu berjalan saat ini tanpa menghentikan timer. Berguna saat peserta atau tim selesai pada waktu berbeda. Lap disertakan dalam ringkasan sesi.","How do I show a Main Timer that started hidden?":"Bagaimana menampilkan Timer Utama yang sejak awal tersembunyi?","Open Other Controls and choose Show Main Timer. The same button becomes Hide Main Timer when it is visible. This is a live override and does not require returning to setup.":"Buka Kontrol Lain dan pilih Tampilkan Timer Utama. Tombol yang sama berubah menjadi Sembunyikan Timer Utama saat terlihat. Ini adalah override Live dan tidak perlu kembali ke setup.","What happens when I press Pause?":"Apa yang terjadi saat saya menekan Jeda?","The timer freezes. You can Resume or Stop. Stop always asks for confirmation before saving the result to the summary.":"Timer berhenti sementara. Anda dapat Lanjutkan atau Stop. Stop selalu meminta konfirmasi sebelum menyimpan hasil ke ringkasan.","Can I change the theme during Live?":"Bisakah tema diubah saat Live?","Yes. Open DISPLAY and change Theme, Font, Timer Size, Display Scale, Title & Phase Size, or Timer Spacing while the session keeps running.":"Ya. Buka LAYAR dan ubah Tema, Font, Ukuran Timer, Skala Tampilan, Ukuran Judul & Fase, atau Jarak Timer sementara sesi tetap berjalan.","Why does fullscreen not start automatically?":"Mengapa fullscreen tidak otomatis?","Browsers require fullscreen to be triggered by a user action. Press the Fullscreen button or F.":"Browser mengharuskan fullscreen dipicu oleh aksi pengguna. Tekan tombol Fullscreen atau F.","Can I use the app without internet?":"Bisakah aplikasi digunakan tanpa internet?","The PWA is designed to keep critical timing features local after it has been loaded and cached. For the best offline behavior, run it from HTTPS or localhost.":"PWA dirancang agar fitur timer penting tetap lokal setelah dimuat dan di-cache. Untuk penggunaan offline terbaik, jalankan melalui HTTPS atau localhost.","What is Maximum Legibility?":"Apa itu Keterbacaan Maksimal?","It strengthens type weight, spacing, and progress visibility for weak projectors, bright rooms, or long viewing distances.":"Fitur ini memperkuat ketebalan huruf, jarak, dan visibilitas progres untuk proyektor lemah, ruangan terang, atau jarak pandang jauh.","Can I preview a 4:3 projector?":"Bisakah saya melihat pratinjau proyektor 4:3?","Yes. In Settings → Accessibility & Projector, change Preview Aspect Ratio to 4:3.":"Ya. Di Pengaturan → Aksesibilitas & Proyektor, ubah Rasio Pratinjau menjadi 4:3.","What is a Preset?":"Apa itu Preset?","A Preset is a reusable session configuration. It stores the structure and settings, not the current runtime position.":"Preset adalah konfigurasi sesi yang dapat digunakan ulang. Preset menyimpan struktur dan pengaturan, bukan posisi runtime saat ini.","Can I save a Preset while Live?":"Bisakah Preset disimpan saat Live?","Yes. Open Other Controls → Save as Preset. You will be asked to name and categorize it before it is saved.":"Ya. Buka Kontrol Lain → Simpan sebagai Preset. Anda akan diminta memberi nama dan kategori sebelum disimpan.","Can I move presets to another device?":"Bisakah preset dipindahkan ke perangkat lain?","Yes. Open Preset Library and Export a preset as JSON, then Import that file on another device.":"Ya. Buka Pustaka Preset dan Ekspor preset sebagai JSON, lalu Impor file tersebut di perangkat lain.","What is Session History?":"Apa itu Riwayat Sesi?","A local log of completed sessions including actual duration, laps, cues, round changes, and time adjustments.":"Catatan lokal sesi yang selesai, termasuk durasi aktual, lap, cue, perubahan ronde, dan penyesuaian waktu.","What happens if I refresh or the browser closes unexpectedly?":"Apa yang terjadi jika saya refresh atau browser tertutup tiba-tiba?","Game Timer stores important runtime state locally. When you return, the Recovery screen can resume, restart, or discard the unfinished session.":"Game Timer menyimpan status runtime penting secara lokal. Saat kembali, layar Pemulihan dapat melanjutkan, memulai ulang, atau membuang sesi yang belum selesai.","Use ":"Gunakan "," when you only need a Countdown, Count Up, or Stopwatch and want to start immediately.":" saat Anda hanya membutuhkan Countdown, Count Up, atau Stopwatch dan ingin langsung mulai.","Use a structured session when you need Loops, Alternating states, Rounds, Sequences, Timelines, cues, display rules, or multiple sections.":"Gunakan sesi terstruktur saat Anda membutuhkan Loop, Ronde, Urutan, Linimasa, cue, aturan tampilan, atau beberapa bagian.","Browse built-in and saved presets, mark favorites, duplicate, categorize, import, and export reusable session setups.":"Jelajahi preset bawaan dan tersimpan, tandai favorit, duplikat, beri kategori, impor, dan ekspor setup sesi yang dapat digunakan ulang.","Prepare automatic or manual reminders, rule changes, sounds, and display changes.":"Siapkan pengingat otomatis atau manual, perubahan aturan, suara, dan perubahan tampilan.","Temporarily replace the participant display with one selected item, such as Current Timer or Round, while time keeps running.":"Ganti sementara tampilan peserta dengan satu item pilihan, seperti Timer Saat Ini atau Ronde, sementara waktu tetap berjalan.","See what has happened, what is happening now, and what remains. Adjust time or rounds without leaving Live.":"Lihat apa yang sudah terjadi, sedang terjadi, dan masih tersisa. Sesuaikan waktu atau ronde tanpa meninggalkan Live.","Record a timestamp for a participant or team finishing early without stopping the timer.":"Catat waktu peserta atau tim yang selesai lebih dulu tanpa menghentikan timer.","Change theme, visibility, typography, and display sizes while the session is running.":"Ubah tema, visibilitas, tipografi, dan ukuran tampilan saat sesi berjalan.","Review the complete session map and readiness checks before entering Ready.":"Tinjau peta sesi lengkap dan pemeriksaan kesiapan sebelum masuk ke Ready.","Keep a lightweight local record of completed sessions, laps, cues, and live adjustments.":"Simpan catatan lokal ringan tentang sesi selesai, lap, cue, dan penyesuaian Live.","If the page reloads unexpectedly, Game Timer can restore an unfinished session from local storage.":"Jika halaman dimuat ulang secara tak terduga, Game Timer dapat memulihkan sesi yang belum selesai dari penyimpanan lokal.","Counts down from a time limit to 00:00.":"Menghitung mundur dari batas waktu ke 00:00.","Starts at 00:00 and records elapsed time until you finish.":"Dimulai dari 00:00 dan mencatat waktu berjalan sampai Anda selesai.","Open-ended timing with Lap available during Live.":"Pengukuran waktu tanpa batas dengan Lap tersedia saat Live.","Preview timer size, title size, theme, font, and sound before starting.":"Pratinjau ukuran timer, ukuran judul, tema, font, dan suara sebelum memulai.","Set identity, start behavior, participant display, sizes, typography, theme, sound, and Curtain behavior.":"Atur identitas, cara mulai, tampilan peserta, ukuran, tipografi, tema, suara, dan perilaku Curtain.","Defines how the activity runs. Simple = one countdown/count-up; Loop = a repeating interval; Rounds = multiple rounds; Sequence = several sections in order.":"Menentukan bagaimana aktivitas berjalan. Simple = satu countdown/count-up; Loop = interval berulang; Rounds = beberapa ronde; Sequence = beberapa bagian berurutan.","A cue is a reminder or action during the session. Timed cues run automatically. Prepared cues run when you press CUE.":"Cue adalah pengingat atau aksi selama sesi. Cue terjadwal berjalan otomatis. Cue yang disiapkan berjalan saat Anda menekan CUE.","OPEN-ENDED LOOP":"LOOP TANPA BATAS","Choose Loop → Edit → Loop Limit → No time limit (∞). The loop runs until you finish the session.":"Pilih Loop → Edit → Batas Loop → Tanpa batas waktu (∞). Loop berjalan sampai Anda menyelesaikan sesi.","CURTAIN":"CURTAIN","In Settings → Curtain, choose what participants should see while Curtain is active: Current Timer, Main Timer, or Round/Phase. Press C to toggle Curtain during Live.":"Di Pengaturan → Curtain, pilih apa yang dilihat peserta saat Curtain aktif: Timer Saat Ini, Timer Utama, atau Ronde/Fase. Tekan C untuk mengaktifkan/menonaktifkan Curtain saat Live.","LIVE PREVIEW vs FULL PREVIEW":"PRATINJAU LIVE vs PRATINJAU PENUH","The Live Preview inside Settings updates immediately. Full Preview opens the participant display at full size.":"Live Preview di Pengaturan langsung diperbarui. Full Preview membuka tampilan peserta dalam ukuran penuh.","One timer for one activity. Use Countdown for a time limit or Count Up for open-ended elapsed time.":"Satu timer untuk satu aktivitas. Gunakan Countdown untuk batas waktu atau Count Up untuk waktu berjalan tanpa batas.","A repeating interval, with or without an overall time limit.":"Interval berulang, dengan atau tanpa batas waktu total.","Several timed rounds or attempts.":"Beberapa ronde atau percobaan berdurasi.","Several different phases in order.":"Beberapa fase berbeda secara berurutan.","One main timer with cues/messages at selected moments.":"Satu timer utama dengan cue/pesan pada waktu tertentu.","Session Map":"Peta Sesi","Review the full run order before entering Ready.":"Tinjau urutan lengkap sebelum masuk ke Ready.","Ready Check":"Cek Kesiapan","Confirm display, sound, accessibility, and screen-awake support.":"Konfirmasi tampilan, suara, aksesibilitas, dan dukungan layar tetap aktif.","Favorites":"Favorit","Pin presets you use often.":"Sematkan preset yang sering Anda gunakan.","Import / Export":"Impor / Ekspor","Move presets between devices as JSON files without an account.":"Pindahkan preset antarperangkat sebagai file JSON tanpa akun.","Completed sessions are stored locally with actual duration, laps, cues, and adjustments.":"Sesi selesai disimpan secara lokal dengan durasi aktual, lap, cue, dan penyesuaian.","Starts the session using the selected Immediate or 3–2–1–GO behavior.":"Memulai sesi menggunakan cara Mulai Langsung atau 3–2–1–GO yang dipilih.","Use fullscreen for a clean participant display. The browser requires a user click to enter fullscreen.":"Gunakan fullscreen untuk tampilan peserta yang bersih. Browser memerlukan klik pengguna untuk masuk fullscreen.","Return to the Builder without starting the timer.":"Kembali ke Builder tanpa memulai timer.","Quick Start":"Mulai Cepat","Use Quick Timer for a simple timing need, or Create Session for structured facilitation.":"Gunakan Quick Timer untuk kebutuhan waktu sederhana, atau Create Session untuk fasilitasi terstruktur.","Presets":"Preset","Saved configurations can be loaded and reused later.":"Konfigurasi tersimpan dapat dimuat dan digunakan kembali nanti.","Show a large message such as MOVE!, STOP!, or a rule change.":"Tampilkan pesan besar seperti PINDAH!, STOP!, atau perubahan aturan.","Run a cue that you prepared before the session. Timed cues run automatically.":"Jalankan cue yang telah disiapkan sebelum sesi. Cue terjadwal berjalan otomatis.","Show or hide participant information and adjust the live display while the session is running.":"Tampilkan atau sembunyikan informasi peserta dan sesuaikan layar Live saat sesi berjalan.","Record the current time without stopping the timer. Works with Countdown, Count Up, Stopwatch, and Sessions.":"Catat waktu saat ini tanpa menghentikan timer. Bekerja dengan Countdown, Count Up, Stopwatch, dan Session.","See elapsed/remaining time, current section, rounds, laps, and make quick timing adjustments.":"Lihat waktu berjalan/tersisa, bagian saat ini, ronde, lap, dan lakukan penyesuaian waktu cepat.","Enter or exit fullscreen.":"Masuk atau keluar fullscreen.","Other Controls":"Kontrol Lain","Repeat/restart the current section, show or hide the Main Timer, finish, or save the session as a preset.":"Ulangi/mulai ulang bagian saat ini, tampilkan atau sembunyikan Timer Utama, selesaikan, atau simpan sesi sebagai preset.","Curtain replaces the normal participant display with the single item selected in Settings → Curtain. It can enlarge the Current Timer, Main Timer, or Round/Phase. The timer keeps running. Press C or the Return icon to switch back.":"Curtain mengganti tampilan peserta normal dengan satu item yang dipilih di Pengaturan → Curtain. Curtain dapat memperbesar Timer Saat Ini, Timer Utama, atau Ronde/Fase. Timer tetap berjalan. Tekan C atau ikon Kembali untuk kembali.","Shortcuts":"Shortcut","Space Pause/Resume · N Next · B Previous · M Message · C Curtain/Return · F Fullscreen.":"Space Jeda/Lanjutkan · N Berikutnya · B Sebelumnya · M Pesan · C Curtain/Kembali · F Fullscreen.","Starts immediately with no 3–2–1.":"Mulai langsung tanpa 3–2–1.","Show a countdown before the timer starts.":"Tampilkan hitung mundur sebelum timer dimulai.","TIMER SIZE":"UKURAN TIMER","TITLE SIZE":"UKURAN JUDUL","THEME":"TEMA","FONT":"FONT","SOUND":"SUARA","Enable Start & Finish sounds":"Aktifkan suara Mulai & Selesai","▶ Test Start":"▶ Tes Mulai","▶ Test Finish":"▶ Tes Selesai","DONE":"SELESAI","? Help":"? Petunjuk","? HELP":"? PETUNJUK","Display Font":"Font Tampilan","FULL PREVIEW":"PRATINJAU PENUH","RUN OVERVIEW →":"RINGKASAN ALUR →","10-minute challenge / open-ended elapsed time":"Tantangan 10 menit / waktu berjalan tanpa batas","Move every 30 seconds":"Pindah setiap 30 detik","5 rounds × 2 minutes":"5 ronde × 2 menit","Plan 3m → Play 10m → Review 5m":"Rencana 3m → Main 10m → Refleksi 5m","At minute 5 change leader; at minute 10 change the rule":"Menit 5 ganti leader; menit 10 ubah aturan","Use":"Gunakan","Quick Timer":"Timer Cepat","when you only need a Countdown, Count Up, or Stopwatch and want to start immediately.":"saat Anda hanya membutuhkan Hitung Mundur, Hitung Maju, atau Stopwatch dan ingin langsung mulai.","RUNNING":"BERJALAN","PAUSED":"DIJEDA","OVERTIME":"OVERTIME","ELAPSED":"BERJALAN","CURRENT":"SAAT INI","POSITION":"POSISI","TIMER":"TIMER","single section":"satu bagian","Time Adjustment":"Penyesuaian Waktu","Round Adjustment":"Penyesuaian Ronde","APPLY":"TERAPKAN","Fullscreen":"Layar Penuh","Countdown":"Hitung Mundur","Count Up":"Hitung Maju","Stopwatch":"Stopwatch","Sessions":"Sesi","Session":"Sesi","Interface Language":"Bahasa Antarmuka","Choose the language used by the interface, Help, Q&A, dialogs, validation messages, and built-in presets. Your own titles, messages, and preset names are never auto-translated.":"Pilih bahasa untuk antarmuka, Petunjuk, Tanya Jawab, dialog, pesan validasi, dan preset bawaan. Judul, pesan, dan nama preset buatan Anda tidak pernah diterjemahkan otomatis.","Data & Offline":"Data & Offline","Drafts, presets, history, recovery data, and saved voice cues stay on this device. After the PWA has loaded, critical timing can keep working offline.":"Draf, preset, riwayat, dan data pemulihan tetap tersimpan di perangkat ini. Setelah PWA dimuat, fungsi waktu penting dapat tetap bekerja secara offline."},"ms":{"Facilitation Display":"Paparan Fasilitasi","Facilitate the Moment.":"Fasilitasi Setiap Detik.","Help":"Bantuan","Settings":"Tetapan","App settings":"Tetapan aplikasi","Back":"Kembali","Close":"Tutup","CLOSE ×":"TUTUP ×","Saved":"Disimpan","QUICK TIMER":"PEMASA PANTAS","CREATE SESSION":"CIPTA SESI","PRESET LIBRARY":"PUSTAKA PRATETAP","SESSION HISTORY":"SEJARAH SESI","Recent Presets":"Pratetap Terkini","Run":"Jalankan","RUN":"JALANKAN","General":"Umum","Language":"Bahasa","ABOUT":"TENTANG","COUNTDOWN":"KIRA DETIK","COUNT UP":"KIRA NAIK","STOPWATCH":"JAM RANDIK","Title (optional)":"Tajuk (pilihan)","Group Discussion":"Perbincangan Kumpulan","DISPLAY OPTIONS":"PILIHAN PAPARAN","START":"MULA","READY":"SEDIA","EDIT":"EDIT","FULLSCREEN":"SKRIN PENUH","QUICK TIMER OPTIONS":"PILIHAN PEMASA PANTAS","START BEHAVIOR":"CARA MULA","Immediate":"Serta-merta","The timer starts as soon as START is pressed. No 3–2–1.":"Pemasa bermula sebaik sahaja MULA ditekan. Tanpa 3–2–1.","A short countdown appears before the timer starts.":"Kiraan pendek muncul sebelum pemasa bermula.","When Time Ends":"Apabila Masa Tamat","Wait":"Tunggu","Overtime":"Masa Tambahan","Continue":"Teruskan","Stop":"Henti","Timer Size":"Saiz Pemasa","Title & Phase Size":"Saiz Tajuk & Fasa","Display Scale":"Skala Paparan","Timer Spacing":"Jarak Pemasa","Theme":"Tema","Font":"Fon","Sound":"Bunyi","Enable cue sounds":"Aktifkan bunyi cue","Test Start":"Uji Mula","Test Finish":"Uji Tamat","Normal":"Normal","Large":"Besar","Maximum":"Maksimum","PREVIEW":"PRATONTON","PREVIEW MESSAGE":"PRATONTON MESEJ","MESSAGE PREVIEW":"PRATONTON MESEJ","CHOOSE HOW TIME RUNS":"PILIH CARA MASA BERJALAN","What does your activity look like?":"Bagaimanakah bentuk aktiviti anda?","Choose the closest pattern. You can still adjust everything afterwards.":"Pilih corak yang paling hampir. Semuanya masih boleh dilaraskan selepas itu.","Simple":"Ringkas","One countdown or count-up timer.":"Satu pemasa kira detik atau kira naik.","Loop":"Gelung","A repeating interval, with an optional overall time limit.":"Selang berulang, dengan had masa keseluruhan pilihan.","Rounds":"Pusingan","Multiple rounds or attempts.":"Beberapa pusingan atau percubaan.","Sequence":"Urutan","Different timed phases that run in order.":"Fasa bermasa berbeza yang berjalan mengikut urutan.","Timeline":"Garis Masa","One main timer with cues or messages at selected moments.":"Satu pemasa utama dengan cue atau mesej pada masa tertentu.","Example:":"Contoh:","Already working on a session?":"Sudah mengusahakan satu sesi?","CONTINUE DRAFT":"SAMBUNG DRAF","SETTINGS":"TETAPAN","TIME FLOW":"ALIRAN MASA","CUES & MESSAGES":"CUE & MESEJ","Expand navigation":"Kembangkan navigasi","Collapse navigation":"Kuncupkan navigasi","Set up the session and participant display":"Tetapkan sesi dan paparan peserta","Open only the sections you need. Collapse the rest to keep the page focused.":"Buka hanya bahagian yang diperlukan. Kuncupkan selebihnya agar halaman kekal fokus.","1. Identity":"1. Identiti","Session Title":"Tajuk Sesi","Subtitle (optional)":"Subtajuk (pilihan)","Program / Client (optional)":"Program / Klien (pilihan)","2. Start":"2. Mula","3. Display":"3. Paparan","Title":"Tajuk","Subtitle":"Subtajuk","Main Timer":"Pemasa Utama","Current Timer":"Pemasa Semasa","Phase Name":"Nama Fasa","Current Round":"Pusingan Semasa","Total Rounds":"Jumlah Pusingan","Progress Bar":"Bar Kemajuan","Progress":"Kemajuan","Main Timer Visibility":"Keterlihatan Pemasa Utama","Always visible":"Sentiasa kelihatan","Hidden":"Tersembunyi","Reveal near the end":"Tunjukkan hampir tamat","Reveal manually":"Tunjukkan secara manual","4. Size & Typography":"4. Saiz & Tipografi","Message Size":"Saiz Mesej","The Main Timer and other display elements can be scaled independently. 100% Main Timer means Full Fit.":"Pemasa Utama dan elemen paparan lain boleh diskalakan secara berasingan. 100% Pemasa Utama bermaksud Full Fit.","5. Theme":"5. Tema","Minimal":"Minimal","Dark":"Gelap","Light":"Cerah","High Contrast":"Kontras Tinggi","Energetic":"Bertenaga","Soft":"Lembut","6. Sound":"6. Bunyi","7. Curtain":"7. Curtain","What should Curtain show?":"Apakah yang perlu dipaparkan Curtain?","Round / Phase":"Pusingan / Fasa","Curtain temporarily replaces the normal participant display with one selected item, enlarged to presentation size. Press C or the Curtain/Return icon to switch back.":"Curtain menggantikan paparan peserta buat sementara dengan satu item pilihan yang dibesarkan. Tekan C atau ikon Curtain/Kembali untuk kembali.","Curtain does not pause the timer.":"Curtain tidak menjeda pemasa.","8. Accessibility & Projector":"8. Kebolehcapaian & Projektor","Maximum Legibility":"Kebolehbacaan Maksimum","Heavier type, stronger spacing, and a thicker progress bar for difficult projectors.":"Teks lebih tebal, jarak lebih jelas dan bar kemajuan lebih tebal untuk projektor yang sukar.","Preview Aspect Ratio":"Nisbah Pratonton","16:9 widescreen":"16:9 skrin lebar","4:3 projector":"4:3 projektor","Contrast passes":"Kontras lulus","Contrast warning":"Amaran kontras","Checks the weaker of body text and timer contrast against the selected theme background.":"Memeriksa kontras terendah antara teks dan pemasa dengan latar tema yang dipilih.","LIVE PREVIEW":"PRATONTON LANGSUNG","This preview updates immediately as you change the settings.":"Pratonton ini dikemas kini serta-merta apabila tetapan diubah.","Controls the title and phase/round label size.":"Mengawal saiz tajuk dan label fasa/pusingan.","Scales the title, phase, secondary timer, and progress without changing the Main Timer size.":"Mengubah skala tajuk, fasa, pemasa kedua dan kemajuan tanpa mengubah saiz Pemasa Utama.","Increase slightly when the timer digits feel too tight.":"Naikkan sedikit jika digit pemasa terasa terlalu rapat.","TOTAL SESSION TIME":"JUMLAH MASA SESI","Contains an open-ended section":"Mengandungi bahagian tanpa had masa","Combined duration of all sections":"Jumlah tempoh semua bahagian","ADD SECTION":"TAMBAH BAHAGIAN","Choose a timing pattern":"Pilih corak masa","Simple Timer":"Pemasa Ringkas","One phase with one timer.":"Satu fasa dengan satu pemasa.","A repeating interval, including open-ended loops.":"Selang berulang, termasuk gelung tanpa had masa.","A/B Loop":"Gelung A/B","Two alternating intervals, such as Work/Rest.":"Dua selang berselang-seli, seperti Kerja/Rehat.","Edit":"Edit","Duplicate":"Duplikasi","Move Up":"Naikkan","Move Down":"Turunkan","Delete":"Padam","A session must have at least one section.":"Sesi mesti mempunyai sekurang-kurangnya satu bahagian.","EDIT TIMER":"EDIT PEMASA","Timer Type":"Jenis Pemasa","Duration":"Tempoh","Starts at 00:00 and keeps running until you press Finish or Next.":"Bermula pada 00:00 dan terus berjalan sehingga anda menekan Tamat atau Seterusnya.","Starts from a set duration and counts down to 00:00.":"Bermula dari tempoh yang ditetapkan dan mengira turun ke 00:00.","Stop at 00:00 and wait for the facilitator.":"Berhenti pada 00:00 dan menunggu fasilitator.","After 00:00, continue counting as overtime (+00:01, +00:02, and so on).":"Selepas 00:00, terus mengira sebagai masa tambahan (+00:01, +00:02 dan seterusnya).","When time ends, automatically move to the next section.":"Apabila masa tamat, teruskan secara automatik ke bahagian seterusnya.","Loop Limit":"Had Gelung","No time limit (∞)":"Tanpa had masa (∞)","The loop continues until the facilitator finishes the session.":"Gelung berterusan sehingga fasilitator menamatkan sesi.","The loop stops when the main duration ends.":"Gelung berhenti apabila tempoh utama tamat.","Interval":"Selang","Number of Rounds":"Bilangan Pusingan","Same duration":"Tempoh sama","Custom duration":"Tempoh tersuai","Transition":"Peralihan","ADD CUE":"TAMBAH CUE","When should this cue run?":"Bilakah cue ini perlu dijalankan?","A timed cue runs automatically at a selected time. A prepared CUE runs only when you press CUE during the live session.":"Cue bermasa berjalan secara automatik pada masa yang dipilih. CUE manual hanya berjalan apabila anda menekan CUE semasa sesi Live.","Section":"Bahagian","When?":"Bila?","Automatic — at remaining time":"Automatik — pada baki masa","Automatic — after elapsed time":"Automatik — selepas masa berlalu","CUE — when I press CUE":"CUE — apabila saya menekan CUE","Time":"Masa","Action":"Tindakan","Show message":"Paparkan mesej","Play sound":"Mainkan bunyi","Show timer":"Paparkan pemasa","Hide timer":"Sembunyikan pemasa","Name / Message":"Nama / Mesej","No cues yet.":"Belum ada cue.","The session can run without cues. Add one if you need a reminder, message, sound, or display change.":"Sesi boleh berjalan tanpa cue. Tambah cue jika anda perlukan peringatan, mesej, bunyi atau perubahan paparan.","RUN OVERVIEW":"RINGKASAN ALIRAN","BEFORE YOU START":"SEBELUM MULA","Untitled Session":"Sesi Tanpa Tajuk","Open-ended session":"Sesi tanpa had masa","Planned session duration":"Tempoh sesi dirancang","Sections":"Bahagian","Cues":"Cue","READY CHECK":"SEMAKAN KESEDIAAN","Display":"Paparan","Main timer on":"Pemasa utama aktif","Main timer hidden":"Pemasa utama tersembunyi","Enabled":"Aktif","Muted":"Dibisukan","Accessibility":"Kebolehcapaian","Maximum Legibility on":"Kebolehbacaan Maksimum aktif","Standard presentation mode":"Mod persembahan standard","Screen Awake":"Skrin Kekal Aktif","Supported":"Disokong","Browser dependent":"Bergantung pada pelayar","SESSION MAP":"PETA SESI","SESSION BEHAVIOR":"TINGKAH LAKU SESI","Start":"Mula","Curtain":"Curtain","Manual Cues":"Cue Manual","EDIT SESSION":"EDIT SESI","READY →":"SEDIA →","HELP":"BANTUAN","LIVE CONTROL":"KAWALAN LIVE","MESSAGE":"MESEJ","CUE":"CUE","DISPLAY":"PAPARAN","STATUS":"STATUS","SESSION STATUS":"STATUS SESI","OTHER CONTROLS":"KAWALAN LAIN","LAP":"LAP","Record lap":"Catat lap","Message (M)":"Mesej (M)","Display controls":"Kawalan paparan","Session status":"Status sesi","Previous":"Sebelumnya","Next":"Seterusnya","Pause":"Jeda","Resume":"Sambung","RESUME":"SAMBUNG","STOP":"HENTI","TIME'S UP":"MASA TAMAT","2 seconds":"2 saat","5 seconds":"5 saat","10 seconds":"10 saat","Custom":"Tersuai","Until dismissed":"Sehingga ditutup","Seconds":"Saat","Message":"Mesej","SHOW":"PAPARKAN","No prepared cues.":"Tiada cue yang disediakan.","USED":"TELAH DIGUNAKAN","Repeat Current":"Ulang Semasa","Hide Main Timer":"Sembunyikan Pemasa Utama","Show Main Timer":"Paparkan Pemasa Utama","End After Current":"Tamat Selepas Semasa","Restart Current":"Mula Semula Semasa","Finish Session":"Tamatkan Sesi","Save as Preset":"Simpan sebagai Pratetap","Elapsed":"Berlalu","Remaining":"Baki","Current":"Semasa","Position":"Kedudukan","TIME ADJUSTMENT":"PELARASAN MASA","ROUND ADJUSTMENT":"PELARASAN PUSINGAN","Add or subtract":"Tambah atau tolak","Round controls are only available in Rounds mode.":"Kawalan pusingan hanya tersedia dalam mod Pusingan.","Total rounds cannot be lower than the current round.":"Jumlah pusingan tidak boleh kurang daripada pusingan semasa.","Main Timer hidden":"Pemasa Utama disembunyikan","Main Timer shown":"Pemasa Utama dipaparkan","Finish session?":"Tamatkan sesi?","The timer will stop and the session results will be saved on the summary page.":"Pemasa akan berhenti dan hasil sesi disimpan pada halaman ringkasan.","CANCEL":"BATAL","FINISH":"TAMAT","Cue triggered":"Cue dicetuskan","Current section repeated":"Bahagian semasa diulang","SESSION COMPLETE":"SESI SELESAI","Elapsed Time":"Masa Berlalu","Remaining Time":"Baki Masa","Final Round":"Pusingan Akhir","Final Section":"Bahagian Akhir","REPLAY":"MAIN SEMULA","EDIT & REPLAY":"EDIT & MAIN SEMULA","SAVE AS PRESET":"SIMPAN SEBAGAI PRATETAP","HOME":"LAMAN UTAMA","LOCAL SESSION LOG":"LOG SESI TEMPATAN","A lightweight record of completed sessions on this browser. No cloud account is required.":"Rekod ringkas sesi yang selesai pada pelayar ini. Tiada akaun awan diperlukan.","CLEAR HISTORY":"PADAM SEJARAH","Actual":"Sebenar","Planned":"Dirancang","Laps":"Lap","Rounds Completed":"Pusingan Selesai","Adjustments / Cues":"Pelarasan / Cue","No live interventions were recorded.":"Tiada intervensi Live direkodkan.","No completed sessions yet.":"Belum ada sesi selesai.","Finished sessions will appear here automatically.":"Sesi yang selesai akan muncul di sini secara automatik.","REUSABLE SESSION DESIGNS":"REKA BENTUK SESI BOLEH GUNA SEMULA","Save, favorite, duplicate, import, export, and reuse session configurations.":"Simpan, kegemaran, duplikasi, import, eksport dan guna semula konfigurasi sesi.","Search presets…":"Cari pratetap…","All categories":"Semua kategori","IMPORT JSON":"IMPORT JSON","+ SAVE CURRENT":"+ SIMPAN SEMASA","All":"Semua","★ Favorites":"★ Kegemaran","My Presets":"Pratetap Saya","Built-in":"Terbina dalam","BUILT-IN":"TERBINA DALAM","MY PRESET":"PRATETAP SAYA","Favorite":"Kegemaran","DUPLICATE":"DUPLIKASI","RENAME":"NAMAKAN SEMULA","EXPORT":"EKSPORT","DELETE":"PADAM","No matching presets.":"Tiada pratetap sepadan.","Try another search or category.":"Cuba carian atau kategori lain.","Rename Preset":"Namakan Semula Pratetap","Name":"Nama","Category":"Kategori","SAVE":"SIMPAN","Delete preset?":"Padam pratetap?","This preset will be removed from this browser.":"Pratetap ini akan dipadam daripada pelayar ini.","Preset imported":"Pratetap berjaya diimport","Could not import this preset file.":"Fail pratetap ini tidak dapat diimport.","Preset Name":"Nama Pratetap","Preset saved":"Pratetap disimpan","SESSION FOUND":"SESI DIJUMPAI","Your previous session did not finish":"Sesi sebelumnya belum selesai","RESUME SESSION":"SAMBUNG SESI","RESTART SESSION":"MULA SEMULA SESI","DISCARD":"BUANG","APP SETTINGS":"TETAPAN APLIKASI","App Theme":"Tema Aplikasi","Follow device":"Ikut peranti","The app theme changes Home, Builder, and setup panels. Participant display themes remain session-specific.":"Tema aplikasi mengubah Laman Utama, Builder dan panel tetapan. Tema paparan peserta kekal khusus untuk setiap sesi.","LIVE QUICK CONTROLS":"KAWALAN PANTAS LIVE","Choose 4–6 actions for the left side of the Live control bar. Previous / Pause / Next, More, and Help remain available separately.":"Pilih 4–6 tindakan untuk sebelah kiri bar kawalan Live. Sebelumnya / Jeda / Seterusnya, Lagi dan Bantuan kekal tersedia berasingan.","SAVE LIVE CONTROLS":"SIMPAN KAWALAN LIVE","Offline":"Luar talian","The PWA can keep critical timing functions running after it has loaded.":"PWA boleh mengekalkan fungsi pemasaan penting selepas dimuatkan.","Local Storage":"Storan Tempatan","Drafts, presets, history, and recovery data are stored in this browser/device.":"Draf, pratetap, sejarah dan data pemulihan disimpan dalam pelayar/peranti ini.","RESET DRAFT SESSION":"SET SEMULA DRAF SESI","Reset draft?":"Set semula draf?","The saved draft will be replaced with a new session.":"Draf yang disimpan akan digantikan dengan sesi baharu.","Draft reset":"Draf ditetapkan semula","Choose up to 6 Live controls.":"Pilih sehingga 6 kawalan Live.","Choose at least 4 Live controls.":"Pilih sekurang-kurangnya 4 kawalan Live.","Live controls updated":"Kawalan Live dikemas kini","Fullscreen is not available in this browser.":"Skrin penuh tidak tersedia dalam pelayar ini.","Enter a time greater than 00:00.":"Masukkan masa lebih daripada 00:00.","Close panel":"Tutup panel","Use the arrows or mouse wheel":"Gunakan anak panah atau roda tetikus","Fastest Start":"Mula Terpantas","Create Session":"Cipta Sesi","Preset Library":"Pustaka Pratetap","FEATURES — WHAT ELSE CAN GAME TIMER DO?":"CIRI — APA LAGI YANG BOLEH DILAKUKAN GAME TIMER?","Session Status":"Status Sesi","Live Display Control":"Kawalan Paparan Live","Run Overview":"Ringkasan Aliran","Session History":"Sejarah Sesi","Recovery":"Pemulihan","Display Options":"Pilihan Paparan","Q&A — COMMON QUESTIONS →":"SOAL JAWAB — SOALAN LAZIM →","Q&A — GAME TIMER":"SOAL JAWAB — GAME TIMER","COMMON QUESTIONS":"SOALAN LAZIM","Quick answers to the questions facilitators are most likely to ask while setting up or running a session.":"Jawapan ringkas untuk soalan yang paling mungkin ditanya oleh fasilitator semasa menyediakan atau menjalankan sesi.","GETTING STARTED":"MULA","DISPLAY & SOUND":"PAPARAN & BUNYI","PRESETS & RECOVERY":"PRATETAP & PEMULIHAN","Which mode should I choose?":"Mod mana patut saya pilih?","Use Quick Timer for one timer. Use Simple for one structured section, Loop for one repeating interval, Alternating for two timed states that switch back and forth, Rounds for repeated attempts, Sequence for multiple phases, and Timeline for a main timer with timed cues.":"Gunakan Pemasa Pantas untuk satu pemasa. Gunakan Ringkas untuk satu bahagian berstruktur, Gelung untuk selang berulang, Pusingan untuk percubaan berulang, Urutan untuk beberapa fasa, dan Garis Masa untuk pemasa utama dengan cue bermasa.","Use Simple for one timer, Loop for repeating intervals, Rounds for repeated attempts, Sequence for multiple phases, and Timeline for a main timer with timed cues.":"Gunakan Ringkas untuk satu pemasa, Gelung untuk selang berulang, Pusingan untuk percubaan berulang, Urutan untuk beberapa fasa dan Garis Masa untuk pemasa utama dengan cue bermasa.","What is the difference between Quick Timer and Create Session?":"Apakah beza Quick Timer dan Create Session?","Quick Timer is the fastest route to Countdown, Count Up, or Stopwatch. Create Session gives you blocks, rounds, loops, cues, participant display settings, Curtain, and reusable presets.":"Quick Timer ialah laluan terpantas untuk Countdown, Count Up atau Stopwatch. Create Session menyediakan blok, pusingan, gelung, cue, tetapan paparan peserta, Curtain dan pratetap boleh guna semula.","Can I run a Loop without an overall time limit?":"Bolehkah Gelung berjalan tanpa had masa keseluruhan?","Yes. Edit the Loop and set Loop Limit to No time limit (∞). The interval keeps repeating until you finish the session.":"Ya. Edit Gelung dan tetapkan Had Gelung kepada Tanpa had masa (∞). Selang terus berulang sehingga anda menamatkan sesi.","What is the difference between Main Timer and Current Timer?":"Apakah beza Pemasa Utama dan Pemasa Semasa?","Main Timer represents the overall session. Current Timer represents the active section, round, interval, or transition. You can show either, both, or neither.":"Pemasa Utama mewakili keseluruhan sesi. Pemasa Semasa mewakili bahagian, pusingan, selang atau peralihan aktif. Anda boleh memaparkan salah satu, kedua-duanya atau tiada.","What is Curtain?":"Apakah Curtain?","Curtain is a temporary participant display mode. In Settings → Curtain, choose one item to show enlarged: Current Timer, Main Timer, or Round/Phase. Press C during Live to switch into Curtain and press C again to return.":"Curtain ialah mod paparan peserta sementara. Dalam Tetapan → Curtain, pilih satu item untuk dibesarkan: Pemasa Semasa, Pemasa Utama atau Pusingan/Fasa. Tekan C semasa Live untuk masuk Curtain dan tekan C lagi untuk kembali.","What is a CUE?":"Apakah CUE?","A cue is a prepared reminder or action. Timed cues run automatically. Manual cues wait until you press CUE during Live.":"Cue ialah peringatan atau tindakan yang telah disediakan. Cue bermasa berjalan secara automatik. Cue manual menunggu sehingga anda menekan CUE semasa Live.","Can I change time while the timer is running?":"Bolehkah masa diubah semasa pemasa berjalan?","Yes. Open Session Status to use quick adjustments or enter an exact amount to add or subtract. The clock remains timestamp-based and continues accurately.":"Ya. Buka Status Sesi untuk pelarasan pantas atau masukkan jumlah tepat untuk ditambah atau ditolak. Jam kekal berasaskan cap masa dan berjalan tepat.","Can I add or remove rounds while Live?":"Bolehkah saya menambah atau mengurangkan pusingan semasa Live?","Yes, when the active block is Rounds. Session Status provides Round Adjustment controls and updates the total automatically.":"Ya, apabila blok aktif ialah Pusingan. Status Sesi menyediakan kawalan Pelarasan Pusingan dan mengemas kini jumlah secara automatik.","What does LAP do?":"Apakah fungsi LAP?","Lap records the current elapsed time without stopping the timer. It is useful when participants or teams finish at different moments. Laps are included in the session summary.":"Lap merekod masa berlalu semasa tanpa menghentikan pemasa. Berguna apabila peserta atau pasukan selesai pada masa berbeza. Lap dimasukkan dalam ringkasan sesi.","How do I show a Main Timer that started hidden?":"Bagaimanakah memaparkan Pemasa Utama yang bermula tersembunyi?","Open Other Controls and choose Show Main Timer. The same button becomes Hide Main Timer when it is visible. This is a live override and does not require returning to setup.":"Buka Kawalan Lain dan pilih Paparkan Pemasa Utama. Butang yang sama menjadi Sembunyikan Pemasa Utama apabila kelihatan. Ini ialah override Live dan tidak perlu kembali ke tetapan.","What happens when I press Pause?":"Apakah berlaku apabila saya menekan Jeda?","The timer freezes. You can Resume or Stop. Stop always asks for confirmation before saving the result to the summary.":"Pemasa berhenti sementara. Anda boleh Sambung atau Henti. Henti sentiasa meminta pengesahan sebelum menyimpan hasil ke ringkasan.","Can I change the theme during Live?":"Bolehkah tema diubah semasa Live?","Yes. Open DISPLAY and change Theme, Font, Timer Size, Display Scale, Title & Phase Size, or Timer Spacing while the session keeps running.":"Ya. Buka PAPARAN dan ubah Tema, Fon, Saiz Pemasa, Skala Paparan, Saiz Tajuk & Fasa atau Jarak Pemasa semasa sesi terus berjalan.","Why does fullscreen not start automatically?":"Mengapa skrin penuh tidak bermula secara automatik?","Browsers require fullscreen to be triggered by a user action. Press the Fullscreen button or F.":"Pelayar memerlukan skrin penuh dicetuskan oleh tindakan pengguna. Tekan butang Skrin Penuh atau F.","Can I use the app without internet?":"Bolehkah aplikasi digunakan tanpa internet?","The PWA is designed to keep critical timing features local after it has been loaded and cached. For the best offline behavior, run it from HTTPS or localhost.":"PWA direka untuk mengekalkan ciri pemasaan penting secara tempatan selepas dimuat dan dicache. Untuk penggunaan luar talian terbaik, jalankan melalui HTTPS atau localhost.","What is Maximum Legibility?":"Apakah Kebolehbacaan Maksimum?","It strengthens type weight, spacing, and progress visibility for weak projectors, bright rooms, or long viewing distances.":"Ia menguatkan ketebalan teks, jarak dan keterlihatan kemajuan untuk projektor lemah, bilik terang atau jarak jauh.","Can I preview a 4:3 projector?":"Bolehkah saya pratonton projektor 4:3?","Yes. In Settings → Accessibility & Projector, change Preview Aspect Ratio to 4:3.":"Ya. Dalam Tetapan → Kebolehcapaian & Projektor, ubah Nisbah Pratonton kepada 4:3.","What is a Preset?":"Apakah Pratetap?","A Preset is a reusable session configuration. It stores the structure and settings, not the current runtime position.":"Pratetap ialah konfigurasi sesi boleh guna semula. Ia menyimpan struktur dan tetapan, bukan kedudukan runtime semasa.","Can I save a Preset while Live?":"Bolehkah Pratetap disimpan semasa Live?","Yes. Open Other Controls → Save as Preset. You will be asked to name and categorize it before it is saved.":"Ya. Buka Kawalan Lain → Simpan sebagai Pratetap. Anda akan diminta menamakan dan mengkategorikannya sebelum disimpan.","Can I move presets to another device?":"Bolehkah pratetap dipindahkan ke peranti lain?","Yes. Open Preset Library and Export a preset as JSON, then Import that file on another device.":"Ya. Buka Pustaka Pratetap dan Eksport pratetap sebagai JSON, kemudian Import fail itu pada peranti lain.","What is Session History?":"Apakah Sejarah Sesi?","A local log of completed sessions including actual duration, laps, cues, round changes, and time adjustments.":"Log tempatan sesi selesai termasuk tempoh sebenar, lap, cue, perubahan pusingan dan pelarasan masa.","What happens if I refresh or the browser closes unexpectedly?":"Apa berlaku jika saya refresh atau pelayar tertutup secara tiba-tiba?","Game Timer stores important runtime state locally. When you return, the Recovery screen can resume, restart, or discard the unfinished session.":"Game Timer menyimpan status runtime penting secara tempatan. Apabila kembali, skrin Pemulihan boleh menyambung, memulakan semula atau membuang sesi yang belum selesai.","Use ":"Gunakan "," when you only need a Countdown, Count Up, or Stopwatch and want to start immediately.":" apabila anda hanya perlukan Countdown, Count Up atau Stopwatch dan mahu mula segera.","Use a structured session when you need Loops, Rounds, Sequences, Timelines, cues, display rules, or multiple sections.":"Gunakan sesi berstruktur apabila anda perlukan Gelung, Pusingan, Urutan, Garis Masa, cue, peraturan paparan atau beberapa bahagian.","Browse built-in and saved presets, mark favorites, duplicate, categorize, import, and export reusable session setups.":"Lihat pratetap terbina dan disimpan, tandakan kegemaran, duplikasi, kategori, import dan eksport tetapan sesi boleh guna semula.","Prepare automatic or manual reminders, rule changes, sounds, and display changes.":"Sediakan peringatan automatik atau manual, perubahan peraturan, bunyi dan perubahan paparan.","Temporarily replace the participant display with one selected item, such as Current Timer or Round, while time keeps running.":"Gantikan sementara paparan peserta dengan satu item pilihan, seperti Pemasa Semasa atau Pusingan, sementara masa terus berjalan.","See what has happened, what is happening now, and what remains. Adjust time or rounds without leaving Live.":"Lihat apa yang telah berlaku, sedang berlaku dan masih berbaki. Laraskan masa atau pusingan tanpa meninggalkan Live.","Record a timestamp for a participant or team finishing early without stopping the timer.":"Catat masa peserta atau pasukan yang selesai lebih awal tanpa menghentikan pemasa.","Change theme, visibility, typography, and display sizes while the session is running.":"Ubah tema, keterlihatan, tipografi dan saiz paparan semasa sesi berjalan.","Review the complete session map and readiness checks before entering Ready.":"Semak peta sesi lengkap dan pemeriksaan kesediaan sebelum masuk ke Ready.","Keep a lightweight local record of completed sessions, laps, cues, and live adjustments.":"Simpan rekod tempatan ringkas sesi selesai, lap, cue dan pelarasan Live.","If the page reloads unexpectedly, Game Timer can restore an unfinished session from local storage.":"Jika halaman dimuat semula secara tidak dijangka, Game Timer boleh memulihkan sesi yang belum selesai daripada storan tempatan.","Counts down from a time limit to 00:00.":"Mengira turun dari had masa ke 00:00.","Starts at 00:00 and records elapsed time until you finish.":"Bermula pada 00:00 dan merekod masa berlalu sehingga anda selesai.","Open-ended timing with Lap available during Live.":"Pemasaan tanpa had dengan Lap tersedia semasa Live.","Preview timer size, title size, theme, font, and sound before starting.":"Pratonton saiz pemasa, saiz tajuk, tema, fon dan bunyi sebelum mula.","Set identity, start behavior, participant display, sizes, typography, theme, sound, and Curtain behavior.":"Tetapkan identiti, cara mula, paparan peserta, saiz, tipografi, tema, bunyi dan tingkah laku Curtain.","Defines how the activity runs. Simple = one countdown/count-up; Loop = a repeating interval; Rounds = multiple rounds; Sequence = several sections in order.":"Menentukan cara aktiviti berjalan. Ringkas = satu countdown/count-up; Gelung = selang berulang; Pusingan = beberapa pusingan; Urutan = beberapa bahagian mengikut turutan.","A cue is a reminder or action during the session. Timed cues run automatically. Prepared cues run when you press CUE.":"Cue ialah peringatan atau tindakan semasa sesi. Cue bermasa berjalan secara automatik. Cue yang disediakan berjalan apabila anda menekan CUE.","OPEN-ENDED LOOP":"GELUNG TANPA HAD","Choose Loop → Edit → Loop Limit → No time limit (∞). The loop runs until you finish the session.":"Pilih Gelung → Edit → Had Gelung → Tanpa had masa (∞). Gelung berjalan sehingga anda menamatkan sesi.","CURTAIN":"CURTAIN","In Settings → Curtain, choose what participants should see while Curtain is active: Current Timer, Main Timer, or Round/Phase. Press C to toggle Curtain during Live.":"Dalam Tetapan → Curtain, pilih apa yang peserta lihat semasa Curtain aktif: Pemasa Semasa, Pemasa Utama atau Pusingan/Fasa. Tekan C untuk togol Curtain semasa Live.","LIVE PREVIEW vs FULL PREVIEW":"PRATONTON LIVE vs PRATONTON PENUH","The Live Preview inside Settings updates immediately. Full Preview opens the participant display at full size.":"Live Preview dalam Tetapan dikemas kini serta-merta. Full Preview membuka paparan peserta pada saiz penuh.","One timer for one activity. Use Countdown for a time limit or Count Up for open-ended e
