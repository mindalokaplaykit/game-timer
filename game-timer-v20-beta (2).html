up to 6 Live controls.":"Elige hasta 6 controles en vivo.","Choose at least 4 Live controls.":"Elige al menos 4 controles en vivo.","Live controls updated":"Controles en vivo actualizados","Fullscreen is not available in this browser.":"La pantalla completa no está disponible en este navegador.","Enter a time greater than 00:00.":"Introduce un tiempo mayor que 00:00.","Close panel":"Cerrar panel","Use the arrows or mouse wheel":"Usa las flechas o la rueda del ratón","Fastest Start":"Inicio más rápido","Create Session":"Crear sesión","Preset Library":"Biblioteca de preajustes","FEATURES — WHAT ELSE CAN GAME TIMER DO?":"FUNCIONES — ¿QUÉ MÁS PUEDE HACER GAME TIMER?","Session Status":"Estado de la sesión","Live Display Control":"Control de pantalla en vivo","Run Overview":"Resumen de ejecución","Session History":"Historial de sesiones","Recovery":"Recuperación","Display Options":"Opciones de pantalla","Q&A — COMMON QUESTIONS →":"PREGUNTAS — DUDAS FRECUENTES →","Q&A — GAME TIMER":"PREGUNTAS — GAME TIMER","COMMON QUESTIONS":"PREGUNTAS FRECUENTES","Quick answers to the questions facilitators are most likely to ask while setting up or running a session.":"Respuestas rápidas a las preguntas más habituales al configurar o ejecutar una sesión.","GETTING STARTED":"PRIMEROS PASOS","DISPLAY & SOUND":"PANTALLA Y SONIDO","PRESETS & RECOVERY":"PREAJUSTES Y RECUPERACIÓN","Which mode should I choose?":"¿Qué modo debo elegir?","Use Quick Timer for one timer. Use Simple for one structured section, Loop for one repeating interval, Alternating for two timed states that switch back and forth, Rounds for repeated attempts, Sequence for multiple phases, and Timeline for a main timer with timed cues.":"Usa Temporizador rápido para un solo temporizador. Usa Simple para una sección estructurada, Bucle para intervalos repetidos, Rondas para intentos repetidos, Secuencia para varias fases y Línea de tiempo para un temporizador principal con cues programados.","Use Simple for one timer, Loop for repeating intervals, Rounds for repeated attempts, Sequence for multiple phases, and Timeline for a main timer with timed cues.":"Usa Simple para un temporizador, Bucle para intervalos repetitivos, Rondas para intentos, Secuencia para varias fases y Línea de tiempo para un temporizador principal con cues programados.","What is the difference between Quick Timer and Create Session?":"¿Cuál es la diferencia entre Quick Timer y Create Session?","Quick Timer is the fastest route to Countdown, Count Up, or Stopwatch. Create Session gives you blocks, rounds, loops, cues, participant display settings, Curtain, and reusable presets.":"Quick Timer es la vía más rápida para Cuenta regresiva, Cuenta ascendente o Cronómetro. Create Session añade bloques, rondas, bucles, cues, ajustes de pantalla, Curtain y preajustes reutilizables.","Can I run a Loop without an overall time limit?":"¿Puedo ejecutar un Bucle sin límite total?","Yes. Edit the Loop and set Loop Limit to No time limit (∞). The interval keeps repeating until you finish the session.":"Sí. Edita el Bucle y establece el límite en Sin límite de tiempo (∞). El intervalo se repite hasta finalizar la sesión.","What is the difference between Main Timer and Current Timer?":"¿Cuál es la diferencia entre el temporizador principal y el actual?","Main Timer represents the overall session. Current Timer represents the active section, round, interval, or transition. You can show either, both, or neither.":"El temporizador principal representa toda la sesión. El actual representa la sección, ronda, intervalo o transición activa. Puedes mostrar uno, ambos o ninguno.","What is Curtain?":"¿Qué es Curtain?","Curtain is a temporary participant display mode. In Settings → Curtain, choose one item to show enlarged: Current Timer, Main Timer, or Round/Phase. Press C during Live to switch into Curtain and press C again to return.":"Curtain es un modo temporal de pantalla. En Ajustes → Curtain, elige un elemento ampliado: temporizador actual, principal o ronda/fase. Pulsa C en vivo para entrar y C de nuevo para volver.","What is a CUE?":"¿Qué es un CUE?","A cue is a prepared reminder or action. Timed cues run automatically. Manual cues wait until you press CUE during Live.":"Un cue es un recordatorio o acción preparada. Los cues programados se ejecutan automáticamente; los manuales esperan hasta que pulses CUE en vivo.","Can I change time while the timer is running?":"¿Puedo cambiar el tiempo mientras el temporizador funciona?","Yes. Open Session Status to use quick adjustments or enter an exact amount to add or subtract. The clock remains timestamp-based and continues accurately.":"Sí. Abre Estado de la sesión para usar ajustes rápidos o introducir una cantidad exacta. El reloj sigue basado en marcas de tiempo y mantiene la precisión.","Can I add or remove rounds while Live?":"¿Puedo añadir o quitar rondas en vivo?","Yes, when the active block is Rounds. Session Status provides Round Adjustment controls and updates the total automatically.":"Sí, cuando el bloque activo es Rondas. Estado de la sesión ofrece ajustes de rondas y actualiza el total automáticamente.","What does LAP do?":"¿Qué hace VUELTA?","Lap records the current elapsed time without stopping the timer. It is useful when participants or teams finish at different moments. Laps are included in the session summary.":"La vuelta registra el tiempo transcurrido sin detener el temporizador. Es útil cuando participantes o equipos terminan en momentos distintos. Se incluye en el resumen.","How do I show a Main Timer that started hidden?":"¿Cómo muestro un temporizador principal que empezó oculto?","Open Other Controls and choose Show Main Timer. The same button becomes Hide Main Timer when it is visible. This is a live override and does not require returning to setup.":"Abre Otros controles y elige Mostrar temporizador principal. El mismo botón cambia a Ocultar cuando está visible. No necesitas volver a la configuración.","What happens when I press Pause?":"¿Qué ocurre al pulsar Pausa?","The timer freezes. You can Resume or Stop. Stop always asks for confirmation before saving the result to the summary.":"El temporizador se congela. Puedes Reanudar o Detener. Detener siempre pide confirmación antes de guardar el resultado.","Can I change the theme during Live?":"¿Puedo cambiar el tema en vivo?","Yes. Open DISPLAY and change Theme, Font, Timer Size, Display Scale, Title & Phase Size, or Timer Spacing while the session keeps running.":"Sí. Abre PANTALLA y cambia Tema, Fuente, Tamaño del temporizador, Escala, Tamaño de título y fase o Espaciado mientras la sesión sigue funcionando.","Why does fullscreen not start automatically?":"¿Por qué la pantalla completa no se inicia automáticamente?","Browsers require fullscreen to be triggered by a user action. Press the Fullscreen button or F.":"Los navegadores requieren una acción del usuario para entrar en pantalla completa. Pulsa el botón o F.","Can I use the app without internet?":"¿Puedo usar la aplicación sin internet?","The PWA is designed to keep critical timing features local after it has been loaded and cached. For the best offline behavior, run it from HTTPS or localhost.":"La PWA mantiene localmente las funciones críticas después de cargarse y almacenarse en caché. Para un mejor uso sin conexión, ejecútala por HTTPS o localhost.","What is Maximum Legibility?":"¿Qué es Legibilidad máxima?","It strengthens type weight, spacing, and progress visibility for weak projectors, bright rooms, or long viewing distances.":"Refuerza el peso tipográfico, el espaciado y la visibilidad del progreso para proyectores débiles, salas luminosas o largas distancias.","Can I preview a 4:3 projector?":"¿Puedo previsualizar un proyector 4:3?","Yes. In Settings → Accessibility & Projector, change Preview Aspect Ratio to 4:3.":"Sí. En Ajustes → Accesibilidad y proyector, cambia la relación de aspecto a 4:3.","What is a Preset?":"¿Qué es un preajuste?","A Preset is a reusable session configuration. It stores the structure and settings, not the current runtime position.":"Un preajuste es una configuración reutilizable. Guarda la estructura y ajustes, no la posición actual de ejecución.","Can I save a Preset while Live?":"¿Puedo guardar un preajuste en vivo?","Yes. Open Other Controls → Save as Preset. You will be asked to name and categorize it before it is saved.":"Sí. Abre Otros controles → Guardar como preajuste. Se te pedirá un nombre y categoría antes de guardarlo.","Can I move presets to another device?":"¿Puedo mover preajustes a otro dispositivo?","Yes. Open Preset Library and Export a preset as JSON, then Import that file on another device.":"Sí. Abre la Biblioteca de preajustes, exporta como JSON e importa el archivo en el otro dispositivo.","What is Session History?":"¿Qué es el Historial de sesiones?","A local log of completed sessions including actual duration, laps, cues, round changes, and time adjustments.":"Un registro local de sesiones completadas con duración real, vueltas, cues, cambios de ronda y ajustes de tiempo.","What happens if I refresh or the browser closes unexpectedly?":"¿Qué ocurre si actualizo o el navegador se cierra inesperadamente?","Game Timer stores important runtime state locally. When you return, the Recovery screen can resume, restart, or discard the unfinished session.":"Game Timer guarda localmente el estado importante. Al volver, Recuperación permite reanudar, reiniciar o descartar la sesión incompleta.","Use ":"Usa "," when you only need a Countdown, Count Up, or Stopwatch and want to start immediately.":" cuando solo necesitas Cuenta regresiva, Cuenta ascendente o Cronómetro y quieres empezar de inmediato.","Use a structured session when you need Loops, Rounds, Sequences, Timelines, cues, display rules, or multiple sections.":"Usa una sesión estructurada cuando necesites bucles, rondas, secuencias, líneas de tiempo, cues, reglas de pantalla o varias secciones.","Browse built-in and saved presets, mark favorites, duplicate, categorize, import, and export reusable session setups.":"Explora preajustes integrados y guardados, marca favoritos, duplica, categoriza, importa y exporta configuraciones reutilizables.","Prepare automatic or manual reminders, rule changes, sounds, and display changes.":"Prepara recordatorios automáticos o manuales, cambios de reglas, sonidos y cambios de pantalla.","Temporarily replace the participant display with one selected item, such as Current Timer or Round, while time keeps running.":"Sustituye temporalmente la pantalla de participantes por un elemento, como el temporizador actual o la ronda, mientras el tiempo continúa.","See what has happened, what is happening now, and what remains. Adjust time or rounds without leaving Live.":"Consulta lo que ha ocurrido, lo que sucede ahora y lo que queda. Ajusta tiempo o rondas sin salir de la sesión en vivo.","Record a timestamp for a participant or team finishing early without stopping the timer.":"Registra el tiempo de un participante o equipo que termina antes sin detener el temporizador.","Change theme, visibility, typography, and display sizes while the session is running.":"Cambia tema, visibilidad, tipografía y tamaños mientras la sesión está en curso.","Review the complete session map and readiness checks before entering Ready.":"Revisa el mapa completo de la sesión y las comprobaciones antes de entrar en Listo.","Keep a lightweight local record of completed sessions, laps, cues, and live adjustments.":"Mantén un registro local ligero de sesiones completadas, vueltas, cues y ajustes en vivo.","If the page reloads unexpectedly, Game Timer can restore an unfinished session from local storage.":"Si la página se recarga inesperadamente, Game Timer puede restaurar una sesión sin terminar desde el almacenamiento local.","Counts down from a time limit to 00:00.":"Cuenta hacia atrás desde un límite hasta 00:00.","Starts at 00:00 and records elapsed time until you finish.":"Empieza en 00:00 y registra el tiempo transcurrido hasta que termines.","Open-ended timing with Lap available during Live.":"Cronometraje sin límite con Vueltas disponibles en vivo.","Preview timer size, title size, theme, font, and sound before starting.":"Previsualiza tamaño del temporizador, título, tema, fuente y sonido antes de empezar.","Set identity, start behavior, participant display, sizes, typography, theme, sound, and Curtain behavior.":"Configura identidad, inicio, pantalla de participantes, tamaños, tipografía, tema, sonido y Curtain.","Defines how the activity runs. Simple = one countdown/count-up; Loop = a repeating interval; Rounds = multiple rounds; Sequence = several sections in order.":"Define cómo funciona la actividad. Simple = un temporizador; Bucle = intervalo repetido; Rondas = varias rondas; Secuencia = varias secciones en orden.","A cue is a reminder or action during the session. Timed cues run automatically. Prepared cues run when you press CUE.":"Un cue es un recordatorio o acción durante la sesión. Los cues programados se ejecutan automáticamente. Los preparados se ejecutan al pulsar CUE.","OPEN-ENDED LOOP":"BUCLE SIN LÍMITE","Choose Loop → Edit → Loop Limit → No time limit (∞). The loop runs until you finish the session.":"Elige Bucle → Editar → Límite del bucle → Sin límite de tiempo (∞). El bucle continúa hasta finalizar la sesión.","CURTAIN":"CURTAIN","In Settings → Curtain, choose what participants should see while Curtain is active: Current Timer, Main Timer, or Round/Phase. Press C to toggle Curtain during Live.":"En Ajustes → Curtain, elige qué verán los participantes: temporizador actual, principal o ronda/fase. Pulsa C para alternar Curtain en vivo.","LIVE PREVIEW vs FULL PREVIEW":"VISTA PREVIA EN VIVO vs COMPLETA","The Live Preview inside Settings updates immediately. Full Preview opens the participant display at full size.":"La vista previa en Ajustes se actualiza al instante. La vista completa abre la pantalla de participantes a tamaño completo.","One timer for one activity. Use Countdown for a time limit or Count Up for open-ended elapsed time.":"Un temporizador para una actividad. Usa Cuenta regresiva para un límite o Cuenta ascendente para tiempo abierto.","A repeating interval, with or without an overall time limit.":"Un intervalo repetido, con o sin límite total.","Several timed rounds or attempts.":"Varias rondas o intentos cronometrados.","Several different phases in order.":"Varias fases diferentes en orden.","One main timer with cues/messages at selected moments.":"Un temporizador principal con cues/mensajes en momentos definidos.","Session Map":"Mapa de la sesión","Review the full run order before entering Ready.":"Revisa el orden completo antes de entrar en Listo.","Ready Check":"Comprobación previa","Confirm display, sound, accessibility, and screen-awake support.":"Confirma pantalla, sonido, accesibilidad y compatibilidad para mantener la pantalla activa.","Favorites":"Favoritos","Pin presets you use often.":"Fija los preajustes que utilizas a menudo.","Import / Export":"Importar / Exportar","Move presets between devices as JSON files without an account.":"Mueve preajustes entre dispositivos como archivos JSON sin cuenta.","Completed sessions are stored locally with actual duration, laps, cues, and adjustments.":"Las sesiones completadas se guardan localmente con duración real, vueltas, cues y ajustes.","Starts the session using the selected Immediate or 3–2–1–GO behavior.":"Inicia la sesión con el comportamiento Inmediato o 3–2–1–GO seleccionado.","Use fullscreen for a clean participant display. The browser requires a user click to enter fullscreen.":"Usa pantalla completa para una vista limpia. El navegador requiere un clic del usuario.","Return to the Builder without starting the timer.":"Vuelve al Builder sin iniciar el temporizador.","Quick Start":"Inicio rápido","Use Quick Timer for a simple timing need, or Create Session for structured facilitation.":"Usa Quick Timer para una necesidad simple o Create Session para facilitación estructurada.","Presets":"Preajustes","Saved configurations can be loaded and reused later.":"Las configuraciones guardadas pueden cargarse y reutilizarse más tarde.","Show a large message such as MOVE!, STOP!, or a rule change.":"Muestra un mensaje grande como ¡CAMBIA!, ¡ALTO! o un cambio de regla.","Run a cue that you prepared before the session. Timed cues run automatically.":"Ejecuta un cue preparado antes de la sesión. Los cues programados se ejecutan automáticamente.","Show or hide participant information and adjust the live display while the session is running.":"Muestra u oculta información y ajusta la pantalla en vivo durante la sesión.","Record the current time without stopping the timer. Works with Countdown, Count Up, Stopwatch, and Sessions.":"Registra el tiempo actual sin detener el temporizador. Funciona con Cuenta regresiva, Cuenta ascendente, Cronómetro y Sesiones.","See elapsed/remaining time, current section, rounds, laps, and make quick timing adjustments.":"Consulta tiempo transcurrido/restante, sección actual, rondas, vueltas y realiza ajustes rápidos.","Enter or exit fullscreen.":"Entrar o salir de pantalla completa.","Other Controls":"Otros controles","Repeat/restart the current section, show or hide the Main Timer, finish, or save the session as a preset.":"Repite/reinicia la sección actual, muestra u oculta el temporizador principal, finaliza o guarda la sesión como preajuste.","Curtain replaces the normal participant display with the single item selected in Settings → Curtain. It can enlarge the Current Timer, Main Timer, or Round/Phase. The timer keeps running. Press C or the Return icon to switch back.":"Curtain reemplaza la pantalla normal por el único elemento elegido en Ajustes → Curtain. Puede ampliar el temporizador actual, principal o ronda/fase. El tiempo sigue corriendo. Pulsa C o Volver para regresar.","Shortcuts":"Atajos","Space Pause/Resume · N Next · B Previous · M Message · C Curtain/Return · F Fullscreen.":"Espacio Pausa/Reanudar · N Siguiente · B Anterior · M Mensaje · C Curtain/Volver · F Pantalla completa.","Starts immediately with no 3–2–1.":"Empieza inmediatamente sin 3–2–1.","Show a countdown before the timer starts.":"Muestra una cuenta regresiva antes de empezar.","TIMER SIZE":"TAMAÑO DEL TEMPORIZADOR","TITLE SIZE":"TAMAÑO DEL TÍTULO","THEME":"TEMA","FONT":"FUENTE","SOUND":"SONIDO","Enable Start & Finish sounds":"Activar sonidos de inicio y final","▶ Test Start":"▶ Probar inicio","▶ Test Finish":"▶ Probar final","DONE":"LISTO","? Help":"? Ayuda","? HELP":"? AYUDA","Display Font":"Fuente de pantalla","FULL PREVIEW":"VISTA COMPLETA","RUN OVERVIEW →":"RESUMEN DE EJECUCIÓN →","10-minute challenge / open-ended elapsed time":"Desafío de 10 minutos / tiempo abierto","Move every 30 seconds":"Cambiar cada 30 segundos","5 rounds × 2 minutes":"5 rondas × 2 minutos","Plan 3m → Play 10m → Review 5m":"Plan 3m → Jugar 10m → Revisión 5m","At minute 5 change leader; at minute 10 change the rule":"Minuto 5: cambiar líder; minuto 10: cambiar la regla","Use":"Usa","Quick Timer":"Temporizador rápido","when you only need a Countdown, Count Up, or Stopwatch and want to start immediately.":"cuando solo necesitas Cuenta regresiva, Cuenta ascendente o Cronómetro y quieres empezar de inmediato.","RUNNING":"EN CURSO","PAUSED":"EN PAUSA","OVERTIME":"TIEMPO EXTRA","ELAPSED":"TRANSCURRIDO","CURRENT":"ACTUAL","POSITION":"POSICIÓN","TIMER":"TEMPORIZADOR","single section":"una sección","Time Adjustment":"Ajuste de tiempo","Round Adjustment":"Ajuste de rondas","APPLY":"APLICAR","Fullscreen":"Pantalla completa","Countdown":"Cuenta regresiva","Count Up":"Cuenta ascendente","Stopwatch":"Cronómetro","Sessions":"Sesiones","Session":"Sesión","Interface Language":"Idioma de la interfaz","Choose the language used by the interface, Help, Q&A, dialogs, validation messages, and built-in presets. Your own titles, messages, and preset names are never auto-translated.":"Elige el idioma de la interfaz, Ayuda, Preguntas, diálogos, validaciones y preajustes integrados. Tus títulos, mensajes y nombres de preajustes nunca se traducen automáticamente.","Data & Offline":"Datos y uso sin conexión","Drafts, presets, history, recovery data, and saved voice cues stay on this device. After the PWA has loaded, critical timing can keep working offline.":"Los borradores, presets, el historial y los datos de recuperación permanecen en este dispositivo. Después de cargar la PWA, las funciones críticas de temporización pueden seguir funcionando sin conexión."},"pt":{"Facilitation Display":"Tela de facilitação","Facilitate the Moment.":"Facilite o momento.","Help":"Ajuda","Settings":"Configurações","App settings":"Configurações do aplicativo","Back":"Voltar","Close":"Fechar","CLOSE ×":"FECHAR ×","Saved":"Salvo","QUICK TIMER":"TEMPORIZADOR RÁPIDO","CREATE SESSION":"CRIAR SESSÃO","PRESET LIBRARY":"BIBLIOTECA DE PREDEFINIÇÕES","SESSION HISTORY":"HISTÓRICO DE SESSÕES","Recent Presets":"Predefinições recentes","Run":"Executar","RUN":"EXECUTAR","General":"Geral","Language":"Idioma","ABOUT":"SOBRE","COUNTDOWN":"CONTAGEM REGRESSIVA","COUNT UP":"CONTAGEM PROGRESSIVA","STOPWATCH":"CRONÔMETRO","Title (optional)":"Título (opcional)","Group Discussion":"Discussão em grupo","DISPLAY OPTIONS":"OPÇÕES DE EXIBIÇÃO","START":"INICIAR","READY":"PRONTO","EDIT":"EDITAR","FULLSCREEN":"TELA CHEIA","QUICK TIMER OPTIONS":"OPÇÕES DO TEMPORIZADOR RÁPIDO","START BEHAVIOR":"INÍCIO","Immediate":"Imediato","The timer starts as soon as START is pressed. No 3–2–1.":"O temporizador começa assim que INICIAR é pressionado. Sem 3–2–1.","A short countdown appears before the timer starts.":"Uma contagem regressiva curta aparece antes do início.","When Time Ends":"Quando o tempo terminar","Wait":"Aguardar","Overtime":"Prorrogação","Continue":"Continuar","Stop":"Parar","Timer Size":"Tamanho do temporizador","Title & Phase Size":"Tamanho de título e fase","Display Scale":"Escala de exibição","Timer Spacing":"Espaçamento do temporizador","Theme":"Tema","Font":"Fonte","Sound":"Som","Enable cue sounds":"Ativar sons de cue","Test Start":"Testar início","Test Finish":"Testar término","Normal":"Normal","Large":"Grande","Maximum":"Máximo","PREVIEW":"PRÉ-VISUALIZAR","PREVIEW MESSAGE":"PRÉ-VISUALIZAR MENSAGEM","MESSAGE PREVIEW":"PRÉ-VISUALIZAÇÃO DA MENSAGEM","CHOOSE HOW TIME RUNS":"ESCOLHA COMO O TEMPO FUNCIONA","What does your activity look like?":"Como é a sua atividade?","Choose the closest pattern. You can still adjust everything afterwards.":"Escolha o padrão mais próximo. Você poderá ajustar tudo depois.","Simple":"Simples","One countdown or count-up timer.":"Um temporizador regressivo ou progressivo.","Loop":"Ciclo","A repeating interval, with an optional overall time limit.":"Um intervalo repetido, com limite total opcional.","Rounds":"Rondas","Multiple rounds or attempts.":"Várias rondas ou tentativas.","Sequence":"Sequência","Different timed phases that run in order.":"Fases temporizadas diferentes executadas em sequência.","Timeline":"Linha do tempo","One main timer with cues or messages at selected moments.":"Um temporizador principal com cues ou mensagens em momentos definidos.","Example:":"Exemplo:","Already working on a session?":"Já está trabalhando em uma sessão?","CONTINUE DRAFT":"CONTINUAR RASCUNHO","SETTINGS":"CONFIGURAÇÕES","TIME FLOW":"FLUXO DE TEMPO","CUES & MESSAGES":"CUES E MENSAGENS","Expand navigation":"Expandir navegação","Collapse navigation":"Recolher navegação","Set up the session and participant display":"Configure a sessão e a tela dos participantes","Open only the sections you need. Collapse the rest to keep the page focused.":"Abra apenas as seções necessárias. Recolha o restante para manter o foco.","1. Identity":"1. Identidade","Session Title":"Título da sessão","Subtitle (optional)":"Subtítulo (opcional)","Program / Client (optional)":"Programa / Cliente (opcional)","2. Start":"2. Início","3. Display":"3. Exibição","Title":"Título","Subtitle":"Subtítulo","Main Timer":"Temporizador principal","Current Timer":"Temporizador atual","Phase Name":"Nome da fase","Current Round":"Ronda atual","Total Rounds":"Total de rondas","Progress Bar":"Barra de progresso","Progress":"Progresso","Main Timer Visibility":"Visibilidade do temporizador principal","Always visible":"Sempre visível","Hidden":"Oculto","Reveal near the end":"Mostrar perto do fim","Reveal manually":"Mostrar manualmente","4. Size & Typography":"4. Tamanho e tipografia","Message Size":"Tamanho da mensagem","The Main Timer and other display elements can be scaled independently. 100% Main Timer means Full Fit.":"O temporizador principal e os demais elementos podem ser dimensionados separadamente. 100% significa ajuste total.","5. Theme":"5. Tema","Minimal":"Minimal","Dark":"Escuro","Light":"Claro","High Contrast":"Alto contraste","Energetic":"Energético","Soft":"Suave","6. Sound":"6. Som","7. Curtain":"7. Curtain","What should Curtain show?":"O que o Curtain deve mostrar?","Round / Phase":"Ronda / Fase","Curtain temporarily replaces the normal participant display with one selected item, enlarged to presentation size. Press C or the Curtain/Return icon to switch back.":"Curtain substitui temporariamente a tela dos participantes por um item selecionado ampliado. Pressione C ou o ícone Curtain/Voltar para retornar.","Curtain does not pause the timer.":"Curtain não pausa o temporizador.","8. Accessibility & Projector":"8. Acessibilidade e projetor","Maximum Legibility":"Legibilidade máxima","Heavier type, stronger spacing, and a thicker progress bar for difficult projectors.":"Tipografia mais forte, maior espaçamento e barra de progresso mais espessa para projetores difíceis.","Preview Aspect Ratio":"Proporção da pré-visualização","16:9 widescreen":"16:9 widescreen","4:3 projector":"4:3 projetor","Contrast passes":"Contraste aprovado","Contrast warning":"Aviso de contraste","Checks the weaker of body text and timer contrast against the selected theme background.":"Verifica o menor contraste entre texto e temporizador em relação ao fundo do tema.","LIVE PREVIEW":"PRÉ-VISUALIZAÇÃO AO VIVO","This preview updates immediately as you change the settings.":"Esta pré-visualização é atualizada imediatamente ao alterar as configurações.","Controls the title and phase/round label size.":"Controla o tamanho do título e do rótulo de fase/ronda.","Scales the title, phase, secondary timer, and progress without changing the Main Timer size.":"Dimensiona título, fase, temporizador secundário e progresso sem alterar o temporizador principal.","Increase slightly when the timer digits feel too tight.":"Aumente um pouco se os dígitos estiverem muito juntos.","TOTAL SESSION TIME":"TEMPO TOTAL DA SESSÃO","Contains an open-ended section":"Contém uma seção sem limite","Combined duration of all sections":"Duração combinada de todas as seções","ADD SECTION":"ADICIONAR SEÇÃO","Choose a timing pattern":"Escolha um padrão de tempo","Simple Timer":"Temporizador simples","One phase with one timer.":"Uma fase com um temporizador.","A repeating interval, including open-ended loops.":"Um intervalo repetido, incluindo ciclos sem limite.","A/B Loop":"Ciclo A/B","Two alternating intervals, such as Work/Rest.":"Dois intervalos alternados, como Trabalho/Descanso.","Edit":"Editar","Duplicate":"Duplicar","Move Up":"Mover para cima","Move Down":"Mover para baixo","Delete":"Excluir","A session must have at least one section.":"Uma sessão deve ter pelo menos uma seção.","EDIT TIMER":"EDITAR TEMPORIZADOR","Timer Type":"Tipo de temporizador","Duration":"Duração","Starts at 00:00 and keeps running until you press Finish or Next.":"Começa em 00:00 e continua até você pressionar Finalizar ou Próximo.","Starts from a set duration and counts down to 00:00.":"Começa a partir de uma duração definida e conta até 00:00.","Stop at 00:00 and wait for the facilitator.":"Para em 00:00 e aguarda o facilitador.","After 00:00, continue counting as overtime (+00:01, +00:02, and so on).":"Após 00:00, continua contando como prorrogação (+00:01, +00:02 e assim por diante).","When time ends, automatically move to the next section.":"Quando o tempo terminar, avança automaticamente para a próxima seção.","Loop Limit":"Limite do ciclo","No time limit (∞)":"Sem limite de tempo (∞)","The loop continues until the facilitator finishes the session.":"O ciclo continua até o facilitador finalizar a sessão.","The loop stops when the main duration ends.":"O ciclo para quando a duração principal termina.","Interval":"Intervalo","Number of Rounds":"Número de rondas","Same duration":"Mesma duração","Custom duration":"Duração personalizada","Transition":"Transição","ADD CUE":"ADICIONAR CUE","When should this cue run?":"Quando este cue deve ser executado?","A timed cue runs automatically at a selected time. A prepared CUE runs only when you press CUE during the live session.":"Um cue programado é executado automaticamente no horário escolhido. Um CUE manual só é executado ao pressionar CUE durante a sessão ao vivo.","Section":"Seção","When?":"Quando?","Automatic — at remaining time":"Automático — no tempo restante","Automatic — after elapsed time":"Automático — após o tempo decorrido","CUE — when I press CUE":"CUE — quando eu pressionar CUE","Time":"Tempo","Action":"Ação","Show message":"Mostrar mensagem","Play sound":"Reproduzir som","Show timer":"Mostrar temporizador","Hide timer":"Ocultar temporizador","Name / Message":"Nome / Mensagem","No cues yet.":"Ainda não há cues.","The session can run without cues. Add one if you need a reminder, message, sound, or display change.":"A sessão pode funcionar sem cues. Adicione um se precisar de lembrete, mensagem, som ou mudança de tela.","RUN OVERVIEW":"VISÃO GERAL DA EXECUÇÃO","BEFORE YOU START":"ANTES DE COMEÇAR","Untitled Session":"Sessão sem título","Open-ended session":"Sessão sem limite","Planned session duration":"Duração planejada da sessão","Sections":"Seções","Cues":"Cues","READY CHECK":"VERIFICAÇÃO DE PR ound.":"O total de rondas não pode ser menor que a ronda atual.","Main Timer hidden":"Temporizador principal oculto","Main Timer shown":"Temporizador principal exibido","Finish session?":"Finalizar a sessão?","The timer will stop and the session results will be saved on the summary page.":"O temporizador será interrompido e os resultados serão salvos na página de resumo.","CANCEL":"CANCELAR","FINISH":"FINALIZAR","Cue triggered":"Cue acionado","Current section repeated":"Seção atual repetida","SESSION COMPLETE":"SESSÃO CONCLUÍDA","Elapsed Time":"Tempo decorrido","Remaining Time":"Tempo restante","Final Round":"Ronda final","Final Section":"Seção final","REPLAY":"REPETIR","EDIT & REPLAY":"EDITAR E REPETIR","SAVE AS PRESET":"SALVAR COMO PREDEFINIÇÃO","HOME":"INÍCIO","LOCAL SESSION LOG":"REGISTRO LOCAL DE SESSÕES","A lightweight record of completed sessions on this browser. No cloud account is required.":"Um registro simples das sessões concluídas neste navegador. Não requer conta na nuvem.","CLEAR HISTORY":"LIMPAR HISTÓRICO","Actual":"Real","Planned":"Planejado","Laps":"Voltas","Rounds Completed":"Rondas concluídas","Adjustments / Cues":"Ajustes / Cues","No live interventions were recorded.":"Nenhuma intervenção ao vivo foi registrada.","No completed sessions yet.":"Ainda não há sessões concluídas.","Finished sessions will appear here automatically.":"As sessões finalizadas aparecerão aqui automaticamente.","REUSABLE SESSION DESIGNS":"DESIGNS DE SESSÃO REUTILIZÁVEIS","Save, favorite, duplicate, import, export, and reuse session configurations.":"Salve, favorite, duplique, importe, exporte e reutilize configurações.","Search presets…":"Pesquisar predefinições…","All categories":"Todas as categorias","IMPORT JSON":"IMPORTAR JSON","+ SAVE CURRENT":"+ SALVAR ATUAL","All":"Todos","★ Favorites":"★ Favoritos","My Presets":"Minhas predefinições","Built-in":"Integrados","BUILT-IN":"INTEGRADO","MY PRESET":"MINHA PREDEFINIÇÃO","Favorite":"Favorito","DUPLICATE":"DUPLICAR","RENAME":"RENOMEAR","EXPORT":"EXPORTAR","DELETE":"EXCLUIR","No matching presets.":"Nenhuma predefinição correspondente.","Try another search or category.":"Tente outra pesquisa ou categoria.","Rename Preset":"Renomear predefinição","Name":"Nome","Category":"Categoria","SAVE":"SALVAR","Delete preset?":"Excluir predefinição?","This preset will be removed from this browser.":"Esta predefinição será removida deste navegador.","Preset imported":"Predefinição importada","Could not import this preset file.":"Não foi possível importar este arquivo de predefinição.","Preset Name":"Nome da predefinição","Preset saved":"Predefinição salva","SESSION FOUND":"SESSÃO ENCONTRADA","Your previous session did not finish":"Sua sessão anterior não terminou","RESUME SESSION":"RETOMAR SESSÃO","RESTART SESSION":"REINICIAR SESSÃO","DISCARD":"DESCARTAR","APP SETTINGS":"CONFIGURAÇÕES DO APLICATIVO","App Theme":"Tema do aplicativo","Follow device":"Seguir dispositivo","The app theme changes Home, Builder, and setup panels. Participant display themes remain session-specific.":"O tema do aplicativo altera Início, Builder e painéis de configuração. O tema dos participantes permanece específico da sessão.","LIVE QUICK CONTROLS":"CONTROLES RÁPIDOS AO VIVO","Choose 4–6 actions for the left side of the Live control bar. Previous / Pause / Next, More, and Help remain available separately.":"Escolha 4–6 ações para o lado esquerdo da barra ao vivo. Anterior / Pausa / Próximo, Mais e Ajuda continuam disponíveis separadamente.","SAVE LIVE CONTROLS":"SALVAR CONTROLES AO VIVO","Offline":"Offline","The PWA can keep critical timing functions running after it has loaded.":"O PWA pode manter funções críticas de temporização após ser carregado.","Local Storage":"Armazenamento local","Drafts, presets, history, and recovery data are stored in this browser/device.":"Rascunhos, predefinições, histórico e dados de recuperação são armazenados neste navegador/dispositivo.","RESET DRAFT SESSION":"REDEFINIR RASCUNHO","Reset draft?":"Redefinir rascunho?","The saved draft will be replaced with a new session.":"O rascunho salvo será substituído por uma nova sessão.","Draft reset":"Rascunho redefinido","Choose up to 6 Live controls.":"Escolha até 6 controles ao vivo.","Choose at least 4 Live controls.":"Escolha pelo menos 4 controles ao vivo.","Live controls updated":"Controles ao vivo atualizados","Fullscreen is not available in this browser.":"Tela cheia não está disponível neste navegador.","Enter a time greater than 00:00.":"Insira um tempo maior que 00:00.","Close panel":"Fechar painel","Use the arrows or mouse wheel":"Use as setas ou a roda do mouse","Fastest Start":"Início mais rápido","Create Session":"Criar sessão","Preset Library":"Biblioteca de predefinições","FEATURES — WHAT ELSE CAN GAME TIMER DO?":"RECURSOS — O QUE MAIS O GAME TIMER PODE FAZER?","Session Status":"Status da sessão","Live Display Control":"Controle de exibição ao vivo","Run Overview":"Visão geral da execução","Session History":"Histórico de sessões","Recovery":"Recuperação","Display Options":"Opções de exibição","Q&A — COMMON QUESTIONS →":"PERGUNTAS — DÚVIDAS COMUNS →","Q&A — GAME TIMER":"PERGUNTAS — GAME TIMER","COMMON QUESTIONS":"PERGUNTAS COMUNS","Quick answers to the questions facilitators are most likely to ask while setting up or running a session.":"Respostas rápidas às perguntas mais comuns ao configurar ou executar uma sessão.","GETTING STARTED":"PRIMEIROS PASSOS","DISPLAY & SOUND":"EXIBIÇÃO E SOM","PRESETS & RECOVERY":"PREDEFINIÇÕES E RECUPERAÇÃO","Which mode should I choose?":"Qual modo devo escolher?","Use Quick Timer for one timer. Use Simple for one structured section, Loop for one repeating interval, Alternating for two timed states that switch back and forth, Rounds for repeated attempts, Sequence for multiple phases, and Timeline for a main timer with timed cues.":"Use Temporizador rápido para um único temporizador. Use Simples para uma seção estruturada, Ciclo para intervalos repetidos, Rondas para tentativas repetidas, Sequência para várias fases e Linha do tempo para um temporizador principal com cues programados.","Use Simple for one timer, Loop for repeating intervals, Rounds for repeated attempts, Sequence for multiple phases, and Timeline for a main timer with timed cues.":"Use Simples para um temporizador, Ciclo para intervalos repetidos, Rondas para tentativas, Sequência para várias fases e Linha do tempo para um temporizador principal com cues programados.","What is the difference between Quick Timer and Create Session?":"Qual é a diferença entre Quick Timer e Create Session?","Quick Timer is the fastest route to Countdown, Count Up, or Stopwatch. Create Session gives you blocks, rounds, loops, cues, participant display settings, Curtain, and reusable presets.":"Quick Timer é o caminho mais rápido para Contagem regressiva, Contagem progressiva ou Cronômetro. Create Session oferece blocos, rondas, ciclos, cues, configurações de tela, Curtain e predefinições reutilizáveis.","Can I run a Loop without an overall time limit?":"Posso executar um Ciclo sem limite total?","Yes. Edit the Loop and set Loop Limit to No time limit (∞). The interval keeps repeating until you finish the session.":"Sim. Edite o Ciclo e defina o limite como Sem limite de tempo (∞). O intervalo continua até você finalizar a sessão.","What is the difference between Main Timer and Current Timer?":"Qual é a diferença entre o temporizador principal e o atual?","Main Timer represents the overall session. Current Timer represents the active section, round, interval, or transition. You can show either, both, or neither.":"O temporizador principal representa toda a sessão. O atual representa a seção, ronda, intervalo ou transição ativa. Você pode mostrar um, ambos ou nenhum.","What is Curtain?":"O que é Curtain?","Curtain is a temporary participant display mode. In Settings → Curtain, choose one item to show enlarged: Current Timer, Main Timer, or Round/Phase. Press C during Live to switch into Curtain and press C again to return.":"Curtain é um modo temporário de tela. Em Configurações → Curtain, escolha um item ampliado: temporizador atual, principal ou ronda/fase. Pressione C ao vivo para entrar e C novamente para voltar.","What is a CUE?":"O que é um CUE?","A cue is a prepared reminder or action. Timed cues run automatically. Manual cues wait until you press CUE during Live.":"Um cue é um lembrete ou ação preparada. Cues programados são executados automaticamente; cues manuais aguardam até você pressionar CUE ao vivo.","Can I change time while the timer is running?":"Posso alterar o tempo enquanto o temporizador está rodando?","Yes. Open Session Status to use quick adjustments or enter an exact amount to add or subtract. The clock remains timestamp-based and continues accurately.":"Sim. Abra Status da sessão para ajustes rápidos ou insira um valor exato. O relógio continua baseado em timestamps e permanece preciso.","Can I add or remove rounds while Live?":"Posso adicionar ou remover rondas ao vivo?","Yes, when the active block is Rounds. Session Status provides Round Adjustment controls and updates the total automatically.":"Sim, quando o bloco ativo é Rondas. Status da sessão oferece ajuste de rondas e atualiza o total automaticamente.","What does LAP do?":"O que VOLTA faz?","Lap records the current elapsed time without stopping the timer. It is useful when participants or teams finish at different moments. Laps are included in the session summary.":"A volta registra o tempo decorrido sem parar o temporizador. É útil quando participantes ou equipes terminam em momentos diferentes. As voltas aparecem no resumo.","How do I show a Main Timer that started hidden?":"Como mostrar um temporizador principal que começou oculto?","Open Other Controls and choose Show Main Timer. The same button becomes Hide Main Timer when it is visible. This is a live override and does not require returning to setup.":"Abra Outros controles e escolha Mostrar temporizador principal. O mesmo botão vira Ocultar quando estiver visível. Não é necessário voltar à configuração.","What happens when I press Pause?":"O que acontece ao pressionar Pausa?","The timer freezes. You can Resume or Stop. Stop always asks for confirmation before saving the result to the summary.":"O temporizador congela. Você pode Retomar ou Parar. Parar sempre pede confirmação antes de salvar o resultado.","Can I change the theme during Live?":"Posso mudar o tema ao vivo?","Yes. Open DISPLAY and change Theme, Font, Timer Size, Display Scale, Title & Phase Size, or Timer Spacing while the session keeps running.":"Sim. Abra EXIBIÇÃO e altere Tema, Fonte, Tamanho do temporizador, Escala, Tamanho de título e fase ou Espaçamento enquanto a sessão continua.","Why does fullscreen not start automatically?":"Por que a tela cheia não inicia automaticamente?","Browsers require fullscreen to be triggered by a user action. Press the Fullscreen button or F.":"Os navegadores exigem uma ação do usuário para entrar em tela cheia. Pressione o botão ou F.","Can I use the app without internet?":"Posso usar o aplicativo sem internet?","The PWA is designed to keep critical timing features local after it has been loaded and cached. For the best offline behavior, run it from HTTPS or localhost.":"O PWA mantém localmente as funções críticas após ser carregado e armazenado em cache. Para melhor uso offline, execute via HTTPS ou localhost.","What is Maximum Legibility?":"O que é Legibilidade máxima?","It strengthens type weight, spacing, and progress visibility for weak projectors, bright rooms, or long viewing distances.":"Reforça peso tipográfico, espaçamento e visibilidade do progresso para projetores fracos, salas claras ou longas distâncias.","Can I preview a 4:3 projector?":"Posso pré-visualizar um projetor 4:3?","Yes. In Settings → Accessibility & Projector, change Preview Aspect Ratio to 4:3.":"Sim. Em Configurações → Acessibilidade e projetor, altere a proporção para 4:3.","What is a Preset?":"O que é uma predefinição?","A Preset is a reusable session configuration. It stores the structure and settings, not the current runtime position.":"Uma predefinição é uma configuração reutilizável. Ela guarda estrutura e configurações, não a posição atual da execução.","Can I save a Preset while Live?":"Posso salvar uma predefinição ao vivo?","Yes. Open Other Controls → Save as Preset. You will be asked to name and categorize it before it is saved.":"Sim. Abra Outros controles → Salvar como predefinição. Você informará nome e categoria antes de salvar.","Can I move presets to another device?":"Posso mover predefinições para outro dispositivo?","Yes. Open Preset Library and Export a preset as JSON, then Import that file on another device.":"Sim. Abra a Biblioteca de predefinições, exporte como JSON e importe o arquivo no outro dispositivo.","What is Session History?":"O que é o Histórico de sessões?","A local log of completed sessions including actual duration, laps, cues, round changes, and time adjustments.":"Um registro local de sessões concluídas com duração real, voltas, cues, mudanças de ronda e ajustes de tempo.","What happens if I refresh or the browser closes unexpectedly?":"O que acontece se eu atualizar ou o navegador fechar inesperadamente?","Game Timer stores important runtime state locally. When you return, the Recovery screen can resume, restart, or discard the unfinished session.":"Game Timer armazena localmente o estado importante. Ao voltar, Recuperação permite retomar, reiniciar ou descartar a sessão incompleta.","Use ":"Use "," when you only need a Countdown, Count Up, or Stopwatch and want to start immediately.":" quando você só precisa de Contagem regressiva, Contagem progressiva ou Cronômetro e quer começar imediatamente.","Use a structured session when you need Loops, Rounds, Sequences, Timelines, cues, display rules, or multiple sections.":"Use uma sessão estruturada quando precisar de ciclos, rondas, sequências, linhas do tempo, cues, regras de exibição ou várias seções.","Browse built-in and saved presets, mark favorites, duplicate, categorize, import, and export reusable session setups.":"Explore predefinições integradas e salvas, favorite, duplique, categorize, importe e exporte configurações reutilizáveis.","Prepare automatic or manual reminders, rule changes, sounds, and display changes.":"Prepare lembretes automáticos ou manuais, mudanças de regra, sons e alterações de exibição.","Temporarily replace the participant display with one selected item, such as Current Timer or Round, while time keeps running.":"Substitua temporariamente a tela dos participantes por um item, como o temporizador atual ou a ronda, enquanto o tempo continua.","See what has happened, what is happening now, and what remains. Adjust time or rounds without leaving Live.":"Veja o que aconteceu, o que está acontecendo e o que resta. Ajuste tempo ou rondas sem sair da sessão ao vivo.","Record a timestamp for a participant or team finishing early without stopping the timer.":"Registre o tempo de um participante ou equipe que termina antes sem parar o temporizador.","Change theme, visibility, typography, and display sizes while the session is running.":"Altere tema, visibilidade, tipografia e tamanhos enquanto a sessão está em andamento.","Review the complete session map and readiness checks before entering Ready.":"Revise o mapa completo da sessão e as verificações antes de entrar em Pronto.","Keep a lightweight local record of completed sessions, laps, cues, and live adjustments.":"Mantenha um registro local simples de sessões concluídas, voltas, cues e ajustes ao vivo.","If the page reloads unexpectedly, Game Timer can restore an unfinished session from local storage.":"Se a página recarregar inesperadamente, o Game Timer pode restaurar uma sessão inacabada do armazenamento local.","Counts down from a time limit to 00:00.":"Conta regressivamente de um limite até 00:00.","Starts at 00:00 and records elapsed time until you finish.":"Começa em 00:00 e registra o tempo decorrido até você finalizar.","Open-ended timing with Lap available during Live.":"Cronometragem sem limite com Voltas disponíveis ao vivo.","Preview timer size, title size, theme, font, and sound before starting.":"Pré-visualize tamanho do temporizador, título, tema, fonte e som antes de começar.","Set identity, start behavior, participant display, sizes, typography, theme, sound, and Curtain behavior.":"Configure identidade, início, tela dos participantes, tamanhos, tipografia, tema, som e Curtain.","Defines how the activity runs. Simple = one countdown/count-up; Loop = a repeating interval; Rounds = multiple rounds; Sequence = several sections in order.":"Define como a atividade funciona. Simples = um temporizador; Ciclo = intervalo repetido; Rondas = várias rondas; Sequência = várias seções em ordem.","A cue is a reminder or action during the session. Timed cues run automatically. Prepared cues run when you press CUE.":"Um cue é um lembrete ou ação durante a sessão. Cues programados são executados automaticamente. Cues preparados são executados ao pressionar CUE.","OPEN-ENDED LOOP":"CICLO SEM LIMITE","Choose Loop → Edit → Loop Limit → No time limit (∞). The loop runs until you finish the session.":"Escolha Ciclo → Editar → Limite do ciclo → Sem limite de tempo (∞). O ciclo continua até finalizar a sessão.","CURTAIN":"CURTAIN","In Settings → Curtain, choose what participants should see while Curtain is active: Current Timer, Main Timer, or Round/Phase. Press C to toggle Curtain during Live.":"Em Configurações → Curtain, escolha o que os participantes verão: temporizador atual, principal ou ronda/fase. Pressione C para alternar Curtain ao vivo.","LIVE PREVIEW vs FULL PREVIEW":"PRÉ-VISUALIZAÇÃO AO VIVO vs COMPLETA","The Live Preview inside Settings updates immediately. Full Preview opens the participant display at full size.":"A pré-visualização em Configurações é atualizada na hora. A visualização completa abre a tela dos participantes em tamanho total.","One timer for one activity. Use Countdown for a time limit or Count Up for open-ended elapsed time.":"Um temporizador para uma atividade. Use Contagem regressiva para limite ou Contagem progressiva para tempo aberto.","A repeating interval, with or without an overall time limit.":"Um intervalo repetido, com ou sem limite total.","Several timed rounds or attempts.":"Várias rondas ou tentativas cronometradas.","Several different phases in order.":"Várias fases diferentes em ordem.","One main timer with cues/messages at selected moments.":"Um temporizador principal com cues/mensagens em momentos definidos.","Session Map":"Mapa da sessão","Review the full run order before entering Ready.":"Revise a ordem completa antes de entrar em Pronto.","Ready Check":"Verificação de prontidão","Confirm display, sound, accessibility, and screen-awake support.":"Confirme exibição, som, acessibilidade e suporte para manter a tela ativa.","Favorites":"Favoritos","Pin presets you use often.":"Fixe as predefinições usadas com frequência.","Import / Export":"Importar / Exportar","Move presets between devices as JSON files without an account.":"Mova predefinições entre dispositivos como arquivos JSON sem conta.","Completed sessions are stored locally with actual duration, laps, cues, and adjustments.":"Sessões concluídas são armazenadas localmente com duração real, voltas, cues e ajustes.","Starts the session using the selected Immediate or 3–2–1–GO behavior.":"Inicia a sessão com o comportamento Imediato ou 3–2–1–GO selecionado.","Use fullscreen for a clean participant display. The browser requires a user click to enter fullscreen.":"Use tela cheia para uma exibição limpa. O navegador exige um clique do usuário.","Return to the Builder without starting the timer.":"Volte ao Builder sem iniciar o temporizador.","Quick Start":"Início rápido","Use Quick Timer for a simple timing need, or Create Session for structured facilitation.":"Use Quick Timer pa RT JSON":"IMPORTER JSON","+ SAVE CURRENT":"+ ENREGISTRER L’ACTUEL","All":"Tous","★ Favorites":"★ Favoris","My Presets":"Mes préréglages","Built-in":"Intégrés","BUILT-IN":"INTÉGRÉ","MY PRESET":"MON PRÉRÉGLAGE","Favorite":"Favori","DUPLICATE":"DUPLIQUER","RENAME":"RENOMMER","EXPORT":"EXPORTER","DELETE":"SUPPRIMER","No matching presets.":"Aucun préréglage correspondant.","Try another search or category.":"Essayez une autre recherche ou catégorie.","Rename Preset":"Renommer le préréglage","Name":"Nom","Category":"Catégorie","SAVE":"ENREGISTRER","Delete preset?":"Supprimer le préréglage ?","This preset will be removed from this browser.":"Ce préréglage sera supprimé de ce navigateur.","Preset imported":"Préréglage importé","Could not import this preset file.":"Impossible d’importer ce fichier de préréglage.","Preset Name":"Nom du préréglage","Preset saved":"Préréglage enregistré","SESSION FOUND":"SESSION RETROUVÉE","Your previous session did not finish":"Votre session précédente ne s’est pas terminée","RESUME SESSION":"REPRENDRE LA SESSION","RESTART SESSION":"REDÉMARRER LA SESSION","DISCARD":"ABANDONNER","APP SETTINGS":"RÉGLAGES DE L’APPLICATION","App Theme":"Thème de l’application","Follow device":"Suivre l’appareil","The app theme changes Home, Builder, and setup panels. Participant display themes remain session-specific.":"Le thème de l’application modifie l’Accueil, le Builder et les panneaux de configuration. Le thème des participants reste propre à chaque session.","LIVE QUICK CONTROLS":"CONTRÔLES RAPIDES EN DIRECT","Choose 4–6 actions for the left side of the Live control bar. Previous / Pause / Next, More, and Help remain available separately.":"Choisissez 4 à 6 actions pour la partie gauche de la barre en direct. Précédent / Pause / Suivant, Plus et Aide restent disponibles séparément.","SAVE LIVE CONTROLS":"ENREGISTRER LES CONTRÔLES EN DIRECT","Offline":"Hors ligne","The PWA can keep critical timing functions running after it has loaded.":"La PWA peut maintenir les fonctions critiques de chronométrage après chargement.","Local Storage":"Stockage local","Drafts, presets, history, and recovery data are stored in this browser/device.":"Les brouillons, préréglages, historiques et données de récupération sont stockés dans ce navigateur/appareil.","RESET DRAFT SESSION":"RÉINITIALISER LE BROUILLON","Reset draft?":"Réinitialiser le brouillon ?","The saved draft will be replaced with a new session.":"Le brouillon enregistré sera remplacé par une nouvelle session.","Draft reset":"Brouillon réinitialisé","Choose up to 6 Live controls.":"Choisissez jusqu’à 6 contrôles en direct.","Choose at least 4 Live controls.":"Choisissez au moins 4 contrôles en direct.","Live controls updated":"Contrôles en direct mis à jour","Fullscreen is not available in this browser.":"Le plein écran n’est pas disponible dans ce navigateur.","Enter a time greater than 00:00.":"Saisissez une durée supérieure à 00:00.","Close panel":"Fermer le panneau","Use the arrows or mouse wheel":"Utilisez les flèches ou la molette","Fastest Start":"Démarrage le plus rapide","Create Session":"Créer une session","Preset Library":"Bibliothèque de préréglages","FEATURES — WHAT ELSE CAN GAME TIMER DO?":"FONCTIONS — QUE PEUT FAIRE GAME TIMER DE PLUS ?","Session Status":"État de la session","Live Display Control":"Contrôle de l’affichage en direct","Run Overview":"Vue d’ensemble","Session History":"Historique des sessions","Recovery":"Récupération","Display Options":"Options d’affichage","Q&A — COMMON QUESTIONS →":"Q&R — QUESTIONS FRÉQUENTES →","Q&A — GAME TIMER":"Q&R — GAME TIMER","COMMON QUESTIONS":"QUESTIONS FRÉQUENTES","Quick answers to the questions facilitators are most likely to ask while setting up or running a session.":"Réponses rapides aux questions les plus fréquentes lors de la préparation ou de l’animation d’une session.","GETTING STARTED":"PRISE EN MAIN","DISPLAY & SOUND":"AFFICHAGE ET SON","PRESETS & RECOVERY":"PRÉRÉGLAGES ET RÉCUPÉRATION","Which mode should I choose?":"Quel mode choisir ?","Use Quick Timer for one timer. Use Simple for one structured section, Loop for one repeating interval, Alternating for two timed states that switch back and forth, Rounds for repeated attempts, Sequence for multiple phases, and Timeline for a main timer with timed cues.":"Utilisez Minuteur rapide pour un seul minuteur. Utilisez Simple pour une section structurée, Boucle pour des intervalles répétés, Manches pour des tentatives répétées, Séquence pour plusieurs phases et Chronologie pour un minuteur principal avec des cues programmés.","Use Simple for one timer, Loop for repeating intervals, Rounds for repeated attempts, Sequence for multiple phases, and Timeline for a main timer with timed cues.":"Utilisez Simple pour un minuteur, Boucle pour les intervalles répétés, Manches pour les tentatives, Séquence pour plusieurs phases et Chronologie pour un minuteur principal avec cues programmés.","What is the difference between Quick Timer and Create Session?":"Quelle est la différence entre Quick Timer et Create Session ?","Quick Timer is the fastest route to Countdown, Count Up, or Stopwatch. Create Session gives you blocks, rounds, loops, cues, participant display settings, Curtain, and reusable presets.":"Quick Timer est le moyen le plus rapide d’utiliser Compte à rebours, Compte croissant ou Chronomètre. Create Session ajoute blocs, manches, boucles, cues, réglages d’affichage, Curtain et préréglages réutilisables.","Can I run a Loop without an overall time limit?":"Puis-je utiliser une Boucle sans limite globale ?","Yes. Edit the Loop and set Loop Limit to No time limit (∞). The interval keeps repeating until you finish the session.":"Oui. Modifiez la Boucle et choisissez Sans limite de temps (∞). L’intervalle se répète jusqu’à la fin de la session.","What is the difference between Main Timer and Current Timer?":"Quelle est la différence entre le minuteur principal et le minuteur actuel ?","Main Timer represents the overall session. Current Timer represents the active section, round, interval, or transition. You can show either, both, or neither.":"Le minuteur principal représente l’ensemble de la session. Le minuteur actuel représente la section, manche, intervalle ou transition active. Vous pouvez afficher l’un, les deux ou aucun.","What is Curtain?":"Qu’est-ce que Curtain ?","Curtain is a temporary participant display mode. In Settings → Curtain, choose one item to show enlarged: Current Timer, Main Timer, or Round/Phase. Press C during Live to switch into Curtain and press C again to return.":"Curtain est un mode d’affichage temporaire. Dans Réglages → Curtain, choisissez un élément agrandi : minuteur actuel, principal ou manche/phase. Appuyez sur C en direct pour entrer, puis de nouveau sur C pour revenir.","What is a CUE?":"Qu’est-ce qu’un CUE ?","A cue is a prepared reminder or action. Timed cues run automatically. Manual cues wait until you press CUE during Live.":"Un cue est un rappel ou une action préparée. Les cues programmés s’exécutent automatiquement ; les cues manuels attendent que vous appuyiez sur CUE en direct.","Can I change time while the timer is running?":"Puis-je modifier le temps pendant que le minuteur tourne ?","Yes. Open Session Status to use quick adjustments or enter an exact amount to add or subtract. The clock remains timestamp-based and continues accurately.":"Oui. Ouvrez État de la session pour utiliser des ajustements rapides ou saisir une valeur exacte. L’horloge reste basée sur les horodatages et conserve sa précision.","Can I add or remove rounds while Live?":"Puis-je ajouter ou retirer des manches en direct ?","Yes, when the active block is Rounds. Session Status provides Round Adjustment controls and updates the total automatically.":"Oui, lorsque le bloc actif est Manches. État de la session propose l’ajustement des manches et met à jour le total automatiquement.","What does LAP do?":"À quoi sert TOUR ?","Lap records the current elapsed time without stopping the timer. It is useful when participants or teams finish at different moments. Laps are included in the session summary.":"Le tour enregistre le temps écoulé sans arrêter le minuteur. Utile lorsque des participants ou équipes terminent à des moments différents. Les tours figurent dans le résumé.","How do I show a Main Timer that started hidden?":"Comment afficher un minuteur principal initialement masqué ?","Open Other Controls and choose Show Main Timer. The same button becomes Hide Main Timer when it is visible. This is a live override and does not require returning to setup.":"Ouvrez Autres contrôles et choisissez Afficher le minuteur principal. Le même bouton devient Masquer lorsqu’il est visible. Pas besoin de revenir aux réglages.","What happens when I press Pause?":"Que se passe-t-il lorsque j’appuie sur Pause ?","The timer freezes. You can Resume or Stop. Stop always asks for confirmation before saving the result to the summary.":"Le minuteur se fige. Vous pouvez Reprendre ou Arrêter. Arrêter demande toujours confirmation avant d’enregistrer le résultat.","Can I change the theme during Live?":"Puis-je changer le thème en direct ?","Yes. Open DISPLAY and change Theme, Font, Timer Size, Display Scale, Title & Phase Size, or Timer Spacing while the session keeps running.":"Oui. Ouvrez AFFICHAGE et modifiez Thème, Police, Taille du minuteur, Échelle, Taille du titre et de la phase ou Espacement pendant que la session continue.","Why does fullscreen not start automatically?":"Pourquoi le plein écran ne démarre-t-il pas automatiquement ?","Browsers require fullscreen to be triggered by a user action. Press the Fullscreen button or F.":"Les navigateurs exigent une action de l’utilisateur pour passer en plein écran. Appuyez sur le bouton ou F.","Can I use the app without internet?":"Puis-je utiliser l’application sans Internet ?","The PWA is designed to keep critical timing features local after it has been loaded and cached. For the best offline behavior, run it from HTTPS or localhost.":"La PWA conserve localement les fonctions critiques après chargement et mise en cache. Pour un meilleur fonctionnement hors ligne, utilisez HTTPS ou localhost.","What is Maximum Legibility?":"Qu’est-ce que la Lisibilité maximale ?","It strengthens type weight, spacing, and progress visibility for weak projectors, bright rooms, or long viewing distances.":"Renforce la graisse, l’espacement et la visibilité de la progression pour les projecteurs faibles, salles lumineuses ou grandes distances.","Can I preview a 4:3 projector?":"Puis-je prévisualiser un projecteur 4:3 ?","Yes. In Settings → Accessibility & Projector, change Preview Aspect Ratio to 4:3.":"Oui. Dans Réglages → Accessibilité et projecteur, choisissez le format 4:3.","What is a Preset?":"Qu’est-ce qu’un préréglage ?","A Preset is a reusable session configuration. It stores the structure and settings, not the current runtime position.":"Un préréglage est une configuration réutilisable. Il stocke la structure et les réglages, pas la position d’exécution actuelle.","Can I save a Preset while Live?":"Puis-je enregistrer un préréglage en direct ?","Yes. Open Other Controls → Save as Preset. You will be asked to name and categorize it before it is saved.":"Oui. Ouvrez Autres contrôles → Enregistrer comme préréglage. Vous devrez le nommer et le catégoriser avant l’enregistrement.","Can I move presets to another device?":"Puis-je déplacer des préréglages vers un autre appareil ?","Yes. Open Preset Library and Export a preset as JSON, then Import that file on another device.":"Oui. Ouvrez la Bibliothèque de préréglages, exportez en JSON puis importez le fichier sur l’autre appareil.","What is Session History?":"Qu’est-ce que l’Historique des sessions ?","A local log of completed sessions including actual duration, laps, cues, round changes, and time adjustments.":"Un journal local des sessions terminées avec durée réelle, tours, cues, changements de manche et ajustements de temps.","What happens if I refresh or the browser closes unexpectedly?":"Que se passe-t-il si j’actualise ou si le navigateur se ferme de façon inattendue ?","Game Timer stores important runtime state locally. When you return, the Recovery screen can resume, restart, or discard the unfinished session.":"Game Timer stocke localement l’état important. À votre retour, Récupération permet de reprendre, redémarrer ou abandonner la session inachevée.","Use ":"Utilisez "," when you only need a Countdown, Count Up, or Stopwatch and want to start immediately.":" lorsque vous avez seulement besoin d’un compte à rebours, d’un compte croissant ou d’un chronomètre et souhaitez démarrer immédiatement.","Use a structured session when you need Loops, Rounds, Sequences, Timelines, cues, display rules, or multiple sections.":"Utilisez une session structurée si vous avez besoin de boucles, manches, séquences, chronologies, cues, règles d’affichage ou plusieurs sections.","Browse built-in and saved presets, mark favorites, duplicate, categorize, import, and export reusable session setups.":"Parcourez les préréglages intégrés et enregistrés, ajoutez aux favoris, dupliquez, catégorisez, importez et exportez des configurations réutilisables.","Prepare automatic or manual reminders, rule changes, sounds, and display changes.":"Préparez des rappels automatiques ou manuels, changements de règle, sons et modifications d’affichage.","Temporarily replace the participant display with one selected item, such as Current Timer or Round, while time keeps running.":"Remplacez temporairement l’affichage des participants par un élément, comme le minuteur actuel ou la manche, pendant que le temps continue.","See what has happened, what is happening now, and what remains. Adjust time or rounds without leaving Live.":"Voyez ce qui s’est passé, ce qui se passe et ce qui reste. Ajustez le temps ou les manches sans quitter le direct.","Record a timestamp for a participant or team finishing early without stopping the timer.":"Enregistrez le temps d’un participant ou d’une équipe qui termine plus tôt sans arrêter le minuteur.","Change theme, visibility, typography, and display sizes while the session is running.":"Modifiez le thème, la visibilité, la typographie et les tailles pendant la session.","Review the complete session map and readiness checks before entering Ready.":"Vérifiez la carte complète de la session et les contrôles avant de passer à Prêt.","Keep a lightweight local record of completed sessions, laps, cues, and live adjustments.":"Conservez un journal local léger des sessions terminées, tours, cues et ajustements en direct.","If the page reloads unexpectedly, Game Timer can restore an unfinished session from local storage.":"Si la page se recharge de manière inattendue, Game Timer peut restaurer une session inachevée depuis le stockage local.","Counts down from a time limit to 00:00.":"Compte à rebours depuis une durée limite jusqu’à 00:00.","Starts at 00:00 and records elapsed time until you finish.":"Démarre à 00:00 et enregistre le temps écoulé jusqu’à la fin.","Open-ended timing with Lap available during Live.":"Chronométrage sans limite avec Tours disponibles en direct.","Preview timer size, title size, theme, font, and sound before starting.":"Prévisualisez la taille du minuteur, du titre, le thème, la police et le son avant de démarrer.","Set identity, start behavior, participant display, sizes, typography, theme, sound, and Curtain behavior.":"Configurez l’identité, le démarrage, l’affichage des participants, les tailles, la typographie, le thème, le son et Curtain.","Defines how the activity runs. Simple = one countdown/count-up; Loop = a repeating interval; Rounds = multiple rounds; Sequence = several sections in order.":"Définit le déroulement de l’activité. Simple = un minuteur ; Boucle = intervalle répété ; Manches = plusieurs manches ; Séquence = plusieurs sections en ordre.","A cue is a reminder or action during the session. Timed cues run automatically. Prepared cues run when you press CUE.":"Un cue est un rappel ou une action pendant la session. Les cues programmés s’exécutent automatiquement. Les cues préparés s’exécutent lorsque vous appuyez sur CUE.","OPEN-ENDED LOOP":"BOUCLE SANS LIMITE","Choose Loop → Edit → Loop Limit → No time limit (∞). The loop runs until you finish the session.":"Choisissez Boucle → Modifier → Limite de la boucle → Sans limite de temps (∞). La boucle continue jusqu’à la fin de la session.","CURTAIN":"CURTAIN","In Settings → Curtain, choose what participants should see while Curtain is active: Current Timer, Main Timer, or Round/Phase. Press C to toggle Curtain during Live.":"Dans Réglages → Curtain, choisissez ce que verront les participants : minuteur actuel, principal ou manche/phase. Appuyez sur C pour basculer Curtain en direct.","LIVE PREVIEW vs FULL PREVIEW":"APERÇU EN DIRECT vs APERÇU COMPLET","The Live Preview inside Settings updates immediately. Full Preview opens the participant display at full size.":"L’aperçu dans Réglages se met à jour immédiatement. L’aperçu complet ouvre l’affichage des participants en plein format.","One timer for one activity. Use Countdown for a time limit or Count Up for open-ended elapsed time.":"Un minuteur pour une activité. Utilisez Compte à rebours pour une limite ou Compte croissant pour un temps ouvert.","A repeating interval, with or without an overall time limit.":"Un intervalle répété, avec ou sans limite globale.","Several timed rounds or attempts.":"Plusieurs manches ou tentatives chronométrées.","Several different phases in order.":"Plusieurs phases différentes dans l’ordre.","One main timer with cues/messages at selected moments.":"Un minuteur principal avec cues/messages à des moments choisis.","Session Map":"Carte de la session","Review the full run order before entering Ready.":"Vérifiez l’ordre complet avant de passer à Prêt.","Ready Check":"Vérification avant départ","Confirm display, sound, accessibility, and screen-awake support.":"Confirmez l’affichage, le son, l’accessibilité et la prise en charge de l’écran actif.","Favorites":"Favoris","Pin presets you use often.":"Épinglez les préréglages que vous utilisez souvent.","Import / Export":"Importer / Exporter","Move presets between devices as JSON files without an account.":"Déplacez les préréglages entre appareils sous forme de fichiers JSON sans compte.","Completed sessions are stored locally with actual duration, laps, cues, and adjustments.":"Les sessions terminées sont stockées localement avec durée réelle, tours, cues et ajustements.","Starts the session using the selected Immediate or 3–2–1–GO behavior.":"Démarre la session selon le mode Immédiat ou 3–2–1–GO choisi.","Use fullscreen for a clean participant display. The browser requires a user click to enter fullscreen.":"Utilisez le plein écran pour un affichage propre. Le navigateur exige un clic de l’utilisateur.","Return to the Builder without starting the timer.":"Retournez au Builder sans démarrer le minuteur.","Quick Start":"Démarrage rapide","Use Quick Timer for a simple timing need, or Create Session for structured facilitation.":"Utilisez Quick Timer pour un besoin simple ou Create Session pour une facilitation structurée.","Presets":"Préréglages","Saved configurations can be loaded and reused later.":"Les configurations enregistrées peuvent être chargées et réutilisées plus tard.","Show a large message such as MOVE!, STOP!, or a rule change.":"Affichez un grand message comme CHANGEZ !, STOP ! ou un changement de règle.","Run a cue that you prepared before the session. Timed cues run automatically.":"Exécutez un cue préparé avant la session. Les cues programmés s’exécutent automatiquement.","Show or hide participant information and adjust the live display while the session is running.":"Affichez ou masquez les informations et ajustez l’affichage en direct pendant la session.","Record the current time without stopping the timer. Works with Countdown, Count Up, Stopwatch, and Sessions.":"Enregistrez le temps actuel sans arrêter le minuteur. Fonctionne avec compte à rebours, compte croissant, chronomètre et sessions.","See elapsed/remaining time, current section, rounds, laps, and make quick timing adjustments.":"Consultez le temps écoulé/restant, la section actuelle, les manches, tours et effectuez des ajustements rapides.","Enter or exit fullscreen.":"Entrer ou sortir du plein écran.","Other Controls":"Autres contrôles","Repeat/restart the current section, show or hide the Main Timer, finish, or save the session as a preset.":"Répétez/redémarrez la section actuelle, affichez ou masquez le minuteur principal, terminez ou enregistrez la session comme préréglage.","Curtain replaces the normal participant display with the single item selected in Settings → Curtain. It can enlarge the Current Timer, Main Timer, or Round/Phase. The timer keeps running. Press C or the Return icon to switch back.":"Curtain remplace l’affichage normal par l’élément choisi dans Réglages → Curtain. Il peut agrandir le minuteur actuel, principal ou manche/phase. Le temps continue. Appuyez sur C ou Retour pour revenir.","Shortcuts":"Raccourcis","Space Pause/Resume · N Next · B Previous · M Message · C Curtain/Return · F Fullscreen.":"Espace Pause/Reprendre · N Suivant · B Précédent · M Message · C Curtain/Retour · F Plein écran.","Starts immediately with no 3–2–1.":"Démarre immédiatement sans 3–2–1.","Show a countdown before the timer starts.":"Affiche un compte à rebours avant le démarrage.","TIMER SIZE":"TAILLE DU MINUTEUR","TITLE SIZE":"TAILLE DU TITRE","THEME":"THÈME","FONT":"POLICE","SOUND":"SON","Enable Start & Finish sounds":"Activer les sons de début et de fin","▶ Test Start":"▶ Tester le démarrage","▶ Test Finish":"▶ Tester la fin","DONE":"TERMINÉ","? Help":"? Aide","? HELP":"? AIDE","Display Font":"Police d’affichage","FULL PREVIEW":"APERÇU COMPLET","RUN OVERVIEW →":"VUE D’ENSEMBLE →","10-minute challenge / open-ended elapsed time":"Défi de 10 minutes / temps
